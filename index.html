<script>
'use strict';
/* ============================================================
   EMBERFALL v2 — THE EMBER DEPTHS — a tiny action RPG
   Surface world + 5 dungeon floors, 5 bosses, shrine trials,
   elites, chests, torch lighting, lava.
   Everything (world, art, sound) is generated in code.
   Built from: wip/p01..p10 via wip/build.ps1
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let VW = 0, VH = 0;
function resize(){ VW = cvs.width = window.innerWidth; VH = cvs.height = window.innerHeight; lightCvs.width=VW; lightCvs.height=VH; }
window.addEventListener('resize', resize);

/* ---------------- utils ---------------- */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const rnd=(a=1,b)=> b===undefined? Math.random()*a : a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

function hash2(x,y){
  let n = Math.sin(x*127.1 + y*311.7)*43758.5453;
  return n - Math.floor(n);
}
const smooth=t=>t*t*(3-2*t);
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  const u=smooth(xf), v=smooth(yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y){ return vnoise(x,y)*0.55 + vnoise(x*2.13,y*2.13)*0.28 + vnoise(x*4.31,y*4.31)*0.17; }

/* ---------------- audio ---------------- */
let AC=null, muted=false, musicT=0;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type='square',vol=0.12,slide=0,when=0){
  const a=ac(); if(!a||muted) return;
  const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur=0.15,vol=0.15){
  const a=ac(); if(!a||muted) return;
  const len=(a.sampleRate*dur)|0, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function sfx(n){
  switch(n){
    case 'swing':  tone(320,0.08,'sawtooth',0.05,-180); break;
    case 'hit':    tone(180,0.09,'square',0.14,-90); noiseBurst(0.08,0.1); break;
    case 'hurt':   tone(140,0.2,'sawtooth',0.16,-80); break;
    case 'coin':   tone(880,0.07,'square',0.08); tone(1320,0.09,'square',0.08,0,0.06); break;
    case 'potion': tone(500,0.1,'sine',0.12,200); tone(700,0.12,'sine',0.1,200,0.08); break;
    case 'xp':     tone(1046,0.06,'triangle',0.07); break;
    case 'level':  [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.14,0,i*0.09)); break;
    case 'die':    tone(300,0.4,'sawtooth',0.15,-250); noiseBurst(0.3,0.12); break;
    case 'slam':   tone(90,0.35,'sawtooth',0.2,-40); noiseBurst(0.35,0.2); break;
    case 'arrow':  tone(700,0.06,'sawtooth',0.05,-300); break;
    case 'bow':    tone(520,0.05,'triangle',0.06,-320); noiseBurst(0.04,0.03); break;
    case 'quest':  [659,784,988].forEach((f,i)=>tone(f,0.14,'square',0.1,0,i*0.1)); break;
    case 'buy':    tone(660,0.08,'square',0.1); tone(880,0.1,'square',0.1,0,0.07); break;
    case 'chest':  tone(392,0.1,'triangle',0.1); tone(523,0.12,'triangle',0.1,0,0.09); tone(784,0.16,'triangle',0.12,0,0.18); break;
    case 'stairs': tone(300,0.3,'triangle',0.1,-150); tone(200,0.3,'triangle',0.08,-100,0.12); break;
    case 'summon': tone(340,0.28,'sawtooth',0.1,-200); noiseBurst(0.2,0.08); break;
    case 'denied': tone(160,0.15,'square',0.12,-40); break;
    case 'bossroar': tone(70,0.7,'sawtooth',0.25,30); noiseBurst(0.6,0.18); break;
    case 'shrine': tone(392,0.22,'sine',0.12,60); tone(523,0.3,'sine',0.1,80,0.1); noiseBurst(0.25,0.06); break;
    case 'reward': [784,988,1175].forEach((f,i)=>tone(f,0.15,'triangle',0.12,0,i*0.09)); break;
    case 'blink':  tone(180,0.22,'sine',0.12,520); break;
    case 'fire':   tone(300,0.12,'sawtooth',0.07,-140); noiseBurst(0.08,0.05); break;
    case 'rock':   tone(120,0.16,'square',0.12,-60); noiseBurst(0.12,0.1); break;
    case 'dash':   tone(420,0.16,'sawtooth',0.1,-280); break;
    case 'nova':   tone(140,0.5,'sawtooth',0.18,-90); noiseBurst(0.45,0.16); break;
  }
}
const SCALE=[220,261,293,329,392,440,523,587];
function musicTick(dt){
  if(!AC||muted||state.mode!=='play') return;
  musicT-=dt;
  if(musicT<=0){
    musicT=rnd(0.5,1.1);
    const n=SCALE[(Math.random()*SCALE.length)|0];
    const minor = state.floor>0;
    tone(minor? n*0.89 : n, rnd(0.5,1.2),'triangle',0.028);
    if(Math.random()<0.3) tone(minor?55:110,0.8,'sine',0.04);
  }
}

/* ---------------- world ---------------- */
const TS=32;
const T_WATER=0, T_SAND=1, T_GRASS=2, T_CORRUPT=3, T_WALL=4, T_FLOOR=5, T_LAVA=6, T_STAIRSDOWN=7, T_STAIRSUP=8, T_SECRET=9,
      T_SNOW=10, T_DESERT=11, T_SWAMP=12, T_MUSH=13, T_CRIMSON=14, T_ASH=15,
      T_SAVANNA=16, T_JUNGLE=17, T_BADLANDS=18, T_CHERRY=19, T_VOLCANIC=20, T_MISTWOOD=21,
      T_SWITCH=22, T_DOOR=23;
const SOLID = t => t===T_WATER || t===T_WALL || t===T_SECRET || t===T_DOOR;
const MAXFLOOR=8;   // five original depths plus three more sealed floors below
const BIOME_NAME={
  [T_GRASS]:'Verdant Fields', [T_CORRUPT]:'The Corruption', [T_SNOW]:'Frostpeak Tundra',
  [T_DESERT]:'Golden Desert', [T_SWAMP]:'The Murk Swamp', [T_MUSH]:'Fungal Hollow',
  [T_CRIMSON]:'Crimson Scar', [T_ASH]:'Ashen Wastes', [T_SAVANNA]:'Amber Savanna',
  [T_JUNGLE]:'Emerald Jungle', [T_BADLANDS]:'Rusted Badlands', [T_CHERRY]:'Blossom Grove',
  [T_VOLCANIC]:'Cinder Caldera', [T_MISTWOOD]:'The Mistwood',
};
const BIOME_SPAWNS={
  [T_GRASS]:   ['slime','wolf','zombie','bandit','slime','wolf','zombie','boar'],
  [T_CORRUPT]: ['wraith','skeleton','muck','shade'],
  [T_SNOW]:    ['yeti','wolf','zombie','spider','direwolf','frostwisp'],
  [T_DESERT]:  ['scorpion','scorpion','zombie','bandit','vulture'],
  [T_SWAMP]:   ['muck','muck','spider','slime','sporecap','leech','hornet'],
  [T_MUSH]:    ['sporecap','sporecap','spider','slime','leech'],
  [T_CRIMSON]: ['imp','scorpion','wraith','spider'],
  [T_ASH]:     ['imp','imp','wraith','zombie','skeleton'],
  [T_SAVANNA]: ['boar','wolf','bandit','scorpion','vulture'],
  [T_JUNGLE]:  ['hornet','hornet','ape','spider','slime','leech'],
  [T_BADLANDS]:['bandit','bandit','scorpion','vulture','imp'],
  [T_CHERRY]:  ['sprite','sprite','wolf','slime','boar'],
  [T_VOLCANIC]:['emberite','imp','hound','emberite','scorpion'],
  [T_MISTWOOD]:['wisp','wisp','shade','spider','zombie','bandit'],
};
const FLNAMES={1:'The Bone Hollows',2:'The Molten Gaol',3:'The Wailing Crypt',4:'The Ashen Deep',5:'The Ember Throne',6:'The Sunken Sanctum',7:'The Glass Foundry',8:'The Core Forge'};
const FLOORBOSS={1:'boneking',2:'cindergolem',3:'malachar',4:'pyrelord',5:'tyrant',6:'drownedking',7:'shardlord',8:'coregolem'};
let mapW=2000, mapH=2000;
let tiles=null, tileVar=null, tempCat=null;   // 0=cold,1=temperate,2=hot — keeps cold biomes off warm ones
const VILLAGE={x:1000,y:1000,r:16};
const CORRUPT={x:1360,y:1400,r:80};
let trees=[], treeGrid=new Map(), rocks=[], flowers=[], torches=[], chests=[], buildings=[], props=[], shrines=[], lavas=[], switches=[];
let entrance=null, returnPortal=null;

function tileAt(tx,ty){ return (tx<0||ty<0||tx>=mapW||ty>=mapH)?T_WALL:tiles[ty*mapW+tx]; }
function setTile(tx,ty,t){ if(tx>=0&&ty>=0&&tx<mapW&&ty<mapH) tiles[ty*mapW+tx]=t; }
function tileAtPx(x,y){ return tileAt(Math.floor(x/TS),Math.floor(y/TS)); }

/* ---------- surface generation (1000x1000, 9 biomes) ---------- */
/* bilinear-sampled coarse climate field — keeps a million tiles cheap */
function coarseField(fn){
  const sw=(mapW>>2)+2, sh=(mapH>>2)+2;
  const m=new Float32Array(sw*sh);
  for(let gy=0;gy<sh;gy++)for(let gx=0;gx<sw;gx++) m[gy*sw+gx]=fn(gx*4,gy*4);
  return (x,y)=>{
    const gx=x/4, gy=y/4;
    const x0=gx|0, y0=gy|0, fx=gx-x0, fy=gy-y0;
    const a=m[y0*sw+x0], b=m[y0*sw+x0+1], c=m[(y0+1)*sw+x0], d=m[(y0+1)*sw+x0+1];
    return a*(1-fx)*(1-fy)+b*fx*(1-fy)+c*(1-fx)*fy+d*fx*fy;
  };
}
function genSurface(){
  mapW=1000; mapH=1000;
  tiles=new Uint8Array(mapW*mapH);
  tileVar=new Float32Array(mapW*mapH);
  tempCat=new Uint8Array(mapW*mapH);
  trees=[]; treeGrid=new Map(); rocks=[]; flowers=[]; torches=[]; chests=[]; buildings=[]; props=[]; shrines=[]; lavas=[]; switches=[]; returnPortal=null;
  // coarse height field (half resolution) keeps a million-tile map fast to build
  const hw=(mapW>>1)+2, hh=(mapH>>1)+2;
  const hmap=new Float32Array(hw*hh);
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++)
    hmap[y*hw+x]=fbm(x*0.15+13.7, y*0.15+5.1);
  const hs=(x,y)=>{
    const fx=x*0.5, fy=y*0.5;
    const x0=fx|0, y0=fy|0, tx=fx-x0, ty=fy-y0;
    const a=hmap[y0*hw+x0], b=hmap[y0*hw+x0+1];
    const c=hmap[(y0+1)*hw+x0], d=hmap[(y0+1)*hw+x0+1];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  const tempOf=coarseField((x,y)=>fbm(x*0.021+91.3, y*0.021+17.7));
  const moistOf=coarseField((x,y)=>fbm(x*0.024+7.1, y*0.024+251.3));
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const i=y*mapW+x;
    let t = hs(x,y)<0.345 ? T_WATER : T_GRASS;
    if(dist(x,y,VILLAGE.x,VILLAGE.y) < VILLAGE.r) t = T_GRASS;
    if(dist(x,y,CORRUPT.x,CORRUPT.y) < 44) t = T_GRASS;
    if(t===T_GRASS){
      const d=dist(x,y,CORRUPT.x,CORRUPT.y);
      const edge = CORRUPT.r*(0.72+0.5*vnoise(x*0.045,y*0.045));
      if(d<edge) t=T_CORRUPT;
      else if(d<edge*1.16) t=T_VOLCANIC;      // molten scar right around the corruption
      else if(d<edge*1.62) t=T_ASH;           // wider fallout ring
      else {
        const tmp=tempOf(x,y), moi=moistOf(x,y);
        const patch=vnoise(x*0.028+77.7, y*0.028+33.3);
        if(dist(x,y,VILLAGE.x,VILLAGE.y) < VILLAGE.r+12) t=T_GRASS;  // Emberfall village always stands on open plains
        else {
          // Minecraft-style temperature bands: cold never borders warm.
          // 0=cold (<0.40), 1=temperate (0.40-0.68), 2=hot (>0.68)
          const cat = tmp<0.40 ? 0 : tmp>0.68 ? 2 : 1;
          tempCat[i]=cat;
          if(cat===0) t = moi>0.50 ? T_MISTWOOD : (patch>0.70 ? T_CHERRY : T_SNOW);
          else if(cat===2){
            if(moi<0.34) t=T_BADLANDS;
            else if(moi<0.52) t=T_DESERT;
            else if(moi>0.72) t=T_JUNGLE;
            else t=T_CRIMSON;
          } else {
            if(moi>0.70) t=T_JUNGLE;
            else if(moi>0.665) t=T_SWAMP;
            else if(moi>0.585) t=T_MUSH;
            else if(tmp>0.52 && moi<0.42) t=T_SAVANNA;
            else t=T_GRASS;
          }
        }
      }
    }
    tiles[i]=t;
    tileVar[i]=hash2(x*3.3,y*7.7);
  }
  // temperature-border smoothing: never let a cold tile sit directly beside a hot one
  // (single-tile pockets get nudged toward their neighbours' climate)
  for(let y=1;y<mapH-1;y++)for(let x=1;x<mapW-1;x++){
    const i=y*mapW+x; let t=tiles[i];
    if(t===T_WATER||t===T_LAVA||t===T_CORRUPT||t===T_STAIRSDOWN) continue;
    const c=tempCat[i];
    let n0=0,n1=0,n2=0;
    // read neighbours' cats directly
    const iL=(y)*mapW+(x-1), iR=(y)*mapW+(x+1), iU=(y-1)*mapW+x, iD=(y+1)*mapW+x;
    n0+=(tempCat[iL]===0)+(tempCat[iR]===0)+(tempCat[iU]===0)+(tempCat[iD]===0);
    n1+=(tempCat[iL]===1)+(tempCat[iR]===1)+(tempCat[iU]===1)+(tempCat[iD]===1);
    n2+=(tempCat[iL]===2)+(tempCat[iR]===2)+(tempCat[iU]===2)+(tempCat[iD]===2);
    let maj=c; if(n0>=n1&&n0>=n2)maj=0; else if(n1>=n0&&n1>=n2)maj=1; else if(n2>n0&&n2>n1)maj=2;
    if(maj!==c && (c===0||maj===0) && (c===2||maj===2)){
      // cold↔hot boundary: re-roll this tile into the majority climate band
      const moi=moistOf(x,y), patch=vnoise(x*0.028+77.7, y*0.028+33.3);
      if(maj===0) t = moi>0.50 ? T_MISTWOOD : (patch>0.70 ? T_CHERRY : T_SNOW);
      else if(maj===2){
        if(moi<0.34) t=T_BADLANDS;
        else if(moi<0.52) t=T_DESERT;
        else if(moi>0.72) t=T_JUNGLE;
        else t=T_CRIMSON;
      } else {
        if(moi>0.70) t=T_JUNGLE;
        else if(moi>0.665) t=T_SWAMP;
        else if(moi>0.585) t=T_MUSH;
        else if(tmp>0.52 && moi<0.42) t=T_SAVANNA;
        else t=T_GRASS;
      }
      tiles[i]=t; tempCat[i]=maj;
    }
  }
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const i=y*mapW+x;
    if(tiles[i]!==T_GRASS && tiles[i]!==T_CORRUPT) continue;
    if(tileAt(x-1,y)===T_WATER||tileAt(x+1,y)===T_WATER||tileAt(x,y-1)===T_WATER||tileAt(x,y+1)===T_WATER)
      tiles[i]=T_SAND;
  }
  const ex=CORRUPT.x, ey=CORRUPT.y;
  for(let y=1;y<mapH-1;y++)for(let x=1;x<mapW-1;x++){
    const t=tiles[y*mapW+x];
    const px=x*TS+TS/2, py=y*TS+TS/2;
    const inVillage = dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.r;
    const nearPortal = dist(x,y,ex,ey)<5.4;
    const n=vnoise(x*0.16+40, y*0.16+9);
    if(t===T_WATER||t===T_SAND) continue;
    if(inVillage||nearPortal) continue;
    const dens=hash2(x*9,y*4);
    const ve=hash2(x*5,y*2);
    switch(t){
      case T_GRASS:
      case T_CORRUPT:
        if(n>0.80 && dens<0.10 && trees.length<14000){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:9, kind:t===T_CORRUPT?'corrupt':'oak', corrupt:t===T_CORRUPT, sway:rnd(TAU), big:hash2(x,y)>0.6};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.18 && ve<0.02 && rocks.length<3000){
          rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), corrupt:t===T_CORRUPT});
        }
        break;
      case T_SNOW:
        if(n>0.74 && dens<0.11){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:8, kind:'pine', sway:rnd(TAU), big:hash2(x,y)>0.55};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.30 && ve<0.02){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,9), ice:hash2(x,y)>0.5}); }
        break;
      case T_DESERT:
        if(n>0.70 && dens<0.035){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:5, kind:'cactus', sway:rnd(TAU), big:hash2(x,y)>0.7};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.26 && ve<0.015){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), sand:true}); }
        break;
      case T_SWAMP:
        if(n>0.78 && dens<0.07){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:6, kind:'dead', sway:rnd(TAU)};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.32 && ve<0.012){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(4,7), mud:true}); }
        break;
      case T_MUSH:
        if(n>0.68 && dens<0.06){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:5, kind:'mush', sway:rnd(TAU), big:hash2(x,y)>0.62};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        }
        break;
      case T_CRIMSON:
        if(n>0.62 && dens<0.05){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:5, kind:'crystal', sway:rnd(TAU), big:hash2(x,y)>0.5};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.30 && ve<0.02){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), crimsonrock:true}); }
        break;
      case T_ASH:
        if(n>0.74 && dens<0.06){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:5, kind:'burnt', sway:rnd(TAU)};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.28 && ve<0.015){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,9), ashrock:true}); }
        break;
      case T_SAVANNA:
        if(n>0.72 && dens<0.035){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:6, kind:'acacia', sway:rnd(TAU), big:hash2(x,y)>0.6};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(n<0.30 && ve<0.015){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), dry:true}); }
        break;
      case T_JUNGLE:
        if(n>0.60 && dens<0.16){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:6, kind:'palm', sway:rnd(TAU), big:hash2(x,y)>0.45};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        }
        break;
      case T_BADLANDS:
        if(n>0.62 && dens<0.05){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(8,14), mesa:true}); }
        break;
      case T_CHERRY:
        if(n>0.70 && dens<0.09){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:8, kind:'cherry', sway:rnd(TAU), big:hash2(x,y)>0.55};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(hash2(x*7.1,y*3.3)<0.02 && flowers.length<7000)
          flowers.push({x:px+rnd(-12,12), y:py+rnd(-12,12), c:pick(['#ffb7c9','#ff8fb3','#ffd1dc']), sway:rnd(TAU)});
        break;
      case T_VOLCANIC:
        if(dens<0.010 && tileAt(x,y)===T_VOLCANIC){ setTile(x,y,T_LAVA); lavas.push({x:px,y:py}); }
        else if(n>0.66 && ve<0.02){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(6,10), basalt:true}); }
        break;
      case T_MISTWOOD:
        if(n>0.62 && dens<0.12){
          const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:7, kind:'mist', sway:rnd(TAU), big:hash2(x,y)>0.5};
          trees.push(tr); treeGrid.set(x+','+y,tr);
        } else if(hash2(x*5,y*2)<0.006){ rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), moss:true}); }
        break;
    }
    if(t===T_GRASS && hash2(x*7.1,y*3.3)<0.008 && flowers.length<7000)
      flowers.push({x:px+rnd(-12,12), y:py+rnd(-12,12), c:pick(['#f2d16b','#e26d8f','#c9e26d','#e2a23c','#b98fe2']), sway:rnd(TAU)});
  }
  // brazier torches ringing the dungeon portal
  for(const [ox,oy] of [[-2.2,-2.2],[2.2,-2.2],[-2.2,2.2],[2.2,2.2]]){
    torches.push({x:(ex+ox)*TS, y:(ey+oy)*TS, side:[0,0], fl:rnd(TAU)});
  }
  const hx=VILLAGE.x, hy=VILLAGE.y;
  buildings.push({x:(hx-4)*TS, y:(hy-5)*TS, w:3*TS, h:2.6*TS, roof:'#8a4b32', wall:'#d8c49a', door:true});
  buildings.push({x:(hx+2)*TS, y:(hy-4.6)*TS, w:2.4*TS, h:2.2*TS, roof:'#6e6a8f', wall:'#cfc4a8', door:true});
  buildings.push({x:(hx-1)*TS, y:(hy+4)*TS,  w:2.2*TS, h:2*TS,   roof:'#4e7a5c', wall:'#d3c8ab', door:true});
  props.push({type:'stall', x:(hx+4.6)*TS, y:(hy+1.5)*TS});
  buildings.push({x:(hx+4.3)*TS, y:(hy+1.2)*TS, w:1.4*TS, h:1.1*TS, roof:'#b3402f', wall:'#7a5a3a', door:false, stall:true});
  props.push({type:'well', x:(hx+0.2)*TS, y:(hy-0.4)*TS});
  buildings.push({x:(hx-0.1)*TS, y:(hy-0.7)*TS, w:1*TS, h:1*TS, roof:'#555', wall:'#888', door:false, well:true});
  // dungeon entrance in the heart of the corruption (ex/ey declared at the top
  // so the decoration pass can keep a proper portal clearing — no trees hiding
  // the way down)
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const t=tileAt(ex+dx,ey+dy);
    if(t===T_WATER||t===T_GRASS) setTile(ex+dx,ey+dy, dx===0&&dy===0?T_STAIRSDOWN:T_CORRUPT);
  }
  setTile(ex,ey,T_STAIRSDOWN);
  entrance={x:ex*TS+TS/2, y:ey*TS+TS/2};
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const t=tiles[y*mapW+x];
    if((t===T_GRASS||t===T_CORRUPT) && dist(x,y,ex,ey)<6) tiles[y*mapW+x]=T_CORRUPT;
  }
  /* ---------- biome guardian altars ----------
     Four hidden altars, one per far-flung biome. Press E at an altar to
     challenge its guardian; defeating it unlocks a permanent ability.   */
  state.biomeAltars=[];
  const ALTARS=[
    {t:T_SNOW,    name:'Frostpeak Altar', guardian:'FROSTMAW',         boss:'frostmaw',    ability:'dash',     accent:'#9ad1ff', minCor:100},
    {t:T_SWAMP,   name:'Murk Altar',      guardian:'THE BOG QUEEN',    boss:'bogqueen',    ability:'regenPlus',accent:'#7ecba0', minCor:100},
    {t:T_DESERT,  name:'Dune Altar',      guardian:'THE DUNE SERPENT', boss:'duneserpent', ability:'whirl',    accent:'#ffb36b', minCor:100},
    {t:T_VOLCANIC,name:'Cinder Altar',    guardian:'THE MAGMA TYRANT', boss:'magmatyrant', ability:'pierce',   accent:'#ff8a5e', minCor:40}, // the caldera encircles the corruption itself
  ];
  for(const g of ALTARS){
    let ax=-1, ay=-1;
    for(let y=8;y<mapH-8 && ax<0;y+=2)for(let x=8;x<mapW-8;x+=2){
      if(tileAt(x,y)!==g.t) continue;
      if(dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.r+40) continue;
      if(dist(x,y,CORRUPT.x,CORRUPT.y)<g.minCor) continue;
      if(dist(x,y,ex,ey)<60) continue;
      let near=false;
      for(const a of state.biomeAltars) if(dist(x,y,(a.x/TS)|0,(a.y/TS)|0)<80) near=true;
      if(near) continue;
      let wet=false;
      for(let dy=-3;dy<=3&&!wet;dy++)for(let dx=-3;dx<=3;dx++)
        if(SOLID(tileAt(x+dx,y+dy))||tileAt(x+dx,y+dy)===T_LAVA){ wet=true; break; }
      if(wet) continue;
      ax=x; ay=y; break;
    }
    if(ax<0) continue;
    // stamp a clean disc of the home biome so the ritual ground reads clearly
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)
      if(dist(dx,dy,0,0)<=3.2 && tileAt(ax+dx,ay+dy)!==T_LAVA) setTile(ax+dx,ay+dy,g.t);
    trees=trees.filter(tr=>dist(tr.x/TS,tr.y/TS,ax,ay)>6);
    rocks=rocks.filter(rk=>dist(rk.x/TS,rk.y/TS,ax,ay)>6);
    flowers=flowers.filter(f2=>dist(f2.x/TS,f2.y/TS,ax,ay)>6);
    treeGrid.clear();
    for(const tr of trees){ const tx=Math.floor(tr.x/TS), ty=Math.floor(tr.y/TS); if(!treeGrid.has(tx+','+ty)) treeGrid.set(tx+','+ty,tr); }
    state.biomeAltars.push({x:ax*TS+TS/2, y:ay*TS+TS/2, biome:g.t, name:g.name,
      guardian:g.guardian, boss:g.boss, ability:g.ability, accent:g.accent,
      done:!!state.biomeDead[g.boss]});
    for(const [ox,oy] of [[-3,-3],[3,-3],[-3,3],[3,3]])
      torches.push({x:(ax+ox)*TS, y:(ay+oy)*TS, side:[0,0], fl:rnd(TAU)});
  }
}

/* ---------- dungeon generation (rooms + corridors + arenas) ---------- */
function genDungeon(fl){
  mapW=160+fl*40; mapH=160+fl*40;
  tiles=new Uint8Array(mapW*mapH); tiles.fill(T_WALL);
  tileVar=new Float32Array(mapW*mapH);
  trees=[]; treeGrid=new Map(); rocks=[]; flowers=[]; torches=[]; chests=[]; buildings=[]; props=[]; shrines=[]; lavas=[]; switches=[]; entrance=null; returnPortal=null;
  const rooms=[];
  const overlap=(x,y,w,h)=>{
    for(const r of rooms)
      if(x < r.x+r.w+3 && x+w+3 > r.x && y < r.y+r.h+3 && y+h+3 > r.y) return true;
    return false;
  };
  const nRooms = 14+fl*4;
  let tries=0;
  while(rooms.length<nRooms && tries++<900){
    const w=7+((Math.random()*8)|0), h=6+((Math.random()*7)|0);
    const x=2+((Math.random()*(mapW-w-4))|0), y=2+((Math.random()*(mapH-h-4))|0);
    if(overlap(x,y,w,h)) continue;
    rooms.push({x,y,w,h,cx:(x+w/2)|0,cy:(y+h/2)|0});
  }
  const carve=(tx,ty)=>{ if(tx>0&&ty>0&&tx<mapW-1&&ty<mapH-1) setTile(tx,ty,T_FLOOR); };
  // connect rooms with wide L corridors
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    let x=a.cx, y=a.cy;
    while(x!==b.cx){ carve(x,y); carve(x,y+1); x += x<b.cx?1:-1; }
    while(y!==b.cy){ carve(x,y); carve(x+1,y); y += y<b.cy?1:-1; }
  }
  for(const r of rooms)
    for(let dy=0;dy<r.h;dy++)for(let dx=0;dx<r.w;dx++) carve(r.x+dx,r.y+dy);
  /* --- boss arena (every floor has a guardian) --- */
  const bw=fl===5?26:20, bh=fl===5?17:13;
  let bx=(mapW-bw)/2|0, by=(mapH-bh)/2|0;
  for(let t=0;t<120;t++){
    const nx=2+((Math.random()*(mapW-bw-4))|0), ny=2+((Math.random()*(mapH-bh-4))|0);
    if(!overlap(nx-2,ny-2,bw+4,bh+4)){ bx=nx; by=ny; break; }
  }
  const bossRoom={x:bx,y:by,w:bw,h:bh,cx:(bx+bw/2)|0,cy:(by+bh/2)|0};
  for(let dy=0;dy<bh;dy++)for(let dx=0;dx<bw;dx++) carve(bx+dx,by+dy);
  // magma ring around arenas on floors 2+ (corridor carves a safe entry)
  if(fl>=2){
    for(let dx=0;dx<bw;dx++){ setTile(bx+dx,by,T_LAVA); setTile(bx+dx,by+bh-1,T_LAVA); }
    for(let dy=0;dy<bh;dy++){ setTile(bx,by+dy,T_LAVA); setTile(bx+bw-1,by+dy,T_LAVA); }
  }
  // connect arena to nearest room
  let nr=rooms[0], nd=1e9;
  for(const r of rooms){
    const d=dist(r.cx,r.cy,bossRoom.cx,bossRoom.cy);
    if(d<nd){ nd=d; nr=r; }
  }
  let x=nr.cx, y=nr.cy;
  while(x!==bossRoom.cx){ carve(x,y); carve(x,y+1); x+= x<bossRoom.cx?1:-1; }
  while(y!==bossRoom.cy){ carve(x,y); carve(x+1,y); y+= y<bossRoom.cy?1:-1; }
  rooms.push(bossRoom);
  /* --- Ember Seal: every floor tile in the ring just outside the arena
         becomes wall until the floor's enemies are cleared (SkyBlock-style) --- */
  state.sealTiles=[];
  if(!(state.bossesDead&&state.bossesDead[fl])){
    for(let dy=-1;dy<=bh;dy++)for(let dx=-1;dx<=bw;dx++){
      const edge = dx<0||dy<0||dx>=bw||dy>=bh;
      if(!edge) continue;
      const tx=bx+dx, ty=by+dy;
      if(tileAt(tx,ty)===T_FLOOR){
        setTile(tx,ty,T_WALL);
        state.sealTiles.push(tx+','+ty);
      }
    }
  }
  state.sealSet=new Set(state.sealTiles);
  state.sealOpen=state.sealTiles.length===0;
  /* --- hidden vaults (Doors-style secret subrooms) ---
     A small treasure room is carved far from the map's rooms, connected by a
     corridor, and every opening is sealed with bare wall except a single
     cracked T_SECRET tile. The player must press E beside the crack to break
     in. Vault guards and the relic chest live inside. --- */
  state.dvaults=[];
  const rectClear=(x,y,w,h)=>{
    for(const r of rooms)
      if(x < r.x+r.w+4 && x+w+4 > r.x && y < r.y+r.h+4 && y+h+4 > r.y) return false;
    for(const v of state.dvaults)
      if(x < v.x+v.w+4 && x+w+4 > v.x && y < v.y+v.h+4 && y+h+4 > v.y) return false;
    return true;
  };
  const nVaults = fl>=4?2:1;
  for(let vi=0; vi<nVaults; vi++){
    const vw=9, vh=7;
    let vx=-1, vy=-1;
    for(let t=0;t<500;t++){
      const nx=4+((Math.random()*(mapW-vw-8))|0), ny=4+((Math.random()*(mapH-vh-8))|0);
      if(rectClear(nx,ny,vw,vh)){ vx=nx; vy=ny; break; }
    }
    if(vx<0) continue;
    for(let dy=0;dy<vh;dy++)for(let dx=0;dx<vw;dx++) carve(vx+dx,vy+dy);
    const cx=vx+(vw>>1), cy=vy+(vh>>1);
    let nr2=rooms[0], nd2=1e9;
    for(const r of rooms){
      if(r===bossRoom) continue;
      const d=dist(r.cx,r.cy,cx,cy);
      if(d<nd2){ nd2=d; nr2=r; }
    }
    let x2=nr2.cx, y2=nr2.cy;
    while(x2!==cx){ carve(x2,y2); carve(x2,y2+1); x2 += x2<cx?1:-1; }
    while(y2!==cy){ carve(x2,y2); carve(x2+1,y2); y2 += y2<cy?1:-1; }
    // seal all perimeter openings except one — that one becomes a secret crack
    const perim=[];
    for(let dx=-1;dx<=vw;dx++){ perim.push([vx+dx,vy-1],[vx+dx,vy+vh]); }
    for(let dy=0;dy<vh;dy++){ perim.push([vx-1,vy+dy],[vx+vw,vy+dy]); }
    let door=null, dbest=1e9;
    for(const [tx2,ty2] of perim){
      if(tileAt(tx2,ty2)===T_WALL) continue;
      const dd=dist(tx2,ty2,nr2.cx,nr2.cy);
      if(dd<dbest){ dbest=dd; door=[tx2,ty2]; }
    }
    for(const [tx2,ty2] of perim){
      if(tileAt(tx2,ty2)===T_WALL) continue;
      setTile(tx2,ty2, (door && tx2===door[0] && ty2===door[1]) ? T_SECRET : T_WALL);
    }
    if(!door) setTile(cx,vy-1,T_SECRET);
    const id='v'+fl+':'+cx+','+cy;
    state.dvaults.push({x:vx,y:vy,w:vw,h:vh,cx,cy,id,seen:false});
    if(!chests.some(c=>c.id===id))
      chests.push({x:cx*TS+TS/2, y:cy*TS+TS/2,
        opened:!!(state.openedChests&&state.openedChests.has(id)), id, vault:true});
  }
  /* --- variation + lava tile list --- */
  for(let i=0;i<tiles.length;i++) tileVar[i]=hash2(i*1.37,i*0.71);
  for(let i=0;i<tiles.length;i++)
    if(tiles[i]===T_LAVA) lavas.push({x:(i%mapW)*TS+TS/2, y:((i/mapW)|0)*TS+TS/2});
  // random lava lakes on floors 2+
  if(fl>=2){
    const cand=rooms.filter(r=>r!==bossRoom);
    for(let i=0;i<fl;i++){
      const r=pick(cand);
      const lx=r.x+2+((Math.random()*(r.w-4))|0), ly=r.y+2+((Math.random()*(r.h-4))|0);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)
        if(hash2(lx+dx*3,ly+dy*5)>0.3 && tileAt(lx+dx,ly+dy)===T_FLOOR){ setTile(lx+dx,ly+dy,T_LAVA); lavas.push({x:(lx+dx)*TS+TS/2,y:(ly+dy)*TS+TS/2}); }
    }
  }
  /* --- stairs --- */
  const start=rooms[0];
  setTile(start.cx,start.cy,T_STAIRSUP);
  state.dstart={x:start.cx*TS+TS/2+TS, y:start.cy*TS+TS/2};
  state.dbossRoom=bossRoom;
  state.drooms=rooms;
  // stairs down (not on the last floor)
  let downRoom=null;
  const others=rooms.slice(1).filter(r=>r!==bossRoom);
  if(fl<MAXFLOOR && others.length){
    downRoom=pick(others);
    setTile(downRoom.cx,downRoom.cy,T_STAIRSDOWN);
  }
  /* --- shrines (challenge trials) --- */
  const shrineRooms=others.filter(r=>r!==downRoom);
  const nShr = fl>=3?2:1;
  for(let i=0;i<nShr && shrineRooms.length;i++){
    const idx=(Math.random()*shrineRooms.length)|0;
    const r=shrineRooms.splice(idx,1)[0];
    const id=fl+':'+r.cx+','+r.cy;
    shrines.push({x:r.cx*TS+TS/2+rnd(-24,24), y:r.cy*TS+TS/2+rnd(-16,16), fl, active:false,
      done:!!(state.doneShrines&&state.doneShrines.has(id)), left:0, id});
  }
  /* --- chests --- */
  const chestRooms=others.filter(r=>r!==downRoom);
  for(let i=0;i<4+fl*2 && chestRooms.length;i++){
    const idx=(Math.random()*chestRooms.length)|0;
    const r=chestRooms.splice(idx,1)[0];
    const id=fl+':'+r.cx+','+r.cy;
    if(chests.some(c=>c.id===id)) continue;
    chests.push({x:r.cx*TS+TS/2+rnd(-22,22), y:r.cy*TS+TS/2+rnd(-14,14),
      opened:!!(state.openedChests&&state.openedChests.has(id)), id});
  }
  /* --- switches + locked doors (pressure-plate puzzles) ---
     A pressure plate in a room opens a door to a small treasure alcove. --- */
  const switchRooms = rooms.slice(1).filter(r=>r!==bossRoom && r!==downRoom);
  const nSwitch = fl>=2 ? 2 : 1;
  for(let si=0; si<nSwitch && switchRooms.length; si++){
    const idx=(Math.random()*switchRooms.length)|0;
    const r=switchRooms.splice(idx,1)[0];
    // carve a 1-tile-wide alcove off a random wall of the room
    const side=(Math.random()*4)|0; // 0=N,1=E,2=S,3=W
    let ax,ay,dw,dh;
    if(side===0){ ax=r.x+((Math.random()*(r.w-2))|0)+1; ay=r.y; dw=1; dh=2; }
    else if(side===1){ ax=r.x+r.w-1; ay=r.y+((Math.random()*(r.h-2))|0)+1; dw=2; dh=1; }
    else if(side===2){ ax=r.x+((Math.random()*(r.w-2))|0)+1; ay=r.y+r.h-1; dw=1; dh=2; }
    else { ax=r.x; ay=r.y+((Math.random()*(r.h-2))|0)+1; dw=2; dh=1; }
    // the outer tile of the alcove becomes a door, inner tile holds the chest
    const doorX=ax+(side===0?0:side===1?dw-1:side===2?0:-1);
    const doorY=ay+(side===0?dh-1:side===1?0:side===2?dh-1:0);
    const innerX=ax+(side===0?0:side===1?0:side===2?0:1);
    const innerY=ay+(side===0?0:side===1?1:side===2?0:0);
    // carve the alcove floor
    for(let dy=0;dy<dh;dy++)for(let dx=0;dx<dw;dx++) setTile(ax+dx,ay+dy,T_FLOOR);
    setTile(doorX,doorY,T_DOOR);
    const id='s'+fl+':'+doorX+','+doorY;
    chests.push({x:innerX*TS+TS/2, y:innerY*TS+TS/2, opened:false, id, vault:false, switchLocked:true});
    // place the pressure plate on a floor tile inside the room
    let sx=-1,sy2=-1;
    for(let t=0;t<50;t++){
      const px=r.x+1+((Math.random()*(r.w-2))|0), py=r.y+1+((Math.random()*(r.h-2))|0);
      if(tileAt(px,py)===T_FLOOR){ sx=px; sy2=py; break; }
    }
    if(sx>=0){ setTile(sx,sy2,T_SWITCH); switches.push({x:sx,y:sy2,doorX,doorY,id,active:false,used:false}); }
  }
  /* --- torches on walls that face open floor --- */
  for(let ty=1;ty<mapH-1;ty++)for(let tx=1;tx<mapW-1;tx++){
    if(tileAt(tx,ty)!==T_WALL) continue;
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      if(tileAt(tx+dx,ty+dy)===T_FLOOR && hash2(tx*1.9,ty*2.3)<0.08){
        torches.push({x:tx*TS+TS/2+dx*10, y:ty*TS+TS/2+dy*10, side:[dx,dy], fl:rnd(TAU)});
        break;
      }
    }
  }
  return {rooms, bossRoom, downRoom};
}

/* ---------- collision ---------- */
function circleFree(x,y,r,ignoreTrees){
  const minTx=Math.floor((x-r)/TS), maxTx=Math.floor((x+r)/TS);
  const minTy=Math.floor((y-r)/TS), maxTy=Math.floor((y+r)/TS);
  for(let ty=minTy;ty<=maxTy;ty++)for(let tx=minTx;tx<=maxTx;tx++){
    if(!SOLID(tileAt(tx,ty))) continue;
    const cx=clamp(x,tx*TS,(tx+1)*TS), cy=clamp(y,ty*TS,(ty+1)*TS);
    const dx=cx-x, dy=cy-y;
    if(dx*dx+dy*dy < r*r) return false;
  }
  if(!ignoreTrees){
    const gr=Math.ceil(r/TS)+1;
    const tx0=Math.floor(x/TS), ty0=Math.floor(y/TS);
    for(let dy=-gr;dy<=gr;dy++)for(let dx=-gr;dx<=gr;dx++){
      const t=treeGrid.get((tx0+dx)+','+(ty0+dy));
      if(t){ const ddx=t.x-x, ddy=t.y-y, rr=r+t.cr;
        if(ddx*ddx+ddy*ddy<rr*rr) return false; }
    }
  }
  for(const b of buildings){
    const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h);
    const dx=cx-x, dy=cy-y;
    if(dx*dx+dy*dy < r*r) return false;
  }
  for(const rk of rocks){
    const dx=rk.x-x, dy=rk.y-y, rr=r+rk.r*0.8;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  if(state.floor===0) for(const n of npcs){
    const dx=n.x-x, dy=n.y-y, rr=r+n.r*0.8;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  for(const c of chests){
    if(c.opened) continue;
    const dx=c.x-x, dy=c.y-y, rr=r+10;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  for(const s of shrines){
    const dx=s.x-x, dy=s.y-y, rr=r+10;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  return true;
}
function moveEntity(e,dx,dy){
  if(dx!==0){
    if(circleFree(e.x+dx,e.y,e.r)) e.x+=dx;
    else if(circleFree(e.x+dx*0.35,e.y,e.r)) e.x+=dx*0.35; // wall-slide assist
  }
  if(dy!==0){
    if(circleFree(e.x,e.y+dy,e.r)) e.y+=dy;
    else if(circleFree(e.x,e.y+dy*0.35,e.r)) e.y+=dy*0.35;
  }
}
/* enemies refuse to step into lava unless they fly */
function avoidLava(e,dx,dy){
  if(e.flies || tileAtPx(e.x+dx,e.y+dy)!==T_LAVA){ moveEntity(e,dx,dy); return; }
  if(dx!==0 && tileAtPx(e.x+dx,e.y)!==T_LAVA) moveEntity(e,dx,0);
  else if(dy!==0 && tileAtPx(e.x,e.y+dy)!==T_LAVA) moveEntity(e,0,dy);
}
function findFreeSpot(x,y,r=12){
  if(circleFree(x,y,r)) return {x,y};
  for(let d=1;d<40;d++){
    for(let i=0;i<8;i++){
      const a=i/8*TAU;
      const nx=x+Math.cos(a)*d*10, ny=y+Math.sin(a)*d*10;
      if(circleFree(nx,ny,r)) return {x:nx,y:ny};
    }
  }
  return {x,y};
}

/* ---------------- potion effects (Minecraft-style) ---------------- */
const FX={};
const FXINFO={
  speed:   {label:'SPEED',       color:'#7ee7ff', msg:'Speed surges through you!'},
  strength:{label:'STRENGTH',    color:'#ff8a5e', msg:'Your arms swell with power!'},
  regen:   {label:'REGEN',       color:'#7ee787', msg:'Wounds knit themselves closed.'},
  fire:    {label:'FIRE RESIST', color:'#ff9a3d', msg:'You no longer fear the flames.'},
  poison:  {label:'POISON',      color:'#7ec0a0', msg:'Venom burns in your veins!'},
};
function fxActive(kind){ const f=FX[kind]; return !!(f && f.t>0); }
function fxVal(kind){ const f=FX[kind]; return (f && f.t>0) ? f.v : 0; }
function applyFx(kind,dur,val){
  const f=FX[kind]||(FX[kind]={t:0,v:0,dur:dur,acc:0});
  f.t=Math.max(f.t,dur); f.dur=Math.max(f.dur,dur);
  f.v = kind==='poison' ? (f.t>0?Math.max(f.v,val):val) : val;
  addText(player.x,player.y-24,FXINFO[kind].msg,FXINFO[kind].color,2.2,true);
  sfx(kind==='poison'?'denied':'potion');
}
function updateFX(dt){
  for(const k in FX){
    const f=FX[k];
    if(f.t>0) f.t-=dt;
    if(k==='poison' && f.t>0){
      f.acc+=f.v*dt;
      while(f.acc>=1){
        f.acc-=1;
        player.hp=Math.max(0,player.hp-1);
        if(state.time%1<0.5) burst(player.x+rnd(-8,8),player.y+rnd(-6,6),'#7ec0a0',2,30,0.4,2);
        if(player.hp<=0 && state.mode==='play'){
          state.mode='dead'; sfx('die');
          burst(player.x,player.y,'#ff6b6b',24,160,0.9,4);
        }
      }
    }
  }
}
function drainPlayerWhilePoison(){} // (poison drain handled inside updateFX)

function makePotionDrop(x,y,buffOnly){
  // buffOnly: chests/other sources may grant buffs but never health flasks — those are guardian loot
  const pool=buffOnly?['p_speed','p_strength','p_regen','p_fire']
                     :['p_health','p_health','p_health','p_health','p_speed','p_strength','p_regen','p_fire'];
  const kind=pick(pool);
  return {type:'potion',kind,x,y,t:rnd(TAU),vx:rnd(-14,14),vy:rnd(-14,14)};
}
function addItem(id,n=1){
  const def=IDEF[id]; if(!def) return n;
  let left=n;
  const fill=arr=>{
    for(let i=0;i<arr.length&&left;i++){
      const s=arr[i];
      if(s&&s.id===id&&s.count<def.stack){ const take=Math.min(left,def.stack-s.count); s.count+=take; left-=take; }
    }
    for(let i=0;i<arr.length&&left;i++){
      if(!arr[i]){ const take=Math.min(left,def.stack); arr[i]={id,count:take}; left-=take; }
    }
  };
  fill(player.hotbar); fill(player.slots);
  return left; // leftover amount that did not fit
}
function countItem(id){ let n=0; for(const s of [...player.hotbar,...player.slots]) if(s&&s.id===id) n+=s.count; return n; }
function consumeItem(id,n=1){
  let left=n;
  const take=arr=>{
    for(let i=0;i<arr.length&&left;i++){
      const s=arr[i];
      if(s&&s.id===id){ if(s.count<=left){ left-=s.count; arr[i]=null; } else { s.count-=left; left=0; } }
    }
  };
  take(player.hotbar); take(player.slots);
  return left===0;
}
function selectHotbar(i){
  player.sel=i;
  const s=player.hotbar[i];
  if(s){
    const def=IDEF[s.id];
    if(def.gear && player.weapon!==def.gear){
      player.weapon=def.gear; sfx('coin');
      addText(player.x,player.y-26,'Equipped: '+def.name,'#ffd75e',1.2);
    }
  }
}
/* ---------------- drinking (fortnite-style channel) ----------------
   Consumables must be DRUNK: a short channel during which you cannot move.
   Taking a hit interrupts the drink and the item is NOT consumed.
   Health flasks themselves only come from defeating guardians.            */
const DRINK_TIME={p_health:1.6,p_speed:2.2,p_strength:2.2,p_regen:2.2,p_fire:2.2};
function startDrink(slot){
  if(state.mode!=='play' || state.cine || state.trans) return false;
  if(player.drink) return false;                        // already chugging
  if(!slot || !slot.count) return false;
  const def=IDEF[slot.id];
  if(!def.drink){ sfx('denied'); return false; }
  if(slot.id==='p_health' && player.hp>=player.maxHp){
    addText(player.x,player.y-26,'Already at full health','#c9d1d9'); return false;
  }
  player.drink={t:0,max:DRINK_TIME[slot.id]||2,slot};
  sfx('potion');
  addText(player.x,player.y-26,'Drinking '+def.name+'...','#c9d1d9',0.8);
  return true;
}
function finishDrink(){
  const dr=player.drink; player.drink=null;
  if(!dr) return;
  const slot=dr.slot, def=slot&&IDEF[slot.id];
  // the stack may have been moved/eaten while chugging — verify before consuming
  if(!slot || !slot.count || !def || !def.drink) return;
  slot.count--;
  if(slot.count<=0){
    for(let i=0;i<player.hotbar.length;i++) if(player.hotbar[i]===slot) player.hotbar[i]=null;
    for(let i=0;i<player.slots.length;i++) if(player.slots[i]===slot) player.slots[i]=null;
  }
  if(def.drink.heal){
    player.hp=Math.min(player.maxHp,player.hp+def.drink.heal);
    addText(player.x,player.y-26,'+'+def.drink.heal+' HP','#7ee787',1.4); sfx('potion');
    burst(player.x,player.y,def.color,10,90,0.6,3);
  }
  if(def.drink.fx){
    const [kind,dur,val]=def.drink.fx;
    applyFx(kind,dur,val);
  }
  sfx('reward');
}
function cancelDrink(reason){
  if(!player.drink) return;
  player.drink=null; sfx('denied');
  if(reason) addText(player.x,player.y-30,reason,'#ff6b6b',1.2,true);
}
function drinkFromSlot(slot){ return startDrink(slot); } // legacy alias
function useHotbar(){
  const s=player.hotbar[player.sel];
  if(!s){ sfx('denied'); return; }
  if(IDEF[s.id].gear){ selectHotbar(player.sel); return; }
  if(!drinkFromSlot(s)) sfx('denied');
}
function quickDrink(){
  if(state.mode!=='play') return;
  let slot=null;
  for(const s of [...player.hotbar,...player.slots]) if(s&&s.id==='p_health'){ slot=s; break; }
  if(!slot){ addText(player.x,player.y-26,'No potions!','#ff9a9a'); sfx('denied'); return; }
  if(player.hp>=player.maxHp){ addText(player.x,player.y-26,'Already at full health','#c9d1d9'); return; }
  startDrink(slot);
}

  if(enemies.length>=cap) return;
  const ang=rnd(TAU), d=rnd(560,980);
  let x=player.x+Math.cos(ang)*d, y=player.y+Math.sin(ang)*d;
  const tx=Math.floor(x/TS), ty=Math.floor(y/TS);
  if(!circleFree(x,y,12)) return;
  if(dist(tx,ty,VILLAGE.x,VILLAGE.y) < VILLAGE.r+3) return;
  const biome=tileAt(tx,ty);
  let type;
  if(biome===T_GRASS || biome===T_SAND){
    const dv=dist(tx,ty,VILLAGE.x,VILLAGE.y);
    type = dv>30 ? (Math.random()<0.45?'skeleton':(Math.random()<0.5?'slime':'zombie')) : 'slime';
  } else {
    const pool=BIOME_SPAWNS[biome]||['slime'];
    type=pick(pool);
  }
  makeEnemy(type,x,y);
}
function spawnEnemyFloor(){
  const fl=state.floor, cap=18+fl*5;
  if(enemies.length>=cap || !state.drooms) return;
  const pool=state.drooms.filter(r=>r!==state.dbossRoom || state.bossesDead[fl]);
  if(!pool.length) return;
  const r=pick(pool);
  const x=(r.x+1+Math.random()*(r.w-2))*TS, y=(r.y+1+Math.random()*(r.h-2))*TS;
  const s=findFreeSpot(x,y,12);
  if(dist(s.x,s.y,player.x,player.y)<460) return;
  makeEnemy(pick(SPAWNS[fl]),s.x,s.y);
}
function populateFloor(){
  enemies=[]; arrows=[]; drops=[];
  const fl=state.floor;
  if(fl===0) return;
  npcs.length=0;
  // a quartermaster sets up shop on every dungeon floor
  const pool=(state.drooms||[]).filter(r=>r!==state.dbossRoom);
  if(pool.length){
    const r=pick(pool);
    const s=findFreeSpot((r.x+r.w/2)*TS,(r.y+r.h/2)*TS,12);
    npcs.push({name:'Quartermaster Brom', kind:'vendor', x:s.x, y:s.y, r:11,
      c:'#e8c9a0', robe:'#5a5a6e',
      line:'Floor '+fl+' of the Depths. Even here, a blade should bite deep.',
      stock:[
        {label:'Sharpen Blade +12 dmg', price:()=>(140+60*fl)*Math.pow(2,player.swordLvl),
          give(){ player.swordBonus+=12; player.swordLvl++; addText(player.x,player.y-26,'Blade sharpened!','#ffd75e'); }},
        {label:'Reinforce Armor +1', price:()=>(170+70*fl)*Math.pow(2,player.armorLvl),
          give(){ player.armor++; player.armorLvl++; addText(player.x,player.y-26,'Armor reinforced!','#9ad1ff'); }},
        {label:'Lantern Upgrade', price:()=>(90+50*fl)*Math.pow(2,player.lightLvl),
          give(){ if(player.lightLvl>=3){ addText(player.x,player.y-26,'Lantern already burning bright!','#c9d1d9'); return false; }
                  player.lightLvl++; addText(player.x,player.y-26,'Lantern upgraded!','#ffe08a'); }},
        {label:'Regeneration Potion', price:45+15*fl,
          give(){ addItem('p_regen',1); addText(player.x,player.y-26,'+1 Regeneration Potion','#7ee787'); }},
        {label:'Arrows x25', price:25+10*fl,
          give(){ addItem('arrows',25); addText(player.x,player.y-26,'+25 arrows','#e8e2d0'); }},
      ]});
  }
  if(!pool.length) return;
  for(let i=0;i<12+fl*5;i++){
    const r=pick(pool);
    const x=(r.x+1+Math.random()*(r.w-2))*TS, y=(r.y+1+Math.random()*(r.h-2))*TS;
    const s=findFreeSpot(x,y,12);
    if(dist(s.x,s.y,player.x,player.y)<380) continue;
    makeEnemy(pick(SPAWNS[fl]),s.x,s.y);
  }
  // hidden-vault guardians (optional content — they never block the Ember Seal)
  for(const v of (state.dvaults||[])){
    for(let i=0;i<2+(fl>>1);i++){
      const s=findFreeSpot((v.x+1.5+Math.random()*(v.w-3))*TS,
                           (v.y+1.5+Math.random()*(v.h-3))*TS, 12);
      makeEnemy(pick(SPAWNS[fl]),s.x,s.y,{elite:true,vaultGuard:true});
    }
  }
  // mimics: chest-monsters that lie dormant beside real chests (floor 2+)
  if(fl>=2){
    const realChests=chests.filter(c=>!c.opened && !c.vault).slice();
    const nMim=Math.min(realChests.length, fl>=4?2:1);
    for(let i=0;i<nMim;i++){
      const idx=(Math.random()*realChests.length)|0;
      const c=realChests.splice(idx,1)[0];
      const s=findFreeSpot(c.x+rnd(-40,40), c.y+rnd(-40,40), 12);
      makeEnemy('mimic',s.x,s.y,{hidden:true, mimicOf:c, elite:false});
    }
  }
}

/* ---------------- combat ---------------- */
function damageEnemy(e,dmg,kx,ky){
  e.hp-=dmg; e.flash=0.15;
  const kf=1-(e.kbr||0);
  e.kb.x+=kx*kf; e.kb.y+=ky*kf;
  addText(e.x+rnd(-8,8), e.y-e.r-6, Math.round(dmg), '#ffd75e');
  burst(e.x,e.y,'#ff7b54',6,110,0.35,2.5);
  sfx('hit');
  if(e.hp<=0) killEnemy(e);
}
function enemyTint(e){
  switch(e.type){
    case 'slime':return '#5fce62'; case 'dslime':return '#8e4fd0';
    case 'skeleton':case 'zombie':return e.type==='zombie'?'#7aa05a':'#e8e8e8';
    case 'bat':return '#8a6ea0';   case 'wraith':return '#9b59d0';
    case 'golem':return '#6b6570'; case 'necro':return '#4a3568';
    case 'wolf':return '#9aa2b2';  case 'spider':return '#4a3a52';
    case 'scorpion':return '#d08a2e'; case 'yeti':return '#dceaf5';
    case 'sporecap':return '#7ec0a0'; case 'imp':return '#e2622a';
    case 'muck':return '#5a6e34';  case 'bandit':return '#b05a3c';
    case 'hound':return '#e2622a'; case 'shade':return '#3a2a58';
    case 'mimic':return '#c48a5a';
  }
  return '#b06ce2';
}
function killEnemy(e){
  const idx=enemies.indexOf(e); if(idx<0) return;
  enemies.splice(idx,1);
  burst(e.x,e.y,enemyTint(e),14,140,0.6,3.5);
  sfx('die');
  gainXp(e.xp);
  killCount++;
  if(e.shrineRef){
    e.shrineRef.left--;
    if(e.shrineRef.left<=0 && e.shrineRef.active){
      e.shrineRef.active=false; e.shrineRef.done=true;
      state.doneShrines.add(e.shrineRef.id);
      sfx('reward');
      addText(e.shrineRef.x,e.shrineRef.y-30,'Shrine cleared — take its blessing!','#7ee787',2.4,true);
      burst(e.shrineRef.x,e.shrineRef.y,'#7ee787',30,180,0.9,4);
      for(let i=0;i<8;i++) drops.push({type:'coin',x:e.shrineRef.x+rnd(-26,26),y:e.shrineRef.y+rnd(-26,26),val:Math.ceil(rnd(4,9)),t:rnd(TAU),vx:rnd(-70,70),vy:rnd(-70,70)});
      for(let i=0;i<3;i++) drops.push({type:'gem',x:e.shrineRef.x+rnd(-16,16),y:e.shrineRef.y+rnd(-16,16),val:Math.ceil(rnd(25,60)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
    }
  }
  if(state.quest.id==='q1' && state.quest.state==='active' && e.type==='slime'){
    state.quest.prog++;
    if(state.quest.prog>=8){ state.quest.state='ready';
      addText(player.x,player.y-30,'Quest ready! Return to Elder Maren','#7ee787',2,true); sfx('quest'); }
  }
  const ncoins=1+((Math.random()*3)|0);
  for(let i=0;i<ncoins;i++) drops.push({type:'coin',x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),val:Math.ceil(rnd(1,5)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
  if(Math.random()<0.30 || e.elite) drops.push({type:'gem',x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),val:Math.ceil(e.xp*0.4),t:rnd(TAU),vx:rnd(-30,30),vy:rnd(-30,30)});
  if(e.type==='zombie'||e.type==='bandit') drops.push({type:'goldbag',x:e.x,y:e.y+4,val:Math.ceil(rnd(8,20)),t:rnd(TAU),vx:rnd(-30,30),vy:rnd(-30,30)});
  if(e.type==='mimic'){
    sfx('reward');
    addText(e.x,e.y-34,'THE MIMIC REGURGITATES ITS HOARD!','#c46bff',3,true);
    for(let i=0;i<8;i++) drops.push({type:'coin',x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),val:Math.ceil(rnd(6,16)),t:rnd(TAU),vx:rnd(-90,90),vy:rnd(-90,90)});
    for(let i=0;i<3;i++) drops.push({type:'gem',x:e.x+rnd(-14,14),y:e.y+rnd(-14,14),val:Math.ceil(rnd(45,110)),t:rnd(TAU),vx:rnd(-70,70),vy:rnd(-70,70)});
    drops.push({type:'arrows',x:e.x,y:e.y,val:20,t:rnd(TAU),vx:0,vy:0});
  }
}
function gainXp(v){
  player.xp+=v;
  addText(player.x+rnd(-6,6),player.y-24,'+'+v+' xp','#9ad1ff',0.8);
  let need=xpNeed();
  while(player.xp>=need){
    player.xp-=need; player.level++;
    player.maxHp+=20; player.hp=Math.min(player.maxHp,player.hp+player.maxHp*0.5);
    player.dmg+=3;
    need=xpNeed();
    addText(player.x,player.y-40,'LEVEL UP!  Lv.'+player.level,'#ffd75e',1.6,true);
    burst(player.x,player.y,'#ffd75e',22,170,0.8,4);
    sfx('level');
  }
}
function hurtPlayer(dmg,fromX,fromY){
  if(player.invulnT>0 || state.mode!=='play') return;
  const red=1-Math.min(0.5,player.armor*0.08);
  const d=Math.max(1,Math.round(dmg*red));
  player.hp-=d; player.invulnT=0.7; player.hurtFlash=0.3;
  player.hurtT=0; player.regenAcc=0;
  if(player.drink) cancelDrink('Drink interrupted!');   // a hit spoils the channel (item kept)
  addText(player.x,player.y-26,'-'+d,'#ff6b6b');
  const a=Math.atan2(player.y-fromY,player.x-fromX);
  moveEntity(player,Math.cos(a)*14,Math.sin(a)*14);
  shake(0.25,5); sfx('hurt');
  if(player.hp<=0){
    player.hp=0; state.mode='dead'; sfx('die');
    burst(player.x,player.y,'#ff6b6b',24,160,0.9,4);
  }
}
function doAttack(dirAng){
  if(player.weapon==='bow'){
    if(player.atkCd>0 || player.bowDraw>0) return;
    if(countItem('arrows')<=0){ addText(player.x,player.y-26,'No arrows!','#ff9a9a'); sfx('denied'); return; }
    /* fortnite-style draw: the arrow flies once the string is pulled back */
    player.bowDraw=0.38; player.fireAng=dirAng; player.atkCd=0.6;
    player.swingT=0.38; player.swingDir=dirAng;
    player.face.x=Math.cos(dirAng); player.face.y=Math.sin(dirAng);
    sfx('arrow');
    return;
  }
  if(player.atkCd>0) return;
  player.atkCd=0.38; player.swingT=0.18; player.swingDir=dirAng;
  player.face.x=Math.cos(dirAng); player.face.y=Math.sin(dirAng);
  sfx('swing');
  const range=48, dmg=player.dmg+player.swordBonus+(fxActive('strength')?fxVal('strength'):0);
  for(const e of [...enemies, ...(state.boss?[state.boss]:[])]){
    const d=dist(player.x,player.y,e.x,e.y);
    if(d>range+e.r) continue;
    if(!losClear(player.x,player.y,e.x,e.y)) continue; // walls block sword swings
    const a=Math.atan2(e.y-player.y,e.x-player.x);
    let diff=Math.abs(((a-dirAng)%TAU+TAU+Math.PI)%TAU-Math.PI);
    if(diff<1.25){
      const kx=Math.cos(a)*180, ky=Math.sin(a)*180;
      if(e===state.boss) damageBoss(dmg,kx,ky); else damageEnemy(e,dmg,kx,ky);
    }
  }
}
function shootBow(dirAng){
  if(!consumeItem('arrows')){ addText(player.x,player.y-26,'No arrows!','#ff9a9a'); sfx('denied'); return; }
  player.atkCd=0.42; player.swingT=0.12; player.swingDir=dirAng;
  player.face.x=Math.cos(dirAng); player.face.y=Math.sin(dirAng);
  const dmg=9+player.bowLvl*5;
  arrows.push({x:player.x+Math.cos(dirAng)*14, y:player.y+Math.sin(dirAng)*14,
    vx:Math.cos(dirAng)*470, vy:Math.sin(dirAng)*470, life:1.2, dmg, kind:'player', friendly:true});
  sfx('bow');
}
/* arrow release after the draw delay (called from update) */
function fireBow(dirAng){
  if(!consumeItem('arrows')) return;
  const dmg=9+player.bowLvl*5;
  arrows.push({x:player.x+Math.cos(dirAng)*14, y:player.y+Math.sin(dirAng)*14,
    vx:Math.cos(dirAng)*470, vy:Math.sin(dirAng)*470, life:1.2, dmg,
    kind:'player', friendly:true, pierce:player.abilities.pierce, hitSet:[]});
  sfx('bow');
}
/* Magma Tyrant's gift: a spinning 360-degree blade sweep */
function doWhirl(){
  if(player.whirlCd>0 || player.atkCd>0) return;
  player.whirlCd=2.6; player.whirlT=0.35; player.atkCd=0.5;
  sfx('nova'); shake(0.15,3);
  const range=72, dmg=(player.dmg+player.swordBonus+(fxActive('strength')?fxVal('strength'):0))*1.2;
  for(const e of [...enemies, ...(state.boss?[state.boss]:[])]){
    const d=dist(player.x,player.y,e.x,e.y);
    if(d>range+e.r) continue;
    if(!losClear(player.x,player.y,e.x,e.y)) continue;
    const a=Math.atan2(e.y-player.y,e.x-player.x);
    const kx=Math.cos(a)*280, ky=Math.sin(a)*280;
    if(e===state.boss) damageBoss(dmg,kx*0.25,ky*0.25); else damageEnemy(e,dmg,kx,ky);
  }
  for(let i=0;i<12;i++) parts.push({x:player.x+Math.cos(i/12*TAU)*30,y:player.y+Math.sin(i/12*TAU)*30,
    vx:Math.cos(i/12*TAU)*120,vy:Math.sin(i/12*TAU)*120,life:0.3,max:0.3,color:'#ffb36b',size:3,grav:0});
}

  state.boss={kind,x,y,r:d.r,hp:d.hp*boost,maxHp:d.hp*boost,spd:d.spd,dmg:d.dmg,xp:d.xp,

    cd:{volley:2.5,slam:3.5,summon:5,blink:7,rain:5,nova:4,rock:2.5,dash:4},
    flash:0,phase:rnd(TAU),enraged:false,kb:{x:0,y:0}};

function damageBoss(dmg,kx,ky){
  const b=state.boss; if(!b) return;
  b.hp-=dmg; b.flash=0.15;
  b.kb.x+=kx*0.22; b.kb.y+=ky*0.22;

function defeatBoss(){
  const b=state.boss, kind=b.kind;

  for(let i=0;i<12;i++) drops.push({type:'coin',x:b.x+rnd(-30,30),y:b.y+rnd(-30,30),val:Math.ceil(rnd(6,18)),t:rnd(TAU),vx:rnd(-80,80),vy:rnd(-80,80)});
  for(let i=0;i<2;i++) drops.push(makePotionDrop(b.x+rnd(-20,20),b.y+rnd(-20,20)));

/* hidden-biome guardian rewards: a permanent ability */
function biomeReward(bossKind){
  state.biomeDead[bossKind]=true;
  const a=state.biomeAltars.find(x=>x.boss===bossKind);
  if(!a) return;
  for(const alt of state.biomeAltars) if(alt.boss===bossKind) alt.done=true;

  const msg={
    dash:     'RIME DASH unlocked - press SHIFT to dash!',
    regenPlus:'DEEP MEND unlocked - regeneration after 15s, +2 HP/s',

    whirl:    'DUNE WHIRL unlocked - press G for a spinning sweep!',
  }[a.ability]||'Ancient power flows into you';

  addText(player.x,player.y-34,msg,a.accent,3.6,true);
  addText(player.x,player.y-64,'The power of '+a.guardian+' is yours.','#c9d1d9',2.6,true);
}

function updateBoss(b,dt){
  const d=BDEF[b.kind], p=player;
  b.flash-=dt; b.phase+=dt*4; b.atkCd-=dt;
  for(const k in b.cd) b.cd[k]-=dt;
  const kdec=Math.pow(0.02,dt);
  moveEntity(b,b.kb.x*dt,b.kb.y*dt); // knockback respects walls (no clipping)
  b.kb.x*=kdec; b.kb.y*=kdec;
  if(!b.enraged && b.hp<=b.maxHp*d.enrage){
    b.enraged=true; b.spd*=1.35; sfx('bossroar'); shake(0.5,7);
    addText(b.x,b.y-70,d.name+' is ENRAGED!','#ff4b2e',2,true);
    if(b.kind==='tyrant') for(let i=0;i<2;i++){
      const s=findFreeSpot(b.x+rnd(-60,60),b.y+rnd(-60,60),11);
      makeEnemy('dslime',s.x,s.y,{minion:true});
    }
  }
  const dp=dist(b.x,b.y,p.x,p.y), ang=Math.atan2(p.y-b.y,p.x-b.x);
  if(b.telegraph>0){
    b.telegraph-=dt;
    if(b.telegraph<=0){
      shake(0.5,10); sfx('slam'); burst(b.x,b.y,'#ff6a3d',30,220,0.8,4);
      if(dp<b.telegraphR) hurtPlayer(b.dmg*1.45,b.x,b.y);
      if(b.kind==='cindergolem') for(let i=0;i<8;i++) eBolt(b.x,b.y,i/8*TAU,210,b.dmg*0.8,'fire',0.75);
      if(b.kind==='tyrant') for(let i=0;i<6;i++) eBolt(b.x,b.y,i/6*TAU+rnd(0.3),190,b.dmg*0.7,'fire',0.85);
      b.cd.slam=b.enraged?2.4:3.6;
    }
  }
  const chase=()=>{ if(dp<560) moveEntity(b,Math.cos(ang)*b.spd*dt,Math.sin(ang)*b.spd*dt); };
  switch(b.kind){
    case 'warden':
      if(b.cd.slam<=0 && dp<280){ b.cd.slam=99; b.telegraph=0.85; b.telegraphR=145; addText(b.x,b.y-50,'!','#c46bff',0.9,true); }
      if(b.cd.volley<=0 && dp<440){
        b.cd.volley=b.enraged?2.4:3.4;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.28,245,b.dmg*0.7,'void',1.8);
        sfx('fire');
      }
      chase();
      break;
    case 'boneking':
      chase();
      if(b.cd.volley<=0 && dp<460){
        b.cd.volley=b.enraged?2.2:2.9;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.24,250,b.dmg*0.7,'bone',2.2);
        sfx('arrow');
      }
      if(b.cd.summon<=0){
        b.cd.summon=7;
        if(enemies.filter(x=>x.minion).length<3){
          for(let i=0;i<2;i++){
            const s=findFreeSpot(b.x+rnd(-50,50),b.y+rnd(-50,50),11);
            makeEnemy('skeleton',s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#e8e2d0',12,90,0.5,3);
        }
      }
      break;
    case 'cindergolem':
      if(b.cd.slam<=0 && dp<300){ b.cd.slam=99; b.telegraph=0.95; b.telegraphR=150; addText(b.x,b.y-50,'!','#ff4b2e',0.9,true); }
      if(b.cd.rock<=0 && dp<520){ b.cd.rock=b.enraged?2.6:3.8; eBolt(b.x,b.y,ang,175,b.dmg*1.15,'rock',2.6); sfx('rock'); }
      chase();
      break;
    case 'malachar':
      if(dp<150) moveEntity(b,-Math.cos(ang)*b.spd*dt,-Math.sin(ang)*b.spd*dt);
      else if(dp>270) moveEntity(b,Math.cos(ang)*b.spd*dt,Math.sin(ang)*b.spd*dt);
      else { const s=Math.sin(b.phase*0.5); moveEntity(b,Math.cos(ang+Math.PI/2)*b.spd*0.6*s*dt,Math.sin(ang+Math.PI/2)*b.spd*0.6*s*dt); }
      if(b.cd.volley<=0 && dp<480){
        b.cd.volley=b.enraged?1.9:2.6;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.22,255,b.dmg*0.75,'void',2);
        sfx('fire');
      }
      if(b.cd.blink<=0 && dp>90){
        b.cd.blink=7.5;
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
        const ba=rnd(TAU), r=rnd(190,260);
        const s=findFreeSpot(p.x+Math.cos(ba)*r,p.y+Math.sin(ba)*r,b.r);
        b.x=s.x; b.y=s.y; sfx('blink');
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
      }
      if(b.cd.summon<=0){
        b.cd.summon=8.5;
        if(enemies.filter(x=>x.minion).length<3){
          const n=b.enraged?3:2;
          for(let i=0;i<n;i++){
            const s=findFreeSpot(b.x+rnd(-50,50),b.y+rnd(-50,50),12);
            makeEnemy(pick(['skeleton','wraith']),s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#c46bff',12,90,0.5,3);
        }
      }
      break;
    case 'pyrelord':
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*460*dt,Math.sin(b.dashA)*460*dt);
        burst(b.x,b.y,'#ff8a3d',3,60,0.4,3);
        if(dp<b.r+p.r+6 && b.atkCd<=0){ b.atkCd=0.9; hurtPlayer(b.dmg*1.3,b.x,b.y); }
      } else if(b.telegraph>0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.38; b.dashA=b.teleA; sfx('dash'); }
      } else {
        chase();
        if(b.cd.dash<=0 && dp<420){ b.cd.dash=b.enraged?3.4:5; b.telegraph=0.7; b.teleA=ang; addText(b.x,b.y-46,'!','#ff4b2e',0.8,true); }
        if(b.cd.rain<=0 && dp<520){
          b.cd.rain=b.enraged?4:5.5;
          for(let i=0;i<8;i++){
            const aa=rnd(TAU), rr=rnd(60,240);
            const sx=p.x+Math.cos(aa)*rr, sy=p.y+Math.sin(aa)*rr;
            eBolt(sx,sy,ang,230,b.dmg*0.65,'fire',1.5);
          }
          sfx('fire');
        }
        if(b.enraged && b.cd.nova<=0){
          b.cd.nova=7; sfx('nova');
          for(let i=0;i<16;i++) eBolt(b.x,b.y,i/16*TAU,180,b.dmg*0.75,'fire',1.4);
        }
      }
      break;
    case 'tyrant':
      if(b.cd.slam<=0 && dp<330){ b.cd.slam=99; b.telegraph=0.9; b.telegraphR=160; addText(b.x,b.y-50,'!','#ff4b2e',0.9,true); }
      if(b.cd.volley<=0 && dp<520){
        b.cd.volley=b.enraged?4.2:5.5;
        const n=b.enraged?12:8;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,i/n*TAU+rnd(0.2),175,b.dmg*0.7,'fire',1.3);
        sfx('fire');
      }
      chase();
      break;
    /* --- hidden biome guardians --- */
    case 'frostmaw': // crushing rime blows + freezing shard novas
      if(b.cd.slam<=0 && dp<250){ b.cd.slam=99; b.telegraph=0.9; b.telegraphR=150; addText(b.x,b.y-50,'!','#9ad1ff',0.9,true); }
      if(b.cd.nova<=0 && dp<430){
        b.cd.nova=b.enraged?4.2:6.2; sfx('nova');
        const n=b.enraged?14:10;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,i/n*TAU+rnd(0.25),205,b.dmg*0.7,'frost',1.5);
      }
      chase();
      break;
    case 'bogqueen': // keeps her distance, floods the field with bog spawns and poison
      if(dp<160) moveEntity(b,-Math.cos(ang)*b.spd*dt,-Math.sin(ang)*b.spd*dt);
      else if(dp>300) moveEntity(b,Math.cos(ang)*b.spd*dt,Math.sin(ang)*b.spd*dt);
      if(b.cd.summon<=0){
        b.cd.summon=b.enraged?5:7.5;
        if(enemies.filter(x=>x.minion).length<4){
          for(let i=0;i<2;i++){
            const s=findFreeSpot(b.x+rnd(-70,70),b.y+rnd(-70,70),12);
            makeEnemy('dslime',s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#7ecba0',14,90,0.6,3);
        }
      }
      if(b.cd.volley<=0 && dp<420){
        b.cd.volley=b.enraged?2.2:3.2;
        for(let i=0;i<3;i++) eBolt(b.x,b.y,ang+(i-1)*0.3,185,b.dmg*0.7,'spore',1.9);
        sfx('fire');
      }
      break;
    case 'duneserpent': // lightning-fast sand charges and a burning ring
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*500*dt,Math.sin(b.dashA)*500*dt);
        burst(b.x,b.y,'#ffb36b',3,60,0.4,3);
        if(dp<b.r+p.r+6 && b.atkCd<=0){ b.atkCd=0.9; hurtPlayer(b.dmg*1.25,b.x,b.y); }
      } else if(b.telegraph>0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.32; b.dashA=b.teleA; sfx('dash'); }
      } else {
        chase();
        if(b.cd.dash<=0 && dp<520){ b.cd.dash=b.enraged?2.6:3.8; b.telegraph=0.7; b.teleA=ang; addText(b.x,b.y-46,'!','#ffb36b',0.8,true); }
        if(b.cd.nova<=0 && dp<280){
          b.cd.nova=5.5; sfx('nova');
          for(let i=0;i<10;i++) eBolt(b.x,b.y,i/10*TAU,225,b.dmg*0.65,'fire',1.2);
        }
      }
      break;
    case 'magmatyrant': // molten shard lances and a shatter-charge
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*460*dt,Math.sin(b.dashA)*460*dt);
        burst(b.x,b.y,'#ff8a3d',3,60,0.4,3);
        if(dp<b.r+p.r+6 && b.atkCd<=0){ b.atkCd=0.9; hurtPlayer(b.dmg*1.2,b.x,b.y); }
      } else if(b.telegraph>0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.34; b.dashA=b.teleA; sfx('dash'); }
      } else {
        chase();
        if(b.cd.dash<=0 && dp<430){ b.cd.dash=b.enraged?3:4.4; b.telegraph=0.65; b.teleA=ang; addText(b.x,b.y-46,'!','#ff8a5e',0.8,true); }
        if(b.cd.volley<=0 && dp<480){
          b.cd.volley=b.enraged?2.2:3.1;
          const n=b.enraged?5:3;
          for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.2,265,b.dmg*0.7,'fire',1.8);
          sfx('fire');
        }
        if(b.enraged && b.cd.nova<=0){
          b.cd.nova=6.5; sfx('nova');
          for(let i=0;i<14;i++) eBolt(b.x,b.y,i/14*TAU,190,b.dmg*0.7,'fire',1.4);
        }
      }
      break;
    case 'drownedking': // slow tide surge + summoning drowned minions
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*340*dt,Math.sin(b.dashA)*340*dt);
        burst(b.x,b.y,'#7ee7ff',3,60,0.4,3);
        if(dp<b.r+p.r+6 && b.atkCd<=0){ b.atkCd=0.9; hurtPlayer(b.dmg*1.25,b.x,b.y); }
      } else if(b.cd.dash<=0 && dp<470){
        b.cd.dash=b.enraged?3:4.2; b.telegraph=0.75; b.teleA=ang; b.dashT=0; // set via telegraph below
        addText(b.x,b.y-46,'!','#7ee7ff',0.8,true);
      }
      if(b.telegraph>0 && b.dashT<=0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.42; b.dashA=b.teleA; sfx('dash'); }
      }
      if(b.cd.summon<=0){
        b.cd.summon=b.enraged?5:7;
        if(enemies.filter(x=>x.minion).length<4){
          const n=b.enraged?3:2;
          for(let i=0;i<n;i++){
            const s=findFreeSpot(b.x+rnd(-60,60),b.y+rnd(-60,60),12);
            makeEnemy(pick(['dslime','skeleton']),s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#7ee7ff',14,90,0.6,3);
        }
      }
      chase();
      break;
    case 'shardlord': // fast glass-shard volley and teleport dashes
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*480*dt,Math.sin(b.dashA)*480*dt);
        burst(b.x,b.y,'#c46bff',3,60,0.4,3);
      } else if(b.cd.dash<=0 && dp<420){
        b.cd.dash=b.enraged?2.4:3.4; b.telegraph=0.6; b.teleA=ang;
        addText(b.x,b.y-46,'!','#c46bff',0.8,true);
      }
      if(b.telegraph>0 && b.dashT<=0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.3; b.dashA=b.teleA; sfx('dash'); }
      }
      if(b.cd.volley<=0 && dp<560){
        b.cd.volley=b.enraged?1.7:2.4;
        const n=b.enraged?10:6;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.16,290,b.dmg*0.6,'void',1.7);
        sfx('arrow');
      }
      if(b.cd.blink<=0 && dp<130){
        b.cd.blink=6; sfx('blink');
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
        const ba=rnd(TAU), rr=rnd(150,260);
        const s=findFreeSpot(b.x+Math.cos(ba)*rr,b.y+Math.sin(ba)*rr,b.r);
        b.x=s.x; b.y=s.y;
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
      }
      chase();
      break;
    case 'coregolem': // slow heavy slams + a spreading nova of magma bolts
      if(b.cd.slam<=0 && dp<360){ b.cd.slam=99; b.telegraph=1.0; b.telegraphR=190; addText(b.x,b.y-50,'!','#ff8a5e',0.9,true); }
      if(b.cd.rock<=0 && dp<560){ b.cd.rock=b.enraged?2.2:3.2; eBolt(b.x,b.y,ang,160,b.dmg*1.2,'rock',2.8); sfx('rock'); }
      if(b.enraged && b.cd.nova<=0){
        b.cd.nova=8; sfx('nova');
        for(let i=0;i<16;i++) eBolt(b.x,b.y,i/16*TAU,170,b.dmg*0.7,'fire',1.5);
      }
      chase();
      break;
  }
  if(dp<b.r+p.r+4 && b.atkCd<=0){ b.atkCd=1.1; hurtPlayer(b.dmg,b.x,b.y); }
}

/* ---------------- potions ---------------- */
function drinkPotion(){ quickDrink(); }

/* ---------------- wandering gear vendors ---------------- */
function vendorDialog(npc){
  const opts=[];
  for(const it of npc.stock){
    if(it.once && state.flags[it.once]) continue;   // one-of-a-kind relics sell once
    const price=typeof it.price==='function'?it.price():it.price;
    opts.push({label:it.label+' - '+price+'g'+(it.once?' (one of a kind)':''),act(){
      if(it.once && state.flags[it.once]){ sfx('denied'); vendorDialog(npc); return; }
      const p=typeof it.price==='function'?it.price():it.price;
      if(player.gold>=p){
        player.gold-=p;
        if(it.give()===false){ player.gold+=p; }   // refused - refund
        else { sfx('buy'); if(it.once) state.flags[it.once]=true; }
      }
      else { sfx('denied'); addText(player.x,player.y-26,'Not enough gold!','#ff9a9a'); }
      vendorDialog(npc);
    }});
  }
  opts.push({label:'Leave',act(){ state.dialog=null; }});
  openDialog(npc.name,[npc.line,'You have '+player.gold+' gold.'],opts);
}

/* ---------------- NPCs / dialog ---------------- */
function nearNPC(){
  for(const n of npcs) if(dist(n.x,n.y,player.x,player.y)<44) return n;
  return null;
}
function openDialog(name,lines,options){
  state.dialog={name,lines,page:0,options:options||null};
}
const QUEST_CLAIM={
  q1(){ player.gold+=100; addItem('p_strength',1); return '+100 gold, +1 Strength Potion. The Depths await...'; },
  q2(){ player.gold+=150; addItem('p_speed',1); return '+150 gold, +1 Speed Potion. The Depths yawn open below.'; },
  q3(){ player.gold+=200; player.armor+=1; return '+200 gold, +1 armor. The fires below grow hotter.'; },
  q4(){ player.gold+=250; addItem('p_regen',1); return '+250 gold, +1 Regeneration Potion. Ash storms brew on Floor 4.'; },
  q5(){ player.gold+=150; return '+150 gold. Only one tyrant remains...'; },
  q6(){ player.gold+=400; player.swordBonus+=10; return '+400 gold, the EMBER BLADE is yours! (+10 dmg)'; },
};
function elderDialog(){
  const q=state.quest;
  if(q.state==='none'){
    openDialog('Elder Maren',[
      'The fires of Emberfall grow cold, traveler...',
      'Slimes crawl from the marshes and haunt our fields.',
      'Slay 8 slimes and I will reward you from the village coffers.',
    ],[
      {label:'Accept quest',act(){ q.state='active'; q.prog=0; sfx('quest');
        addText(player.x,player.y-30,'Quest: Slimy Situation (0/8)','#7ee787',2,true); state.dialog=null; }},
      {label:'Not now',act(){ state.dialog=null; }},
    ]);
    return;
  }
  if(q.state==='active'){
    if(questDone(q.id)){ q.state='ready'; }
    else {
      const msgs={
        q1:'The slimes still crawl... ('+q.prog+' / 8 slain)',
        q2:'Moul, the Corrupted Warden, prowls the wastes around the stairway. Slay it to break the seal.',
        q3:'The Bone King rules the first floor of the Depths.',
        q4:'Two fires remain: the Cinder Golem (F2) and Malachar (F3).',
        q5:'Pyrelord Vex storms the Ashen Deep (F4).',
        q6:'The EMBER TYRANT sits on its throne (F5). End this.',
      };
      openDialog('Elder Maren',[msgs[q.id],'Come back when it is done.']);
      return;
    }
  }
  if(q.state==='ready'){
    const reward=QUEST_CLAIM[q.id]();
    sfx('quest');
    const next=QUEST_ORDER[(QUEST_ORDER.indexOf(q.id)+1)];
    if(q.id==='q6'){
      q.state='done';
      addText(player.x,player.y-34,'EMBERFALL IS SAVED!','#ffd75e',3.5,true);
      openDialog('Elder Maren',[
        'You... you truly did it. The Tyrant is no more!',
        'The hearth-fires burn bright once again.',
        'Emberfall is saved. You are a legend, traveler.',
      ],[{label:'Claim final reward',act(){
        addText(player.x,player.y-30,reward,'#ffd75e',3,true);
        state.dialog=null;
      }}]);
      return;
    }
    q.id=next; q.state='active'; q.prog=0;
    addText(player.x,player.y-30,'Quest: '+QUESTS[next].title,'#7ee787',2.5,true);
    addText(player.x,player.y-56,reward,'#ffd75e',2.5,true);
    openDialog('Elder Maren',[
      reward,
      'New task: '+QUESTS[next].goal,
    ],[{label:'Onward',act(){ state.dialog=null; }}]);
    return;
  }
  openDialog('Elder Maren',['The hearth burns warm again, thanks to you.','Rest, hero of Emberfall — or delve once more.']);
}

    {label:'Reinforce Armor — '+armorPrice+'g',act(){

/* ---------------- interactions & floor transitions ---------------- */
function startTransition(cb){ state.trans={t:0,phase:'out',cb}; }
function toSurface(reason){
  state.floor=0; genSurface(); spawnNPCs(); buildMinimap();
  enemies=[]; arrows=[]; drops=[];
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  player.x=findFreeSpot(player.x,player.y,player.r).x;
  state.boss=null; state.portal=null;
  addText(player.x,player.y-40,reason,'#c9d1d9',2.5,true);
}
function descend(){
  if(state.floor>=MAXFLOOR) return;
  if(state.floor===0 && !state.flags.warden){
    sfx('denied'); shake(0.3,4);
    addText(player.x,player.y-40,'A corrupted seal bars the stairway...','#c46bff',2.8,true);
    addText(player.x,player.y-64,'Slay MOUL, the WARDEN that stalks these wastes!','#ff8a5e',2.8,true);
    return;
  }
  sfx('stairs');
  state.flags.descended=true;
  startTransition(()=>{
    state.floor++;
    state.boss=null;
    genDungeon(state.floor);
    player.x=state.dstart.x; player.y=state.dstart.y;
    populateFloor(); buildMinimap();
    cam.x=player.x-VW/2; cam.y=player.y-VH/2;
    sfx('quest');
    state.cine={t:0,dur:2.9,head:'EMBERFALL DUNGEONS',title:'FLOOR '+state.floor,sub:FLNAMES[state.floor]};
    addText(player.x,player.y-46,'Floor '+state.floor+' — '+FLNAMES[state.floor],'#ff8a5e',3,true);
    if(state.bossesDead[state.floor])
      addText(player.x,player.y-70,'Its guardian already lies slain.','#c9d1d9',2.5,true);
  });
}
function ascend(){
  if(state.floor<=0) return;
  sfx('stairs');
  startTransition(()=>{
    if(state.floor===1){
      state.boss=null;
      toSurface('You climb back to Emberfall — Surface');
      state.cine={t:0,dur:2.4,head:'EMBERFALL',title:'THE SURFACE',sub:'Emberfall Village'};
    }
    else {
      state.floor--;
      state.boss=null;
      genDungeon(state.floor);
      player.x=state.dstart.x; player.y=state.dstart.y;
      populateFloor(); buildMinimap();
      cam.x=player.x-VW/2; cam.y=player.y-VH/2;
      state.cine={t:0,dur:2.4,head:'EMBERFALL DUNGEONS',title:'FLOOR '+state.floor,sub:FLNAMES[state.floor]};
      addText(player.x,player.y-46,'Floor '+state.floor+' — '+FLNAMES[state.floor],'#ff8a5e',2.5,true);
    }
  });
}
function openChest(c){
  c.opened=true; state.openedChests.add(c.id);
  sfx('chest');
  burst(c.x,c.y,'#ffd75e',20,150,0.8,3.5);
  const n=4+((Math.random()*4)|0);
  for(let i=0;i<n;i++) drops.push({type:'coin',x:c.x+rnd(-14,14),y:c.y+rnd(-14,14),val:Math.ceil(rnd(2,6)),t:rnd(TAU),vx:rnd(-60,60),vy:rnd(-60,60)});
  if(Math.random()<0.45) drops.push({type:'gem',x:c.x+rnd(-10,10),y:c.y+rnd(-10,10),val:Math.ceil(rnd(20,50)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
  if(Math.random()<0.35) drops.push({type:'arrows',x:c.x+rnd(-10,10),y:c.y+rnd(-10,10),val:5+((Math.random()*6)|0),t:rnd(TAU),vx:rnd(-30,30),vy:rnd(-30,30)});
  if(c.vault){
    addText(c.x,c.y-30,'RELIC VAULT LOOT!','#ffd75e',2.8,true);
    sfx('reward');
    for(let i=0;i<6;i++) drops.push({type:'gem',x:c.x+rnd(-18,18),y:c.y+rnd(-18,18),val:Math.ceil(rnd(60,130)),t:rnd(TAU),vx:rnd(-50,50),vy:rnd(-50,50)});
    // vault chests hold a buff potion, never a health flask (guardians only)
    drops.push(makePotionDrop(c.x+rnd(-16,16),c.y+rnd(-16,16),true));
    drops.push({type:'arrows',x:c.x,y:c.y-8,val:14,t:rnd(TAU),vx:0,vy:0});
    burst(c.x,c.y,'#c46bff',34,190,1,4);
  }
}
function activateShrine(s){
  s.active=true;
  s.left=3+2*s.fl;
  sfx('shrine');
  addText(s.x,s.y-40,'The shrine awakens! Slay the guardians ('+s.left+')','#ffd75e',2.6,true);
  burst(s.x,s.y,'#ffd75e',24,160,0.9,3.5);
  for(let i=0;i<s.left;i++){
    const a=rnd(TAU), r=rnd(110,240);
    const spot=findFreeSpot(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r,12);
    makeEnemy(pick(SPAWNS[s.fl]),spot.x,spot.y,{shrineRef:s,elite:false,minion:false});
  }
}
function usePortal(){
  sfx('stairs');
  startTransition(()=>{ toSurface('The portal carries you home...'); });
}
function interact(){
  const n=nearNPC();
  if(n){
    if(n.kind==='elder') elderDialog();
    else if(n.kind==='merchant') merchantDialog();
    else if(n.kind==='vendor') vendorDialog(n);
    else openDialog('Little Osk',[
      'I saw a BIG red monster in the south-east wastes...',
      'Papa says the stairway it guards goes DOWN, like, five floors deep!',
      'And there are glowing shrines down there — Papa says never press E on them.',
      'Be careful, mister!',
    ]);
    return;
  }
  const ptx=Math.floor(player.x/TS), pty=Math.floor(player.y/TS);
  let sd=null;
  for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){
    const t=tileAt(ptx+dx,pty+dy);
    if(t===T_STAIRSDOWN) sd='down';
    else if(t===T_STAIRSUP) sd='up';
  }
  if(sd==='down' && state.floor<MAXFLOOR){ descend(); return; }
  if(sd==='up' && state.floor>0){ ascend(); return; }
  // cracked secret walls: press E beside one to break into a hidden vault
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if((dx||dy) && tileAt(ptx+dx,pty+dy)===T_SECRET){
      setTile(ptx+dx,pty+dy,T_FLOOR);
      const wx=(ptx+dx)*TS+TS/2, wy=(pty+dy)*TS+TS/2;
      sfx('slam'); shake(0.4,6);
      burst(wx,wy,'#c46bff',28,160,0.9,3.5);
      addText(player.x,player.y-50,'A secret passage opens...','#c46bff',2.8,true);
      buildMinimap();
      return;
    }
  }
  for(const c of chests)
    if(!c.opened && dist(c.x,c.y,player.x,player.y)<38){ openChest(c); return; }
  for(const s of shrines)
    if(!s.active && !s.done && dist(s.x,s.y,player.x,player.y)<46){ activateShrine(s); return; }
  // ancient biome altars: wake the hidden guardian (defeat it for its power)
  for(const a of state.biomeAltars)
    if(dist(a.x,a.y,player.x,player.y)<56){
      if(a.done){ addText(player.x,player.y-40,'This guardian already kneels.','#c9d1d9',1.8,true); return; }
      if(state.boss){ addText(player.x,player.y-40,'A duel is already underway!','#ff9a9a',1.6,true); return; }
      const s=findFreeSpot(a.x+rnd(-70,70),a.y+rnd(60,110),24);
      spawnBoss(a.boss,s.x,s.y);
      state.boss.biomeId=a.boss;
      burst(a.x,a.y-10,a.accent,36,200,1,4);
      addText(a.x,a.y-64,a.guardian+' STIRS...','#ffd75e',3,true);
      addText(player.x,player.y-40,'Slay it to claim its ancient power!','#ff8a5e',3,true);
      return;
    }
  if(state.portal && dist(state.portal.x,state.portal.y,player.x,player.y)<52){ usePortal(); return; }
}

/* ---------------- input ---------------- */
const keys={};
let mouse={x:0,y:0,down:false};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  ac();
  if(k==='m'){ muted=!muted; addText(player.x,player.y-26,muted?'Muted':'Sound on','#c9d1d9'); }
  if(k==='b'){ state.dbg=!state.dbg; }
  if(k==='p' && state.mode==='play'){ state.paused=!state.paused; }
  if(k==='i' && state.mode==='play' && !state.dialog){ state.inv=!state.inv; return; }
  if(state.inv && k==='escape'){ state.inv=false; if(heldStack){ addItem(heldStack.id,heldStack.count); heldStack=null; } return; }
  if(!state.inv && !state.dialog && state.mode==='play' && ['1','2','3','4','5'].includes(k)){ selectHotbar(+k-1); return; }
  if(k==='f' && state.mode==='play' && !state.dialog && !state.inv){ useHotbar(); return; }
  if(k==='shift' && state.mode==='play' && !state.dialog && !state.inv && player.abilities.dash && player.dashCd<=0 && !player.drink){
    player.dashT=0.16; player.dashCd=1.8;
    player.dashDir=Math.atan2(player.face.y||0.01,player.face.x||1);
    sfx('dash'); burst(player.x,player.y,'#9ad1ff',12,150,0.4,3);
    return;
  }
  if(k==='g' && state.mode==='play' && !state.dialog && !state.inv){
    if(!player.abilities.whirl){ sfx('denied'); addText(player.x,player.y-26,'No whirl power yet - slay the Dune Serpent','#c9d1d9'); }
    else doWhirl();
    return;
  }
  if(state.mode==='title' && (k==='enter'||k===' ')){ startGame(); return; }
  if(state.mode==='dead' && k==='enter'){ respawn(); return; }
  if(state.mode==='victory' && k==='enter'){ state.mode='play'; state.firstVictory=false; return; }
  if(state.dialog){
    const D=state.dialog;
    if(D.options){
      for(let i=0;i<D.options.length;i++)
        if(k===String(i+1)){ D.options[i].act(); return; }
      if(k==='escape'){ state.dialog=null; return; }
    }
    if(k==='e'||k==='enter'||k===' '||k==='escape'){
      if(D.options && (k==='e')){ state.dialog=null; return; }
      if(!D.options){
        if(D.page<D.lines.length-1) D.page++;
        else state.dialog=null;
      }
    }
    return;
  }
  if(state.mode!=='play') return;
  if(state.cine) return; // cinematic freeze
  if(state.inv) return;  // inventory open
  if(k==='r'){
    if(!player.bow){ sfx('denied'); addText(player.x,player.y-26,'No bow yet — Finn sells them','#c9d1d9'); }
    else { player.weapon = player.weapon==='bow' ? 'sword' : 'bow'; sfx('coin');
      addText(player.x,player.y-26,'Weapon: '+(player.weapon==='bow'?'Bow':'Sword'),'#ffd75e'); }
    return;
  }
  if(k==='e') interact();
  if(k==='q') drinkPotion();
  if(k===' '||k==='j') doAttack(Math.atan2(player.face.y,player.face.x));
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });
cvs.addEventListener('mousemove',e=>{ const r=cvs.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
cvs.addEventListener('mousedown',e=>{
  ac();
  if(state.mode==='title'){ startGame(); return; }
  if(state.mode==='dead'){ respawn(); return; }
  if(state.mode==='victory'){ state.mode='play'; state.firstVictory=false; return; }
  if(state.inv){ invClick(); return; }
  if(state.dialog||state.paused||state.trans||state.cine) return;
  // top-right hotbar: click a slot to select it (and use consumables)
  {
    const n=HOTN, s=Math.min(40,(VW-40)/n-6), gap=5;
    const total=n*s+(n-1)*gap, x0=VW-total-16, y0=14;
    if(mouse.x>=x0-8 && mouse.x<=x0+total+8 && mouse.y>=y0-8 && mouse.y<=y0+s+8){
      for(let i=0;i<n;i++){
        const x=x0+i*(s+gap);
        if(mouse.x>=x&&mouse.x<x+s&&mouse.y>=y0&&mouse.y<y0+s){
          selectHotbar(i);
          const sl=player.hotbar[i];
          if(sl && IDEF[sl.id].drink) startDrink(sl);   // click = chug
          return;
        }
      }
      return;
    }
  }
  const wx=mouse.x+cam.x, wy=mouse.y+cam.y;
  doAttack(Math.atan2(wy-player.y,wx-player.x));
});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

function startGame(){
  state.mode='play';
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  sfx('quest');
  addText(player.x,player.y-40,'Welcome to Emberfall','#ffd75e',3,true);
}
function respawn(){
  if(state.floor!==0){ genSurface(); spawnNPCs(); buildMinimap(); state.floor=0; }
  player.hp=player.maxHp;
  player.gold=Math.floor(player.gold*0.8);
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  enemies=[]; arrows=[]; drops=[];
  state.boss=null; state.portal=null; state.trans=null;
  state.mode='play'; player.invulnT=2;
