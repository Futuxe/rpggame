}
function drawShrineOne(s){
  const sx=s.x-cam.x, sy=s.y-cam.y;
  const t=state.time;
  shadowEllipse(sx,sy+10,13,5);
  ctx.fillStyle='#6a6a72';
  ctx.beginPath(); ctx.ellipse(sx,sy+6,12,5,0,0,TAU); ctx.fill();
  ctx.fillStyle='#8a8a92'; ctx.fillRect(sx-6,sy-6,12,12);
  ctx.fillStyle='#5a5a62'; ctx.fillRect(sx-8,sy+2,16,5);
  const bob=Math.sin(t*2.4)*3;
  if(s.done){
    ctx.fillStyle='rgba(150,160,170,0.5)';
    ctx.beginPath(); ctx.arc(sx,sy-12+bob,4,0,TAU); ctx.fill();
  } else if(s.active){
    const gl=0.5+0.5*Math.sin(t*6);
    const gr=ctx.createRadialGradient(sx,sy-12+bob,2,sx,sy-12+bob,26);
    gr.addColorStop(0,`rgba(255,200,90,${0.5+gl*0.4})`); gr.addColorStop(1,'rgba(255,140,50,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sx,sy-12+bob,26,0,TAU); ctx.fill();
    ctx.fillStyle='#ffe08a';
    ctx.beginPath(); ctx.arc(sx,sy-12+bob,5,0,TAU); ctx.fill();
    ctx.strokeStyle=`rgba(255,215,94,${0.5+gl*0.4})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy-6,(26+gl*10)%(40)+14,0,TAU); ctx.stroke();
  } else {
    const gl=0.5+0.5*Math.sin(t*2.2);
    ctx.fillStyle=`rgba(120,200,255,${0.55+gl*0.35})`;
    ctx.beginPath(); ctx.arc(sx,sy-12+bob,4.5,0,TAU); ctx.fill();
    ctx.strokeStyle=`rgba(120,200,255,${0.25+gl*0.3})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(sx,sy-12+bob,8+gl*2,0,TAU); ctx.stroke();
  }
}
function drawPortalOne(po){
  const sx=po.x-cam.x, sy=po.y-cam.y;
  const t=state.time;
  const gr=ctx.createRadialGradient(sx,sy,2,sx,sy,34);
  gr.addColorStop(0,'rgba(190,110,255,0.55)'); gr.addColorStop(1,'rgba(190,110,255,0)');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sx,sy,34,0,TAU); ctx.fill();
  for(let i=0;i<3;i++){
    ctx.strokeStyle=['#c46bff','#ffd75e','#8a5cff'][i];
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(sx,sy,8+i*6,t*2+i*2,t*2+i*2+4); ctx.stroke();
  }
}

function drawPlayer(){
  const p=player;
  const sx=p.x-cam.x, sy=p.y-cam.y;
  const bob=p.moving?Math.sin(p.walkT)*1.6:Math.sin(state.time*2.2)*0.8;
  const blink = p.invulnT>0 && (Math.floor(state.time*14)%2===0);
  if(blink && state.mode==='play') return;
  shadowEllipse(sx,sy+9,10,4.5);
  ctx.fillStyle='#3a6fd8';
  roundRect(sx-8,sy-8+bob,16,18,5); ctx.fill();
  ctx.fillStyle='#2a55ab';
  roundRect(sx-8,sy+2+bob,16,8,4); ctx.fill();
  ctx.fillStyle='#5a3a22'; ctx.fillRect(sx-8,sy+1+bob,16,3);
  ctx.fillStyle='#ffd75e'; ctx.fillRect(sx-2,sy+1+bob,4,3);
  ctx.fillStyle='#f0c49a';
  ctx.beginPath(); ctx.arc(sx,sy-13+bob,7,0,TAU); ctx.fill();
  ctx.fillStyle='#7a4a1e';
  ctx.beginPath(); ctx.arc(sx,sy-15+bob,7,Math.PI,TAU); ctx.fill();
  ctx.fillStyle='#222';
  const ex=p.face.x*2, ey=p.face.y*1.4;
  ctx.beginPath(); ctx.arc(sx-2.5+ex,sy-12+bob+ey,1.3,0,TAU); ctx.arc(sx+2.5+ex,sy-12+bob+ey,1.3,0,TAU); ctx.fill();
  if(p.swingT>0){
    const prog=1-p.swingT/0.18;
    const a0=p.swingDir-1.5, a1=p.swingDir+1.0;
    const a=lerp(a0,a1,prog);
    ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(sx,sy,42,a0,a); ctx.stroke();
    ctx.strokeStyle='rgba(255,215,94,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*22,sy+Math.sin(a)*22);
    ctx.lineTo(sx+Math.cos(a)*44,sy+Math.sin(a)*44); ctx.stroke();
  } else {
    ctx.strokeStyle='#b8b8c8'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx+6,sy-10+bob); ctx.lineTo(sx+11,sy+2+bob); ctx.stroke();
  }
}
function drawNPC(n){
  const sx=n.x-cam.x, sy=n.y-cam.y;
  const bob=Math.sin(state.time*2+n.x)*1.2;
  shadowEllipse(sx,sy+9,n.r*0.9,4);
  ctx.fillStyle=n.robe;
  roundRect(sx-8,sy-8+bob,16,18,5); ctx.fill();
  ctx.fillStyle=n.c;
  ctx.beginPath(); ctx.arc(sx,sy-13+bob,7,0,TAU); ctx.fill();
  if(n.kind==='elder'){
    ctx.fillStyle='#e8e8e8';
    ctx.beginPath(); ctx.ellipse(sx,sy-7+bob,4,6,0,0,TAU); ctx.fill();
    ctx.fillStyle='#4a3a8f';
    ctx.beginPath(); ctx.ellipse(sx,sy-19+bob,9,3.5,0,0,TAU); ctx.fill();
    ctx.fillRect(sx-5,sy-26+bob,10,7);
  }
  if(n.kind==='merchant'){
    ctx.fillStyle='#8a5a1e';
    ctx.beginPath(); ctx.ellipse(sx,sy-18+bob,9,3,0,0,TAU); ctx.fill();
    ctx.fillRect(sx-4,sy-25+bob,8,7);
  }
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(sx-2.5,sy-12+bob,1.2,0,TAU); ctx.arc(sx+2.5,sy-12+bob,1.2,0,TAU); ctx.fill();
  if(dist(n.x,n.y,player.x,player.y)<44 && !state.dialog){
    ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    const t='E — Talk';
    const w=ctx.measureText(t).width+10;
    ctx.fillStyle='rgba(0,0,0,0.65)'; roundRect(sx-w/2,sy-42,w,15,4); ctx.fill();
    ctx.fillStyle='#ffd75e'; ctx.fillText(t,sx,sy-31);
  }
}
function drawEnemy(e){
  const sx=e.x-cam.x, sy=e.y-cam.y;
  shadowEllipse(sx,sy+e.r*0.8,e.r,e.r*0.42);
  const flash=e.flash>0;
  if(e.elite){
    const gl=0.5+0.5*Math.sin(state.time*4+e.phase);
    ctx.strokeStyle=`rgba(200,110,255,${0.5+gl*0.4})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy,e.r+5+gl*2,0,TAU); ctx.stroke();
    ctx.fillStyle=`rgba(220,150,255,${0.6+gl*0.3})`;
    ctx.beginPath(); ctx.arc(sx+Math.cos(state.time*3)*e.r,sy-6,1.8,0,TAU); ctx.fill();
  }
  if(e.type==='slime'||e.type==='dslime'){
    const sq=1+Math.sin(e.phase)*0.12;
    ctx.fillStyle=flash?'#fff':(e.type==='dslime'?'#8e4fd0':'#4ec954');
    ctx.beginPath(); ctx.ellipse(sx,sy,e.r*sq,e.r/sq,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(sx-3,sy-4,3.5,2.5,-0.5,0,TAU); ctx.fill();
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.arc(sx-3,sy,1.6,0,TAU); ctx.arc(sx+3.5,sy,1.6,0,TAU); ctx.fill();
  } else if(e.type==='bat'){
    const flap=Math.sin(e.phase*2.2)*0.7;
    ctx.fillStyle=flash?'#fff':'#6d5680';
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+s*12,sy-3-flap*7);
      ctx.lineTo(sx+s*14,sy+3+flap*5);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle=flash?'#fff':'#4a3a58';
    ctx.beginPath(); ctx.ellipse(sx,sy,e.r*0.8,e.r,0,0,TAU); ctx.fill();
    ctx.fillStyle='#ffcf6b';
    ctx.beginPath(); ctx.arc(sx-2,sy-1,1.2,0,TAU); ctx.arc(sx+2,sy-1,1.2,0,TAU); ctx.fill();
  } else if(e.type==='skeleton'){
    ctx.strokeStyle=flash?'#fff':'#e8e8e0'; ctx.fillStyle=flash?'#fff':'#e8e8e0'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(sx,sy-9,6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx,sy-3); ctx.lineTo(sx,sy+7);
    ctx.moveTo(sx-5,sy+1); ctx.lineTo(sx+5,sy+1);
    ctx.moveTo(sx-4,sy+4); ctx.lineTo(sx+4,sy+4);
    ctx.moveTo(sx,sy+7); ctx.lineTo(sx-3,sy+11); ctx.moveTo(sx,sy+7); ctx.lineTo(sx+3,sy+11);
    ctx.stroke();
    ctx.fillStyle='#ff4b4b';
    ctx.beginPath(); ctx.arc(sx-2.3,sy-9,1.4,0,TAU); ctx.arc(sx+2.3,sy-9,1.4,0,TAU); ctx.fill();
  } else if(e.type==='wraith'){
    const a=0.65+Math.sin(e.phase*0.7)*0.2;
    ctx.globalAlpha=a;
    ctx.fillStyle=flash?'#fff':'#9b59d0';
    ctx.beginPath();
    ctx.moveTo(sx,sy-16);
    ctx.quadraticCurveTo(sx+11,sy-6,sx+7,sy+8);
    ctx.quadraticCurveTo(sx+4,sy+3,sx,sy+9);
    ctx.quadraticCurveTo(sx-4,sy+3,sx-7,sy+8);
    ctx.quadraticCurveTo(sx-11,sy-6,sx,sy-16);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffe08a';
    ctx.beginPath(); ctx.arc(sx-3,sy-8,1.8,0,TAU); ctx.arc(sx+3,sy-8,1.8,0,TAU); ctx.fill();
  } else if(e.type==='golem'){
    const gl=0.5+0.5*Math.sin(e.phase*0.8);
    ctx.fillStyle=flash?'#fff':'#6b6570';
    roundRect(sx-11,sy-12,22,22,6); ctx.fill();
    ctx.fillStyle='#57525c';
    roundRect(sx-11,sy-12,22,8,5); ctx.fill();
    roundRect(sx-13,sy-2,7,11,3); ctx.fill();
    roundRect(sx+6,sy-2,7,11,3); ctx.fill();
    ctx.strokeStyle=`rgba(255,150,70,${0.5+gl*0.4})`; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(sx-4,sy-6); ctx.lineTo(sx+2,sy); ctx.lineTo(sx-2,sy+7);
    ctx.stroke();
    ctx.fillStyle=`rgba(255,190,90,${0.7+gl*0.3})`;
    ctx.beginPath(); ctx.arc(sx-3,sy-6,1.6,0,TAU); ctx.arc(sx+4,sy-5,1.6,0,TAU); ctx.fill();
  } else { // necro
    const a=0.8+Math.sin(e.phase*0.6)*0.15;
    ctx.globalAlpha=a;
    ctx.fillStyle=flash?'#fff':'#4a3568';
    ctx.beginPath();
    ctx.moveTo(sx,sy-16);
    ctx.quadraticCurveTo(sx+10,sy-4,sx+8,sy+9);
    ctx.lineTo(sx-8,sy+9);
    ctx.quadraticCurveTo(sx-10,sy-4,sx,sy-16);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#2c2040';
    ctx.beginPath(); ctx.arc(sx,sy-10,5.5,0,TAU); ctx.fill();
    ctx.fillStyle='#c46bff';
    ctx.beginPath(); ctx.arc(sx-2,sy-10,1.4,0,TAU); ctx.arc(sx+2,sy-10,1.4,0,TAU); ctx.fill();
    ctx.strokeStyle='#5a4030'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(sx+9,sy-18); ctx.lineTo(sx+11,sy+8); ctx.stroke();
    const gl=0.5+0.5*Math.sin(state.time*5+e.phase);
    ctx.fillStyle=`rgba(190,110,255,${0.6+gl*0.4})`;
    ctx.beginPath(); ctx.arc(sx+9,sy-20,2.6+gl,0,TAU); ctx.fill();
  }
  if(e.hp<e.maxHp){
    const w=26;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(sx-w/2,sy-e.r-14,w,4);
    ctx.fillStyle=e.elite?'#c46bff':'#ff5b5b';
    ctx.fillRect(sx-w/2,sy-e.r-14,w*clamp(e.hp/e.maxHp,0,1),4);
  }
}

function drawBoss(){
  const b=state.boss; if(!b) return;
  const sx=b.x-cam.x, sy=b.y-cam.y;
  const t=state.time;
  if(b.telegraph>0){
    ctx.fillStyle='rgba(255,60,30,0.18)';
    ctx.beginPath(); ctx.arc(sx,sy,b.telegraphR,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,80,40,0.7)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx,sy,b.telegraphR*(1-b.telegraph/0.95),0,TAU); ctx.stroke();
  }
  if(b.kind==='pyrelord'&&b.telegraph>0){
    ctx.strokeStyle='rgba(255,80,40,0.5)'; ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(b.teleA)*280,sy+Math.sin(b.teleA)*280);
    ctx.stroke();
  }
  shadowEllipse(sx,sy+b.r*0.85,b.r*1.15,b.r*0.45);
  const flash=b.flash>0;
  const gl2=0.5+0.5*Math.sin(b.phase);
  if(b.kind==='boneking'){
    const bob=Math.sin(b.phase*0.7)*2;
    ctx.fillStyle='#241c28';
    ctx.beginPath();
    ctx.moveTo(sx-14,sy-10+bob); ctx.quadraticCurveTo(sx-20,sy+10+bob,sx-8,sy+14+bob);
    ctx.lineTo(sx+8,sy+14+bob); ctx.quadraticCurveTo(sx+20,sy+10+bob,sx+14,sy-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=flash?'#fff':'#e8e8e0'; ctx.fillStyle=flash?'#fff':'#e8e8e0';
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(sx,sy-14+bob,9,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx,sy-4+bob); ctx.lineTo(sx,sy+8+bob);
    ctx.moveTo(sx-8,sy+bob); ctx.lineTo(sx+8,sy+bob);
    ctx.moveTo(sx-6,sy+5+bob); ctx.lineTo(sx+6,sy+5+bob);
    ctx.stroke();
    ctx.fillStyle='#ffd75e';
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*5-2,sy-22+bob);
      ctx.lineTo(sx+i*5,sy-30+bob);
      ctx.lineTo(sx+i*5+2,sy-22+bob);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#ff4b4b';
    ctx.beginPath(); ctx.arc(sx-3.5,sy-15+bob,1.8,0,TAU); ctx.arc(sx+3.5,sy-15+bob,1.8,0,TAU); ctx.fill();
    ctx.strokeStyle='#c8c8d0'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx+14,sy-6+bob); ctx.lineTo(sx+30,sy-20+bob); ctx.stroke();
  } else if(b.kind==='cindergolem'){
    const sq=1+Math.sin(b.phase)*0.06;
    ctx.fillStyle=flash?'#fff':'#4d3f45';
    ctx.beginPath(); ctx.ellipse(sx,sy+4,b.r*0.9*sq,b.r*0.85/sq,0,0,TAU); ctx.fill();
    ctx.fillStyle='#3a2f34';
    ctx.beginPath(); ctx.ellipse(sx,sy-b.r*0.4,b.r*0.6*sq,b.r*0.5/sq,0,0,TAU); ctx.fill();
    roundRect(sx-b.r-8,sy-8,14,20,5); ctx.fill();
    roundRect(sx+b.r-6,sy-8,14,20,5); ctx.fill();
    ctx.strokeStyle=`rgba(255,140,50,${0.55+gl2*0.4})`; ctx.lineWidth=2.5;
    ctx.beginPath();

  } else if(b.kind==='malachar'){
    const bob=Math.sin(b.phase*0.7)*3;

    ctx.fillStyle='#c46bff';

  } else if(b.kind==='pyrelord'){
    for(let i=0;i<3;i++){
      const wob=Math.sin(t*6+i*2)*4;

      ctx.fillStyle=flash?'#fff':['rgba(255,110,40,0.85)','rgba(255,190,80,0.9)','rgba(255,240,200,0.95)'][i];

      ctx.quadraticCurveTo(sx-rr,sy-rr*0.2,sx,sy-rr*1.2+wob);

    ctx.beginPath(); ctx.arc(sx-4,sy-2,2.2,0,TAU); ctx.arc(sx+4,sy-2,2.2,0,TAU); ctx.fill();
    if(Math.random()<0.5) parts.push({x:b.x+rnd(-14,14),y:b.y+rnd(-6,14),vx:rnd(-14,14),vy:rnd(-70,-30),life:rnd(0.3,0.7),max:0.7,color:'#ff9a3d',size:2.4,grav:-20});
  } else { // tyrant

    gr.addColorStop(0,'rgba(255,110,40,0.35)'); gr.addColorStop(1,'rgba(255,110,40,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sx,sy,b.r*2.2,0,TAU); ctx.fill();
    ctx.fillStyle=flash?'#fff':(b.enraged?'#d33a1e':'#b3341c');
    ctx.beginPath(); ctx.ellipse(sx,sy,b.r*sq,b.r/sq,0,0,TAU); ctx.fill();
    ctx.fillStyle=flash?'#fff':'#7a2412';
    ctx.beginPath(); ctx.ellipse(sx,sy+b.r*0.5,b.r*0.9*sq,b.r*0.45/sq,0,0,Math.PI); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.ellipse(sx-b.r*0.35,sy-b.r*0.4,b.r*0.25,b.r*0.16,-0.6,0,TAU); ctx.fill();
    ctx.fillStyle='#ffe08a';
    const ex=(player.x-b.x>0?3:-3);
    ctx.beginPath(); ctx.arc(sx-8+ex,sy-7,3.8,0,TAU); ctx.arc(sx+8+ex,sy-7,3.8,0,TAU); ctx.fill();
    ctx.fillStyle='#1a0505';
    ctx.beginPath(); ctx.arc(sx-8+ex,sy-7,1.6,0,TAU); ctx.arc(sx+8+ex,sy-7,1.6,0,TAU); ctx.fill();
    for(let i=-2;i<=2;i++){
      const fl=0.5+0.5*Math.sin(t*5+i*1.7);
      ctx.fillStyle=`rgba(255,${120+fl*100|0},50,${0.5+fl*0.5})`;
      ctx.beginPath(); ctx.arc(sx+i*9,sy-b.r*sq-5-fl*6,2.8,0,TAU); ctx.fill();
    }
  }
}

}

/* ---------------- darkness, ray-traced lighting & shadows ----------------
   Two-stage ray tracing:
   1. each light source raycasts a visibility polygon (walls cast shadows);
   2. that light is clipped again by the PLAYER's own visibility polygon,
      and a light whose source has no line of sight to the player is skipped
      entirely — so torchlight never shows up through a wall or around a
      corner into a corridor you cannot see.                                    */
const lightCvs=document.createElement('canvas');
const lightCtx=lightCvs.getContext('2d');

function lightBlocked(x,y){
  const t=tileAt(Math.floor(x/TS),Math.floor(y/TS));
  return t===T_WALL || t===T_SECRET;
}
/* marching ray from a to b; true when nothing but air/wall-face between */
function losClear(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0;
  const d=Math.hypot(dx,dy);
  if(d<1) return true;
  const n=Math.max(2,Math.ceil(d/(TS*0.32)));
  for(let i=1;i<n;i++){
    const t=i/n;
    if(lightBlocked(x0+dx*t, y0+dy*t)) return false;
  }
  return true;
}
/* cast N rays in a full circle, stopping at the first wall hit */
function visPoly(x,y,r,N=56){
  const pts=[], step=TS/3;
  for(let i=0;i<N;i++){
    const a=(i/N)*TAU, ca=Math.cos(a), sa=Math.sin(a);
    let hit=r, d=0;
    while(d<r){
      d+=step;
      if(d>=r) break;
      if(lightBlocked(x+ca*d,y+sa*d)){ hit=d-step*0.55; break; }
    }
    if(hit<4) hit=4;
    pts.push([x+ca*hit,y+sa*hit]);
  }
  return pts;
}
/* static lights (torches, lava, shrines, chests) keep their polygon cached */
function cacheVis(o,r,N=40,ox,oy){
  const x=ox!==undefined?ox:o.x, y=oy!==undefined?oy:o.y;
  if(o._vr!==r || o._vx!==x || o._vy!==y){
    o._vp=visPoly(x,y,r,N); o._vr=r; o._vx=x; o._vy=y;
  }
  return o._vp;
}

function drawDarkness(){
  if(state.floor===0) return;
  if(lightCvs.width!==VW||lightCvs.height!==VH){ lightCvs.width=VW; lightCvs.height=VH; }
  lightCtx.clearRect(0,0,VW,VH);
  lightCtx.fillStyle=THEMES[state.floor].fog;
  lightCtx.fillRect(0,0,VW,VH);
  lightCtx.globalCompositeOperation='destination-out';
  const t=state.time;

  const px=player.x-cam.x, py=player.y-cam.y;

  // player's own visibility — everything is clipped to what the player can see
  const reach=Math.max(900,150+42*player.lightLvl);
  const playerPoly=visPoly(player.x,player.y,reach,88);
  const clipPoly=(pts)=>{
    lightCtx.beginPath();
    lightCtx.moveTo(pts[0][0]-cam.x, pts[0][1]-cam.y);
    for(let i=1;i<pts.length;i++) lightCtx.lineTo(pts[i][0]-cam.x, pts[i][1]-cam.y);
    lightCtx.closePath();
    lightCtx.clip();
  };

  // punch a ray-traced hole that is both lit by the source and visible to the player
  const holeAt=(cx,cy,r,pts)=>{
    const sx=cx-cam.x, sy=cy-cam.y;
    if(sx<-r-24||sy<-r-24||sx>VW+r+24||sy>VH+r+24) return;
    lightCtx.save();
    clipPoly(playerPoly);
    if(pts) clipPoly(pts);
    const g=lightCtx.createRadialGradient(sx,sy,r*0.16,sx,sy,r);
    g.addColorStop(0,'rgba(0,0,0,1)');
    g.addColorStop(0.45,'rgba(0,0,0,0.85)');
    g.addColorStop(0.75,'rgba(0,0,0,0.42)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    lightCtx.fillStyle=g;
    lightCtx.fillRect(sx-r,sy-r,r*2,r*2);
    lightCtx.restore();
  };

  // lantern — moving light, rays recast every frame
  const pr=150+42*player.lightLvl;
  holeAt(player.x,player.y,pr,playerPoly);

  // torches — mounted on wall faces; cast from just in front of the wall
  for(const tr of torches){
    if(tr.x-cam.x<-170||tr.x-cam.x>VW+170||tr.y-cam.y<-170||tr.y-cam.y>VH+170) continue;
    const sd=tr.side||[0,0];
    const lx=tr.x+sd[0]*15, ly=tr.y+sd[1]*15;
    if(!losClear(player.x,player.y,lx,ly)) continue; // you cannot see this torch
    const r=112+12*Math.sin(t*7+tr.fl*9);
    holeAt(lx,ly,r,cacheVis(tr,124,44,lx,ly));
  }

  // lava — cached small glow, occluded + LOS gated
  for(const lv of lavas){
    if(lv.x-cam.x<-120||lv.x-cam.x>VW+120||lv.y-cam.y<-120||lv.y-cam.y>VH+120) continue;
    if(!losClear(player.x,player.y,lv.x,lv.y)) continue;
    holeAt(lv.x,lv.y,78+6*Math.sin(t*3+lv.x*0.01),cacheVis(lv,84,32));
  }

  for(const s of shrines){
    if(!losClear(player.x,player.y,s.x,s.y)) continue;
    const r=s.active?105:64;
    holeAt(s.x,s.y,r,cacheVis(s,r,36));
  }
  for(const c of chests){
    if(c.opened || !losClear(player.x,player.y,c.x,c.y)) continue;
    holeAt(c.x,c.y,42,cacheVis(c,46,28));
  }
  for(const e of enemies){
    if(!e.elite || !losClear(player.x,player.y,e.x,e.y)) continue;
    holeAt(e.x,e.y,60,null);
  }
  if(state.boss && losClear(player.x,player.y,state.boss.x,state.boss.y))
    holeAt(state.boss.x,state.boss.y,160,visPoly(state.boss.x,state.boss.y,160,48));
  if(state.portal && losClear(player.x,player.y,state.portal.x,state.portal.y))
    holeAt(state.portal.x,state.portal.y,118,visPoly(state.portal.x,state.portal.y,118,40));
  for(const d of drops){
    if(!losClear(player.x,player.y,d.x,d.y)) continue;
    holeAt(d.x,d.y,34,null);
  }

  lightCtx.globalCompositeOperation='source-over';
  ctx.drawImage(lightCvs,0,0);
}

/* ---------------- minimap ---------------- */
let minimap=null;
function buildMinimap(){
  const W=mapW, H=mapH;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'), img=g.createImageData(W,H);
  for(let i=0;i<W*H;i++){
    const t=tiles[i];
    let col;
    if(state.floor===0){
      col = t===T_WATER?[38,92,150] : t===T_SAND?[205,185,130] : t===T_CORRUPT?[90,60,110] :
            t===T_STAIRSDOWN?[255,120,220] : [70,140,70];
    } else {
      const th=THEMES[state.floor];
      col = t===T_WALL?[24,20,18] : t===T_SECRET?[52,36,50] : t===T_LAVA?[255,106,42] :
            t===T_STAIRSDOWN?[255,215,94] : t===T_STAIRSUP?[126,231,135] :
            [parseInt(th.floorHi.slice(1,3),16),parseInt(th.floorHi.slice(3,5),16),parseInt(th.floorHi.slice(5,7),16)];
    }
    img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  minimap=c;
}

  }

  // ember seal progress
  if(state.floor>0 && state.sealSet && state.sealSet.size){
    if(!state.sealOpen){
      const left=enemies.filter(e=>!e.minion && !e.shrineRef && !e.vaultGuard).length;
      ctx.fillStyle='rgba(26,8,2,0.72)'; roundRect(14,qy-13,240,20,6); ctx.fill();
      ctx.fillStyle='#ff8a5e'; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
      ctx.fillText('✖ Ember Seal — '+left+' foes remain',22,qy+1);
    } else if(!state.bossesDead[state.floor]){
      ctx.fillStyle='rgba(26,8,2,0.72)'; roundRect(14,qy-13,240,20,6); ctx.fill();
      ctx.fillStyle='#ffd75e'; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
      ctx.fillText('✔ The Seal is broken — guardian awaits',22,qy+1);
    }
    qy+=26;
  }

  // out-of-combat regeneration status
  if(p.hp<p.maxHp){
    if(p.hurtT>=30){
      ctx.fillStyle='rgba(10,26,14,0.7)'; roundRect(14,qy-13,240,20,6); ctx.fill();
      ctx.fillStyle='#7ee787'; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
      ctx.fillText('✚ Regenerating +1 HP/s',22,qy+1);
    } else {
      const left=Math.max(0,30-p.hurtT);
      ctx.fillStyle='rgba(10,12,18,0.55)'; roundRect(14,qy-13,240,20,6); ctx.fill();
      ctx.fillStyle='#8b949e'; ctx.font='11px system-ui'; ctx.textAlign='left';
      ctx.fillText('✚ Regen in '+Math.ceil(left)+'s',22,qy+1);
    }
    qy+=26;
  }

  // boss bar
  if(state.boss){
    const b=state.boss;
    const w=Math.min(430,VW-300), x=(VW-w)/2;
    ctx.fillStyle='rgba(10,12,18,0.75)'; roundRect(x-6,16,w+12,30,8); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(x,24,w,12,6); ctx.fill();
    ctx.fillStyle=b.enraged?'#ff4b2e':'#d8451e'; roundRect(x,24,w*clamp(b.hp/b.maxHp,0,1),12,6); ctx.fill();
    ctx.fillStyle='#ffd75e'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(BDEF[b.kind].name+(b.enraged?' — ENRAGED':''),VW/2,52);
  }

  // minimap
  if(minimap){
    const s2=Math.min(138,VH*0.2), mx=VW-s2-16, my=16;
    ctx.fillStyle='rgba(10,12,18,0.75)'; roundRect(mx-5,my-5,s2+10,s2+10,8); ctx.fill();
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(minimap,mx,my,s2,s2);
    ctx.imageSmoothingEnabled=true;
    const sc=s2/(mapW*TS);
    const dot=(x,y,c,sz)=>{ ctx.fillStyle=c; ctx.fillRect(mx+x*sc-sz/2,my+y*sc-sz/2,sz,sz); };
    if(state.floor===0) for(const n of npcs) dot(n.x,n.y,'#9ad1ff',3);
    for(const c2 of chests) if(!c2.opened) dot(c2.x,c2.y,'#ffd75e',2.5);
    for(const sh of shrines) dot(sh.x,sh.y, sh.done?'#5a5a62':sh.active?'#ff9a3d':'#7ee7ff',3);
    if(state.portal) dot(state.portal.x,state.portal.y,'#c46bff',4);
    if(state.boss) dot(state.boss.x,state.boss.y,'#ff4b2e',5);
    dot(player.x,player.y,'#fff',4);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
    ctx.strokeRect(mx+cam.x*sc,my+cam.y*sc,VW*sc,VH*sc);
    ctx.fillStyle='#c9d1d9'; ctx.font='10px system-ui'; ctx.textAlign='center';
    ctx.fillText(state.floor===0?'Surface — Emberfall':'Floor '+state.floor+' · '+FLNAMES[state.floor],mx+s2/2,my+s2+13);
  }

  if(p.hurtFlash>0){
    ctx.fillStyle=`rgba(200,30,30,${p.hurtFlash*0.8})`;
    ctx.fillRect(0,0,VW,VH);
  }
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.42,VW/2,VH/2,Math.max(VW,VH)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
}
function drawDialog(){
  const D=state.dialog; if(!D) return;
  const w=Math.min(640,VW-60), h=150+(D.options?D.options.length*26:0);
  const x=(VW-w)/2, y=VH-h-30;
  ctx.fillStyle='rgba(8,10,16,0.88)';
  roundRect(x,y,w,h,12); ctx.fill();
  ctx.strokeStyle='rgba(255,215,94,0.4)'; ctx.lineWidth=2;
  roundRect(x+3,y+3,w-6,h-6,10); ctx.stroke();
  ctx.fillStyle='#5a3f9e';
  ctx.beginPath(); ctx.arc(x+40,y+52,24,0,TAU); ctx.fill();
  ctx.fillStyle='#f0c49a';
  ctx.beginPath(); ctx.arc(x+40,y+48,15,0,TAU); ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(x+34,y+46,2,0,TAU); ctx.arc(x+46,y+46,2,0,TAU); ctx.fill();
  ctx.fillStyle='#ffd75e'; ctx.font='bold 15px system-ui'; ctx.textAlign='left';
  ctx.fillText(D.name,x+76,y+34);
  ctx.fillStyle='#e8e8f0'; ctx.font='14px system-ui';
  wrapText(D.lines[D.page],x+76,y+58,w-100,19);
  if(!D.options){
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font='11px system-ui'; ctx.textAlign='right';
    ctx.fillText((D.page<D.lines.length-1?'E / Enter — next':'E / Enter — close'), x+w-16, y+h-14);
  } else {
    ctx.font='bold 13px system-ui'; ctx.textAlign='left';
    D.options.forEach((o,i)=>{
      const oy=y+96+i*26;
      ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(x+70,oy-15,w-100,22,5); ctx.fill();
      ctx.fillStyle='#ffd75e'; ctx.fillText('['+(i+1)+']',x+80,oy+1);
      ctx.fillStyle='#e8e8f0'; ctx.fillText(o.label,x+108,oy+1);
    });
  }
}
function wrapText(txt,x,y,maxW,lh){
  const words=txt.split(' '); let line='', yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t;
  }
  ctx.fillText(line,x,yy);
}

/* ---------------- screens ---------------- */
function drawTitle(){
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<50;i++){
    const x=((hash2(i,3)*VW + state.time*12*(0.4+hash2(i,9)))% (VW+40))-20;
    const y=VH-((state.time*(20+hash2(i,5)*40)+hash2(i,7)*VH)%(VH+40));
    const a=0.25+0.35*Math.sin(state.time*3+i);
    ctx.fillStyle=`rgba(255,${100+hash2(i,2)*100|0},50,${a})`;
    ctx.fillRect(x,y,2.5,2.5);
  }
  ctx.textAlign='center';
  ctx.font='bold 64px Georgia,serif';
  const grd=ctx.createLinearGradient(0,VH*0.24,0,VH*0.36);
  grd.addColorStop(0,'#ffe08a'); grd.addColorStop(1,'#e2622a');
  ctx.fillStyle=grd;
  ctx.fillText('EMBERFALL',VW/2,VH*0.34);
  ctx.font='16px system-ui'; ctx.fillStyle='#c9d1d9';
  ctx.fillText('the Ember Depths stir — 5 floors, 5 guardians, one throne',VW/2,VH*0.34+34);
  const cw=470, ch=245, cx0=(VW-cw)/2, cy0=VH*0.52;
  ctx.fillStyle='rgba(255,255,255,0.05)'; roundRect(cx0,cy0,cw,ch,12); ctx.fill();
  ctx.strokeStyle='rgba(255,215,94,0.3)'; ctx.lineWidth=1.5; roundRect(cx0,cy0,cw,ch,12); ctx.stroke();
  ctx.font='14px system-ui'; ctx.fillStyle='#e8e8f0'; ctx.textAlign='left';
  const rows=[
    ['WASD / Arrows','move'],
    ['Space / Click','attack (swing toward mouse)'],
    ['E','talk / stairs / chests / shrines / portal'],
    ['Q','drink health potion'],
    ['1–9','dialog choices · P pause · M mute'],
    ['B','collision debug overlay'],
  ];
  rows.forEach((r,i)=>{
    ctx.fillStyle='#ffd75e'; ctx.font='bold 13px system-ui';
    ctx.fillText(r[0],cx0+30,cy0+34+i*30);
    ctx.fillStyle='#c9d1d9'; ctx.font='13px system-ui';
    ctx.fillText(r[1],cx0+185,cy0+34+i*30);
  });
  const bl=0.6+0.4*Math.sin(state.time*3);
  ctx.fillStyle=`rgba(255,215,94,${bl})`; ctx.font='bold 17px system-ui'; ctx.textAlign='center';
  ctx.fillText('— Press ENTER or CLICK to begin —',VW/2,VH-30);
}
function drawDead(){
  ctx.fillStyle='rgba(20,4,4,0.72)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.font='bold 54px Georgia,serif'; ctx.fillStyle='#e05555';
  ctx.fillText('You have fallen...',VW/2,VH*0.42);
  ctx.font='15px system-ui'; ctx.fillStyle='#c9d1d9';
  ctx.fillText('You lost 20% of your gold. The village bells carry you home.',VW/2,VH*0.42+34);
  const bl=0.6+0.4*Math.sin(state.time*3);
  ctx.fillStyle=`rgba(255,215,94,${bl})`; ctx.font='bold 16px system-ui';
  ctx.fillText('— Press ENTER to rise again —',VW/2,VH*0.42+76);
}
function drawVictory(){
  ctx.fillStyle='rgba(8,10,18,0.78)'; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<70;i++){
    const x=hash2(i,1)*VW, y=VH-((state.time*35+hash2(i,2)*VH*2)%(VH+60));
    ctx.fillStyle=`rgba(255,${140+hash2(i,3)*100|0},60,${0.3+0.4*Math.sin(state.time*4+i)})`;
    ctx.fillRect(x,y,3,3);
  }
  ctx.textAlign='center';
  ctx.font='bold 48px Georgia,serif';
  const grd=ctx.createLinearGradient(0,VH*0.26,0,VH*0.36);
  grd.addColorStop(0,'#ffe08a'); grd.addColorStop(1,'#7ee787');
  ctx.fillStyle=grd;
  ctx.fillText('EMBERFALL IS SAVED',VW/2,VH*0.34);
  ctx.font='15px system-ui'; ctx.fillStyle='#e8e8f0';
  ctx.fillText('The Ember Tyrant is no more. All five guardians lie slain.',VW/2,VH*0.34+36);
  ctx.font='bold 15px system-ui'; ctx.fillStyle='#ffd75e';
  ctx.fillText('Level '+player.level+'  ·  '+player.gold+' gold  ·  '+killCount+' foes slain  ·  '+Math.floor(playTime/60)+'m '+Math.floor(playTime%60)+'s',VW/2,VH*0.34+70);
  const bl=0.6+0.4*Math.sin(state.time*3);
  ctx.fillStyle=`rgba(255,255,255,${bl})`; ctx.font='bold 15px system-ui';
  ctx.fillText('— Press ENTER to keep exploring (a purple portal leads home) —',VW/2,VH*0.34+104);
}
function drawPaused(){
  ctx.fillStyle='rgba(8,10,18,0.6)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.font='bold 40px Georgia,serif'; ctx.fillStyle='#e8e8f0';
  ctx.fillText('PAUSED',VW/2,VH/2-10);
  ctx.font='14px system-ui'; ctx.fillStyle='#c9d1d9';
  ctx.fillText('Press P to resume',VW/2,VH/2+24);
}
function drawTrans(){
  if(!state.trans) return;
  const a=clamp(state.trans.t,0,1);
  ctx.fillStyle=`rgba(5,4,8,${a})`;
  ctx.fillRect(0,0,VW,VH);
}

/* ---------------- floor cinematic (Roblox-Doors style) ---------------- */
function spacedText(txt,cx,y,size,color,weight='bold'){
  ctx.save();
  ctx.font=weight+' '+size+'px Georgia,serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(255,120,40,0.75)'; ctx.shadowBlur=18;
  ctx.fillStyle=color;
  const sp=size*0.38;
  let w=0;
  for(const ch of txt) w+=ctx.measureText(ch).width+sp;
  w-=sp;
  let x=cx-w/2;
  for(const ch of txt){ ctx.fillText(ch,x,y); x+=ctx.measureText(ch).width+sp; }
  ctx.restore();
}
function drawCine(){
  const c=state.cine; if(!c) return;
  const tt=c.t/c.dur;
  const a= tt<0.16 ? tt/0.16 : tt>0.84 ? Math.max(0,(1-tt)/0.16) : 1;
  ctx.fillStyle=`rgba(3,2,5,${0.88*a})`;
  ctx.fillRect(0,0,VW,VH);
  if(a<=0.02) return;
  ctx.save();
  ctx.globalAlpha=a;
  // drifting embers
  for(let i=0;i<26;i++){
    const x=((hash2(i,4)*VW + state.time*14*(0.35+hash2(i,8)))%(VW+30))-15;
    const y=VH-((state.time*(26+hash2(i,6)*46)+hash2(i,2)*VH)%(VH+40));
    ctx.fillStyle=`rgba(255,${120+hash2(i,5)*70|0},50,${0.18+0.22*Math.abs(Math.sin(state.time*3+i))})`;
    ctx.fillRect(x,y,2.5,2.5);
  }
  // thin frame rules
  ctx.strokeStyle='rgba(255,140,70,0.35)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(VW*0.28,VH*0.31); ctx.lineTo(VW*0.72,VH*0.31);
  ctx.moveTo(VW*0.28,VH*0.655); ctx.lineTo(VW*0.72,VH*0.655);
  ctx.stroke();
  const slide=(1-Math.min(1,tt/0.16))*26;
  spacedText(c.head,VW/2,VH*0.415+slide,46,'#ffe08a');
  if(c.title) spacedText(c.title,VW/2,VH*0.525,25,'#ff8a5e');
  if(c.sub){
    ctx.font='italic 17px Georgia,serif'; ctx.fillStyle='#c9d1d9'; ctx.textAlign='center';
    ctx.fillText('— '+c.sub+' —',VW/2,VH*0.60);
  }
  ctx.font='10px system-ui'; ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.textAlign='center';
  ctx.fillText('CLEAR EVERY FOE TO BREAK THE EMBER SEAL',VW/2,VH-46);
  ctx.restore();
}

/* ---------------- inventory overlay (I) ---------------- */
function drawInventory(){
  if(!state.inv) return;
  const p=player;
  ctx.fillStyle='rgba(4,3,8,0.72)'; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(640,VW-48), h=Math.min(400,VH-48);
  const x=(VW-w)/2, y=(VH-h)/2;
  ctx.fillStyle='rgba(14,12,19,0.97)'; roundRect(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle='rgba(255,170,80,0.5)'; ctx.lineWidth=2; roundRect(x+1,y+1,w-2,h-2,13); ctx.stroke();
  spacedText('INVENTORY',VW/2,y+50,26,'#ffe08a');
  ctx.font='11px system-ui'; ctx.fillStyle='rgba(201,209,217,0.55)'; ctx.textAlign='center';
  ctx.fillText('press I to close',VW/2,y+70);
  const colW=(w-80)/2, lx=x+40, rx=x+w/2+20;
  const head=(hx,hy,txt)=>{ ctx.fillStyle='#ff8a5e'; ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.fillText(txt,hx,hy); };
  const card=(cx,cy,cw,icon,title,value,sub,accent)=>{
    ctx.fillStyle='rgba(255,255,255,0.045)'; roundRect(cx,cy,cw,54,8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; roundRect(cx,cy,cw,54,8); ctx.stroke();
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(cx+22,cy+27,11,0,TAU); ctx.fill();
    ctx.fillStyle='#14121a'; ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.fillText(icon,cx+22,cy+31);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font='bold 9px system-ui'; ctx.fillText(title,cx+40,cy+17);
    ctx.fillStyle='#fff'; ctx.font='bold 14px system-ui'; ctx.fillText(value,cx+40,cy+34);
    ctx.fillStyle='rgba(201,209,217,0.55)'; ctx.font='10px system-ui'; ctx.fillText(sub,cx+40,cy+47);
  };
  head(lx,y+100,'EQUIPMENT');
  card(lx,y+108,colW,'⚔','SWORD',(p.dmg+p.swordBonus)+' damage','sharpened '+p.swordLvl+'×',p.weapon==='sword'?'#ffd75e':'#5a4a2e');
  card(lx,y+170,colW,'➶','BOW', p.bow?(9+p.bowLvl*5)+' damage':'not owned', p.bow?('Lv.'+p.bowLvl+' · '+p.arrows+' arrows'):'Finn sells bows — 180g', p.bow?'#9ad1ff':'#3a3a44');
  card(lx,y+232,colW,'✚','ARMOR',(p.armor*8)+'% reduction','tier '+p.armor,'#7ee787');
  card(lx,y+294,colW,'✦','LANTERN','level '+p.lightLvl,'light radius '+(150+42*p.lightLvl),'#ffe08a');

  head(rx,y+100,'SATCHEL');
  card(rx,y+108,colW,'●','GOLD',p.gold+' gold','coin purse','#ffd75e');
  card(rx,y+170,colW,'♥','POTIONS',p.potions+' potions','press Q to drink','#ff7b8f');
  card(rx,y+232,colW,'➶','ARROWS',p.arrows+' arrows',p.bow?'ready to fire':'need a bow','#d8cfa8');
  card(rx,y+294,colW,'☠','SLAIN',killCount+' foes','level '+p.level+' hero','#c46bff');
  ctx.textAlign='center'; ctx.font='11px system-ui'; ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('R swap weapon · Q potion · E interact · Space attack',VW/2,y+h-22);
}


/* ---------------- main loop ---------------- */
genSurface();
spawnNPCs();
buildMinimap();
player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
resize();

let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,0.05);
  last=now;
  update(dt);
  updateCam(dt);

  let ox=0, oy=0;
  if(state.shakeT>0){ const m=state.shakeMag*state.shakeT; ox=rnd(-m,m); oy=rnd(-m,m); }
  ctx.save();
  ctx.translate(ox,oy);

  ctx.fillStyle = state.floor===0 ? '#1a3a52' : THEMES[state.floor].bg;
  ctx.fillRect(-30,-30,VW+60,VH+60);
  drawTiles();
  for(const tr of torches){
    const sx=tr.x-cam.x, sy=tr.y-cam.y;
    if(sx>-30&&sy>-30&&sx<VW+30&&sy<VH+30) drawTorchOne(tr);
  }
  if(state.floor===0) drawFlowers();

  // depth-sorted entities
  const drawables=[];
  if(state.floor===0){
    const tx0=Math.max(0,Math.floor(cam.x/TS)-2), tx1=Math.min(mapW-1,Math.floor((cam.x+VW)/TS)+2);
    const ty0=Math.max(0,Math.floor(cam.y/TS)-2), ty1=Math.min(mapH-1,Math.floor((cam.y+VH)/TS)+2);
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
      const tr=treeGrid.get(tx+','+ty);
      if(tr) drawables.push({y:tr.y,fn:()=>drawTreeOne(tr)});
    }
    for(const rk of rocks){
      const sx=rk.x-cam.x, sy=rk.y-cam.y;
      if(sx>-40&&sy>-40&&sx<VW+40&&sy<VH+40) drawables.push({y:rk.y,fn:()=>drawRockOne(rk)});
    }
    for(const n of npcs) drawables.push({y:n.y,fn:()=>drawNPC(n)});
    if(entrance) drawables.push({y:entrance.y,fn:()=>drawPortalOne(entrance)});
  }
  for(const c of chests){
    const sx=c.x-cam.x, sy=c.y-cam.y;
    if(sx>-40&&sy>-40&&sx<VW+40&&sy<VH+40) drawables.push({y:c.y,fn:()=>drawChestOne(c)});
  }
  for(const s of shrines){
    const sx=s.x-cam.x, sy=s.y-cam.y;
    if(sx>-50&&sy>-50&&sx<VW+50&&sy<VH+50) drawables.push({y:s.y,fn:()=>drawShrineOne(s)});
  }
  if(state.portal) drawables.push({y:state.portal.y,fn:()=>drawPortalOne(state.portal)});
  for(const e of enemies){
    const sx=e.x-cam.x, sy=e.y-cam.y;
    if(sx>-60&&sy>-60&&sx<VW+60&&sy<VH+60) drawables.push({y:e.y,fn:()=>drawEnemy(e)});
  }
  if(state.boss) drawables.push({y:state.boss.y,fn:drawBoss});
  drawables.push({y:player.y,fn:drawPlayer});
  drawables.sort((a,b)=>a.y-b.y);

  drawBuildings();
  drawDrops();
  for(const d of drawables) d.fn();
  drawArrows();
  drawParticles();
  drawTexts();
  drawDarkness();
  if(state.dbg) drawDebug();
  ctx.restore();

  if(state.mode==='title') drawTitle();
  else {
    drawHUD();
    drawDialog();
    if(state.paused) drawPaused();
    if(state.mode==='dead') drawDead();
    if(state.mode==='victory') drawVictory();
  }
  drawCine();
  drawInventory();
  drawTrans();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
