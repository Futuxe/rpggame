<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emberfall — Action RPG</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0e14;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
  #game{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================
   EMBERFALL v2 — THE EMBER DEPTHS — a tiny action RPG
   Surface world + 5 dungeon floors, 5 bosses, shrine trials,
   elites, chests, torch lighting, lava.
   Everything (world, art, sound) is generated in code.
   Built from: wip/p01..p10 via wip/build.ps1
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let VW = 0, VH = 0;
function resize(){ VW = cvs.width = window.innerWidth; VH = cvs.height = window.innerHeight; lightCvs.width=VW; lightCvs.height=VH; }
window.addEventListener('resize', resize);

/* ---------------- utils ---------------- */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const rnd=(a=1,b)=> b===undefined? Math.random()*a : a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

function hash2(x,y){
  let n = Math.sin(x*127.1 + y*311.7)*43758.5453;
  return n - Math.floor(n);
}
const smooth=t=>t*t*(3-2*t);
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  const u=smooth(xf), v=smooth(yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y){ return vnoise(x,y)*0.55 + vnoise(x*2.13,y*2.13)*0.28 + vnoise(x*4.31,y*4.31)*0.17; }

/* ---------------- audio ---------------- */
let AC=null, muted=false, musicT=0;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type='square',vol=0.12,slide=0,when=0){
  const a=ac(); if(!a||muted) return;
  const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur=0.15,vol=0.15){
  const a=ac(); if(!a||muted) return;
  const len=(a.sampleRate*dur)|0, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function sfx(n){
  switch(n){
    case 'swing':  tone(320,0.08,'sawtooth',0.05,-180); break;
    case 'hit':    tone(180,0.09,'square',0.14,-90); noiseBurst(0.08,0.1); break;
    case 'hurt':   tone(140,0.2,'sawtooth',0.16,-80); break;
    case 'coin':   tone(880,0.07,'square',0.08); tone(1320,0.09,'square',0.08,0,0.06); break;
    case 'potion': tone(500,0.1,'sine',0.12,200); tone(700,0.12,'sine',0.1,200,0.08); break;
    case 'xp':     tone(1046,0.06,'triangle',0.07); break;
    case 'level':  [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.14,0,i*0.09)); break;
    case 'die':    tone(300,0.4,'sawtooth',0.15,-250); noiseBurst(0.3,0.12); break;
    case 'slam':   tone(90,0.35,'sawtooth',0.2,-40); noiseBurst(0.35,0.2); break;
    case 'arrow':  tone(700,0.06,'sawtooth',0.05,-300); break;
    case 'bow':    tone(520,0.05,'triangle',0.06,-320); noiseBurst(0.04,0.03); break;
    case 'quest':  [659,784,988].forEach((f,i)=>tone(f,0.14,'square',0.1,0,i*0.1)); break;
    case 'buy':    tone(660,0.08,'square',0.1); tone(880,0.1,'square',0.1,0,0.07); break;
    case 'chest':  tone(392,0.1,'triangle',0.1); tone(523,0.12,'triangle',0.1,0,0.09); tone(784,0.16,'triangle',0.12,0,0.18); break;
    case 'stairs': tone(300,0.3,'triangle',0.1,-150); tone(200,0.3,'triangle',0.08,-100,0.12); break;
    case 'summon': tone(340,0.28,'sawtooth',0.1,-200); noiseBurst(0.2,0.08); break;
    case 'denied': tone(160,0.15,'square',0.12,-40); break;
    case 'bossroar': tone(70,0.7,'sawtooth',0.25,30); noiseBurst(0.6,0.18); break;
    case 'shrine': tone(392,0.22,'sine',0.12,60); tone(523,0.3,'sine',0.1,80,0.1); noiseBurst(0.25,0.06); break;
    case 'reward': [784,988,1175].forEach((f,i)=>tone(f,0.15,'triangle',0.12,0,i*0.09)); break;
    case 'blink':  tone(180,0.22,'sine',0.12,520); break;
    case 'fire':   tone(300,0.12,'sawtooth',0.07,-140); noiseBurst(0.08,0.05); break;
    case 'rock':   tone(120,0.16,'square',0.12,-60); noiseBurst(0.12,0.1); break;
    case 'dash':   tone(420,0.16,'sawtooth',0.1,-280); break;
    case 'nova':   tone(140,0.5,'sawtooth',0.18,-90); noiseBurst(0.45,0.16); break;
  }
}
const SCALE=[220,261,293,329,392,440,523,587];
function musicTick(dt){
  if(!AC||muted||state.mode!=='play') return;
  musicT-=dt;
  if(musicT<=0){
    musicT=rnd(0.5,1.1);
    const n=SCALE[(Math.random()*SCALE.length)|0];
    const minor = state.floor>0;
    tone(minor? n*0.89 : n, rnd(0.5,1.2),'triangle',0.028);
    if(Math.random()<0.3) tone(minor?55:110,0.8,'sine',0.04);
  }
}

/* ---------------- world ---------------- */
const TS=32;
const T_WATER=0, T_SAND=1, T_GRASS=2, T_CORRUPT=3, T_WALL=4, T_FLOOR=5, T_LAVA=6, T_STAIRSDOWN=7, T_STAIRSUP=8, T_SECRET=9;
const SOLID = t => t===T_WATER || t===T_WALL || t===T_SECRET;
const MAXFLOOR=5;
const FLNAMES={1:'The Bone Hollows',2:'The Molten Gaol',3:'The Wailing Crypt',4:'The Ashen Deep',5:'The Ember Throne'};
const FLOORBOSS={1:'boneking',2:'cindergolem',3:'malachar',4:'pyrelord',5:'tyrant'};
let mapW=1000, mapH=1000;
let tiles=null, tileVar=null;
const VILLAGE={x:500,y:500,r:13};
const CORRUPT={x:680,y:700,r:60};
let trees=[], treeGrid=new Map(), rocks=[], flowers=[], torches=[], chests=[], buildings=[], props=[], shrines=[], lavas=[];
let entrance=null, returnPortal=null;

function tileAt(tx,ty){ return (tx<0||ty<0||tx>=mapW||ty>=mapH)?T_WALL:tiles[ty*mapW+tx]; }
function setTile(tx,ty,t){ if(tx>=0&&ty>=0&&tx<mapW&&ty<mapH) tiles[ty*mapW+tx]=t; }
function tileAtPx(x,y){ return tileAt(Math.floor(x/TS),Math.floor(y/TS)); }

/* ---------- surface generation (1000x1000) ---------- */
function genSurface(){
  mapW=1000; mapH=1000;
  tiles=new Uint8Array(mapW*mapH);
  tileVar=new Float32Array(mapW*mapH);
  trees=[]; treeGrid=new Map(); rocks=[]; flowers=[]; torches=[]; chests=[]; buildings=[]; props=[]; shrines=[]; lavas=[]; returnPortal=null;
  // coarse height field (half resolution) keeps a million-tile map fast to build
  const hw=(mapW>>1)+2, hh=(mapH>>1)+2;
  const hmap=new Float32Array(hw*hh);
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++)
    hmap[y*hw+x]=fbm(x*0.15+13.7, y*0.15+5.1);
  const hs=(x,y)=>{
    const fx=x*0.5, fy=y*0.5;
    const x0=fx|0, y0=fy|0, tx=fx-x0, ty=fy-y0;
    const a=hmap[y0*hw+x0], b=hmap[y0*hw+x0+1];
    const c=hmap[(y0+1)*hw+x0], d=hmap[(y0+1)*hw+x0+1];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const i=y*mapW+x;
    let t = hs(x,y)<0.345 ? T_WATER : T_GRASS;
    if(dist(x,y,VILLAGE.x,VILLAGE.y) < VILLAGE.r) t = T_GRASS;
    if(dist(x,y,CORRUPT.x,CORRUPT.y) < 44) t = T_GRASS;
    if(t===T_GRASS){
      const d=dist(x,y,CORRUPT.x,CORRUPT.y);
      const edge = CORRUPT.r*(0.72+0.5*vnoise(x*0.045,y*0.045));
      if(d<edge) t=T_CORRUPT;
    }
    tiles[i]=t;
    tileVar[i]=hash2(x*3.3,y*7.7);
  }
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const i=y*mapW+x;
    if(tiles[i]!==T_GRASS && tiles[i]!==T_CORRUPT) continue;
    if(tileAt(x-1,y)===T_WATER||tileAt(x+1,y)===T_WATER||tileAt(x,y-1)===T_WATER||tileAt(x,y+1)===T_WATER)
      tiles[i]=T_SAND;
  }
  const ex=CORRUPT.x, ey=CORRUPT.y;
  for(let y=1;y<mapH-1;y++)for(let x=1;x<mapW-1;x++){
    const t=tiles[y*mapW+x];
    const px=x*TS+TS/2, py=y*TS+TS/2;
    const inVillage = dist(x,y,VILLAGE.x,VILLAGE.y)<VILLAGE.r;
    const nearPortal = dist(x,y,ex,ey)<5.4;
    const n=vnoise(x*0.16+40, y*0.16+9);
    if((t===T_GRASS||t===T_CORRUPT) && !inVillage && !nearPortal){
      if(n>0.80 && hash2(x*9,y*4)<0.10 && trees.length<14000){
        const tr={x:px+rnd(-6,6), y:py+rnd(-6,6), cr:9, corrupt:t===T_CORRUPT, sway:rnd(TAU), big:hash2(x,y)>0.6};
        trees.push(tr); treeGrid.set(x+','+y,tr);
      } else if(n<0.18 && hash2(x*5,y*2)<0.02 && rocks.length<3000){
        rocks.push({x:px+rnd(-5,5), y:py+rnd(-5,5), r:rnd(5,8), corrupt:t===T_CORRUPT});
      }
    }
    if(t===T_GRASS && hash2(x*7.1,y*3.3)<0.008 && !inVillage && !nearPortal && flowers.length<7000)
      flowers.push({x:px+rnd(-12,12), y:py+rnd(-12,12), c:pick(['#f2d16b','#e26d8f','#c9e26d','#e2a23c','#b98fe2']), sway:rnd(TAU)});
  }
  // brazier torches ringing the dungeon portal
  for(const [ox,oy] of [[-2.2,-2.2],[2.2,-2.2],[-2.2,2.2],[2.2,2.2]]){
    torches.push({x:(ex+ox)*TS, y:(ey+oy)*TS, side:[0,0], fl:rnd(TAU)});
  }
  const hx=VILLAGE.x, hy=VILLAGE.y;
  buildings.push({x:(hx-4)*TS, y:(hy-5)*TS, w:3*TS, h:2.6*TS, roof:'#8a4b32', wall:'#d8c49a', door:true});
  buildings.push({x:(hx+2)*TS, y:(hy-4.6)*TS, w:2.4*TS, h:2.2*TS, roof:'#6e6a8f', wall:'#cfc4a8', door:true});
  buildings.push({x:(hx-1)*TS, y:(hy+4)*TS,  w:2.2*TS, h:2*TS,   roof:'#4e7a5c', wall:'#d3c8ab', door:true});
  props.push({type:'stall', x:(hx+4.6)*TS, y:(hy+1.5)*TS});
  buildings.push({x:(hx+4.3)*TS, y:(hy+1.2)*TS, w:1.4*TS, h:1.1*TS, roof:'#b3402f', wall:'#7a5a3a', door:false, stall:true});
  props.push({type:'well', x:(hx+0.2)*TS, y:(hy-0.4)*TS});
  buildings.push({x:(hx-0.1)*TS, y:(hy-0.7)*TS, w:1*TS, h:1*TS, roof:'#555', wall:'#888', door:false, well:true});
  // dungeon entrance in the heart of the corruption (ex/ey declared at the top
  // so the decoration pass can keep a proper portal clearing — no trees hiding
  // the way down)
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const t=tileAt(ex+dx,ey+dy);
    if(t===T_WATER||t===T_GRASS) setTile(ex+dx,ey+dy, dx===0&&dy===0?T_STAIRSDOWN:T_CORRUPT);
  }
  setTile(ex,ey,T_STAIRSDOWN);
  entrance={x:ex*TS+TS/2, y:ey*TS+TS/2};
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const t=tiles[y*mapW+x];
    if((t===T_GRASS||t===T_CORRUPT) && dist(x,y,ex,ey)<6) tiles[y*mapW+x]=T_CORRUPT;
  }
}

/* ---------- dungeon generation (rooms + corridors + arenas) ---------- */
function genDungeon(fl){
  mapW=160+fl*40; mapH=160+fl*40;
  tiles=new Uint8Array(mapW*mapH); tiles.fill(T_WALL);
  tileVar=new Float32Array(mapW*mapH);
  trees=[]; treeGrid=new Map(); rocks=[]; flowers=[]; torches=[]; chests=[]; buildings=[]; props=[]; shrines=[]; lavas=[]; entrance=null; returnPortal=null;
  const rooms=[];
  const overlap=(x,y,w,h)=>{
    for(const r of rooms)
      if(x < r.x+r.w+3 && x+w+3 > r.x && y < r.y+r.h+3 && y+h+3 > r.y) return true;
    return false;
  };
  const nRooms = 14+fl*4;
  let tries=0;
  while(rooms.length<nRooms && tries++<900){
    const w=7+((Math.random()*8)|0), h=6+((Math.random()*7)|0);
    const x=2+((Math.random()*(mapW-w-4))|0), y=2+((Math.random()*(mapH-h-4))|0);
    if(overlap(x,y,w,h)) continue;
    rooms.push({x,y,w,h,cx:(x+w/2)|0,cy:(y+h/2)|0});
  }
  const carve=(tx,ty)=>{ if(tx>0&&ty>0&&tx<mapW-1&&ty<mapH-1) setTile(tx,ty,T_FLOOR); };
  // connect rooms with wide L corridors
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    let x=a.cx, y=a.cy;
    while(x!==b.cx){ carve(x,y); carve(x,y+1); x += x<b.cx?1:-1; }
    while(y!==b.cy){ carve(x,y); carve(x+1,y); y += y<b.cy?1:-1; }
  }
  for(const r of rooms)
    for(let dy=0;dy<r.h;dy++)for(let dx=0;dx<r.w;dx++) carve(r.x+dx,r.y+dy);
  /* --- boss arena (every floor has a guardian) --- */
  const bw=fl===5?26:20, bh=fl===5?17:13;
  let bx=(mapW-bw)/2|0, by=(mapH-bh)/2|0;
  for(let t=0;t<120;t++){
    const nx=2+((Math.random()*(mapW-bw-4))|0), ny=2+((Math.random()*(mapH-bh-4))|0);
    if(!overlap(nx-2,ny-2,bw+4,bh+4)){ bx=nx; by=ny; break; }
  }
  const bossRoom={x:bx,y:by,w:bw,h:bh,cx:(bx+bw/2)|0,cy:(by+bh/2)|0};
  for(let dy=0;dy<bh;dy++)for(let dx=0;dx<bw;dx++) carve(bx+dx,by+dy);
  // magma ring around arenas on floors 2+ (corridor carves a safe entry)
  if(fl>=2){
    for(let dx=0;dx<bw;dx++){ setTile(bx+dx,by,T_LAVA); setTile(bx+dx,by+bh-1,T_LAVA); }
    for(let dy=0;dy<bh;dy++){ setTile(bx,by+dy,T_LAVA); setTile(bx+bw-1,by+dy,T_LAVA); }
  }
  // connect arena to nearest room
  let nr=rooms[0], nd=1e9;
  for(const r of rooms){
    const d=dist(r.cx,r.cy,bossRoom.cx,bossRoom.cy);
    if(d<nd){ nd=d; nr=r; }
  }
  let x=nr.cx, y=nr.cy;
  while(x!==bossRoom.cx){ carve(x,y); carve(x,y+1); x+= x<bossRoom.cx?1:-1; }
  while(y!==bossRoom.cy){ carve(x,y); carve(x+1,y); y+= y<bossRoom.cy?1:-1; }
  rooms.push(bossRoom);
  /* --- Ember Seal: every floor tile in the ring just outside the arena
         becomes wall until the floor's enemies are cleared (SkyBlock-style) --- */
  state.sealTiles=[];
  if(!(state.bossesDead&&state.bossesDead[fl])){
    for(let dy=-1;dy<=bh;dy++)for(let dx=-1;dx<=bw;dx++){
      const edge = dx<0||dy<0||dx>=bw||dy>=bh;
      if(!edge) continue;
      const tx=bx+dx, ty=by+dy;
      if(tileAt(tx,ty)===T_FLOOR){
        setTile(tx,ty,T_WALL);
        state.sealTiles.push(tx+','+ty);
      }
    }
  }
  state.sealSet=new Set(state.sealTiles);
  state.sealOpen=state.sealTiles.length===0;
  /* --- hidden vaults (Doors-style secret subrooms) ---
     A small treasure room is carved far from the map's rooms, connected by a
     corridor, and every opening is sealed with bare wall except a single
     cracked T_SECRET tile. The player must press E beside the crack to break
     in. Vault guards and the relic chest live inside. --- */
  state.dvaults=[];
  const rectClear=(x,y,w,h)=>{
    for(const r of rooms)
      if(x < r.x+r.w+4 && x+w+4 > r.x && y < r.y+r.h+4 && y+h+4 > r.y) return false;
    for(const v of state.dvaults)
      if(x < v.x+v.w+4 && x+w+4 > v.x && y < v.y+v.h+4 && y+h+4 > v.y) return false;
    return true;
  };
  const nVaults = fl>=4?2:1;
  for(let vi=0; vi<nVaults; vi++){
    const vw=9, vh=7;
    let vx=-1, vy=-1;
    for(let t=0;t<500;t++){
      const nx=4+((Math.random()*(mapW-vw-8))|0), ny=4+((Math.random()*(mapH-vh-8))|0);
      if(rectClear(nx,ny,vw,vh)){ vx=nx; vy=ny; break; }
    }
    if(vx<0) continue;
    for(let dy=0;dy<vh;dy++)for(let dx=0;dx<vw;dx++) carve(vx+dx,vy+dy);
    const cx=vx+(vw>>1), cy=vy+(vh>>1);
    let nr2=rooms[0], nd2=1e9;
    for(const r of rooms){
      if(r===bossRoom) continue;
      const d=dist(r.cx,r.cy,cx,cy);
      if(d<nd2){ nd2=d; nr2=r; }
    }
    let x2=nr2.cx, y2=nr2.cy;
    while(x2!==cx){ carve(x2,y2); carve(x2,y2+1); x2 += x2<cx?1:-1; }
    while(y2!==cy){ carve(x2,y2); carve(x2+1,y2); y2 += y2<cy?1:-1; }
    // seal all perimeter openings except one — that one becomes a secret crack
    const perim=[];
    for(let dx=-1;dx<=vw;dx++){ perim.push([vx+dx,vy-1],[vx+dx,vy+vh]); }
    for(let dy=0;dy<vh;dy++){ perim.push([vx-1,vy+dy],[vx+vw,vy+dy]); }
    let door=null, dbest=1e9;
    for(const [tx2,ty2] of perim){
      if(tileAt(tx2,ty2)===T_WALL) continue;
      const dd=dist(tx2,ty2,nr2.cx,nr2.cy);
      if(dd<dbest){ dbest=dd; door=[tx2,ty2]; }
    }
    for(const [tx2,ty2] of perim){
      if(tileAt(tx2,ty2)===T_WALL) continue;
      setTile(tx2,ty2, (door && tx2===door[0] && ty2===door[1]) ? T_SECRET : T_WALL);
    }
    if(!door) setTile(cx,vy-1,T_SECRET);
    const id='v'+fl+':'+cx+','+cy;
    state.dvaults.push({x:vx,y:vy,w:vw,h:vh,cx,cy,id,seen:false});
    if(!chests.some(c=>c.id===id))
      chests.push({x:cx*TS+TS/2, y:cy*TS+TS/2,
        opened:!!(state.openedChests&&state.openedChests.has(id)), id, vault:true});
  }
  /* --- variation + lava tile list --- */
  for(let i=0;i<tiles.length;i++) tileVar[i]=hash2(i*1.37,i*0.71);
  for(let i=0;i<tiles.length;i++)
    if(tiles[i]===T_LAVA) lavas.push({x:(i%mapW)*TS+TS/2, y:((i/mapW)|0)*TS+TS/2});
  // random lava lakes on floors 2+
  if(fl>=2){
    const cand=rooms.filter(r=>r!==bossRoom);
    for(let i=0;i<fl;i++){
      const r=pick(cand);
      const lx=r.x+2+((Math.random()*(r.w-4))|0), ly=r.y+2+((Math.random()*(r.h-4))|0);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)
        if(hash2(lx+dx*3,ly+dy*5)>0.3 && tileAt(lx+dx,ly+dy)===T_FLOOR){ setTile(lx+dx,ly+dy,T_LAVA); lavas.push({x:(lx+dx)*TS+TS/2,y:(ly+dy)*TS+TS/2}); }
    }
  }
  /* --- stairs --- */
  const start=rooms[0];
  setTile(start.cx,start.cy,T_STAIRSUP);
  state.dstart={x:start.cx*TS+TS/2+TS, y:start.cy*TS+TS/2};
  state.dbossRoom=bossRoom;
  state.drooms=rooms;
  // stairs down (not on the last floor)
  let downRoom=null;
  const others=rooms.slice(1).filter(r=>r!==bossRoom);
  if(fl<MAXFLOOR && others.length){
    downRoom=pick(others);
    setTile(downRoom.cx,downRoom.cy,T_STAIRSDOWN);
  }
  /* --- shrines (challenge trials) --- */
  const shrineRooms=others.filter(r=>r!==downRoom);
  const nShr = fl>=3?2:1;
  for(let i=0;i<nShr && shrineRooms.length;i++){
    const idx=(Math.random()*shrineRooms.length)|0;
    const r=shrineRooms.splice(idx,1)[0];
    const id=fl+':'+r.cx+','+r.cy;
    shrines.push({x:r.cx*TS+TS/2+rnd(-24,24), y:r.cy*TS+TS/2+rnd(-16,16), fl, active:false,
      done:!!(state.doneShrines&&state.doneShrines.has(id)), left:0, id});
  }
  /* --- chests --- */
  const chestRooms=others.filter(r=>r!==downRoom);
  for(let i=0;i<4+fl*2 && chestRooms.length;i++){
    const idx=(Math.random()*chestRooms.length)|0;
    const r=chestRooms.splice(idx,1)[0];
    const id=fl+':'+r.cx+','+r.cy;
    if(chests.some(c=>c.id===id)) continue;
    chests.push({x:r.cx*TS+TS/2+rnd(-22,22), y:r.cy*TS+TS/2+rnd(-14,14),
      opened:!!(state.openedChests&&state.openedChests.has(id)), id});
  }
  /* --- torches on walls that face open floor --- */
  for(let ty=1;ty<mapH-1;ty++)for(let tx=1;tx<mapW-1;tx++){
    if(tileAt(tx,ty)!==T_WALL) continue;
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      if(tileAt(tx+dx,ty+dy)===T_FLOOR && hash2(tx*1.9,ty*2.3)<0.08){
        torches.push({x:tx*TS+TS/2+dx*10, y:ty*TS+TS/2+dy*10, side:[dx,dy], fl:rnd(TAU)});
        break;
      }
    }
  }
  return {rooms, bossRoom, downRoom};
}

/* ---------- collision ---------- */
function circleFree(x,y,r,ignoreTrees){
  const minTx=Math.floor((x-r)/TS), maxTx=Math.floor((x+r)/TS);
  const minTy=Math.floor((y-r)/TS), maxTy=Math.floor((y+r)/TS);
  for(let ty=minTy;ty<=maxTy;ty++)for(let tx=minTx;tx<=maxTx;tx++){
    if(!SOLID(tileAt(tx,ty))) continue;
    const cx=clamp(x,tx*TS,(tx+1)*TS), cy=clamp(y,ty*TS,(ty+1)*TS);
    const dx=cx-x, dy=cy-y;
    if(dx*dx+dy*dy < r*r) return false;
  }
  if(!ignoreTrees){
    const gr=Math.ceil(r/TS)+1;
    const tx0=Math.floor(x/TS), ty0=Math.floor(y/TS);
    for(let dy=-gr;dy<=gr;dy++)for(let dx=-gr;dx<=gr;dx++){
      const t=treeGrid.get((tx0+dx)+','+(ty0+dy));
      if(t){ const ddx=t.x-x, ddy=t.y-y, rr=r+t.cr;
        if(ddx*ddx+ddy*ddy<rr*rr) return false; }
    }
  }
  for(const b of buildings){
    const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h);
    const dx=cx-x, dy=cy-y;
    if(dx*dx+dy*dy < r*r) return false;
  }
  for(const rk of rocks){
    const dx=rk.x-x, dy=rk.y-y, rr=r+rk.r*0.8;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  if(state.floor===0) for(const n of npcs){
    const dx=n.x-x, dy=n.y-y, rr=r+n.r*0.8;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  for(const c of chests){
    if(c.opened) continue;
    const dx=c.x-x, dy=c.y-y, rr=r+10;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  for(const s of shrines){
    const dx=s.x-x, dy=s.y-y, rr=r+10;
    if(dx*dx+dy*dy<rr*rr) return false;
  }
  return true;
}
function moveEntity(e,dx,dy){
  if(dx!==0){
    if(circleFree(e.x+dx,e.y,e.r)) e.x+=dx;
    else if(circleFree(e.x+dx*0.35,e.y,e.r)) e.x+=dx*0.35; // wall-slide assist
  }
  if(dy!==0){
    if(circleFree(e.x,e.y+dy,e.r)) e.y+=dy;
    else if(circleFree(e.x,e.y+dy*0.35,e.r)) e.y+=dy*0.35;
  }
}
/* enemies refuse to step into lava unless they fly */
function avoidLava(e,dx,dy){
  if(e.flies || tileAtPx(e.x+dx,e.y+dy)!==T_LAVA){ moveEntity(e,dx,dy); return; }
  if(dx!==0 && tileAtPx(e.x+dx,e.y)!==T_LAVA) moveEntity(e,dx,0);
  else if(dy!==0 && tileAtPx(e.x,e.y+dy)!==T_LAVA) moveEntity(e,0,dy);
}
function findFreeSpot(x,y,r=12){
  if(circleFree(x,y,r)) return {x,y};
  for(let d=1;d<40;d++){
    for(let i=0;i<8;i++){
      const a=i/8*TAU;
      const nx=x+Math.cos(a)*d*10, ny=y+Math.sin(a)*d*10;
      if(circleFree(nx,ny,r)) return {x:nx,y:ny};
    }
  }
  return {x,y};
}

function makeEnemy(type,x,y,o={}){

    flies:!!d.flies,kbr:d.kbr||0,shoots:!!d.shoots,casts:!!d.casts,
    minion:!!o.minion,necroMinion:false,shrineRef:o.shrineRef||null,
    vaultGuard:!!o.vaultGuard,elite,

function spawnEnemySurface(){
  if(state.mode!=='play') return;
  const cap = Math.min(40, 22+player.level*2);
  if(enemies.length>=cap) return;
  const ang=rnd(TAU), d=rnd(560,980);
  let x=player.x+Math.cos(ang)*d, y=player.y+Math.sin(ang)*d;
  const tx=Math.floor(x/TS), ty=Math.floor(y/TS);
  if(!circleFree(x,y,12)) return;
  if(dist(tx,ty,VILLAGE.x,VILLAGE.y) < VILLAGE.r+3) return;
  const dv=dist(tx,ty,VILLAGE.x,VILLAGE.y);
  const inCorrupt = tileAt(tx,ty)===T_CORRUPT;
  let type;
  if(inCorrupt) type = Math.random()<0.65 ? 'wraith' : 'skeleton';
  else if(dv>30) type = Math.random()<0.55 ? 'skeleton' : 'slime';
  else type='slime';
  makeEnemy(type,x,y);
}
function spawnEnemyFloor(){
  const fl=state.floor, cap=18+fl*5;
  if(enemies.length>=cap || !state.drooms) return;
  const pool=state.drooms.filter(r=>r!==state.dbossRoom || state.bossesDead[fl]);
  if(!pool.length) return;
  const r=pick(pool);
  const x=(r.x+1+Math.random()*(r.w-2))*TS, y=(r.y+1+Math.random()*(r.h-2))*TS;
  const s=findFreeSpot(x,y,12);
  if(dist(s.x,s.y,player.x,player.y)<460) return;
  makeEnemy(pick(SPAWNS[fl]),s.x,s.y);

function populateFloor(){
  enemies=[]; arrows=[]; drops=[];
  const fl=state.floor;
  if(fl===0) return;
  const pool=(state.drooms||[]).filter(r=>r!==state.dbossRoom);
  if(!pool.length) return;
  for(let i=0;i<12+fl*5;i++){
    const r=pick(pool);
    const x=(r.x+1+Math.random()*(r.w-2))*TS, y=(r.y+1+Math.random()*(r.h-2))*TS;
    const s=findFreeSpot(x,y,12);
    if(dist(s.x,s.y,player.x,player.y)<380) continue;
    makeEnemy(pick(SPAWNS[fl]),s.x,s.y);
  }
  // hidden-vault guardians (optional content — they never block the Ember Seal)
  for(const v of (state.dvaults||[])){
    for(let i=0;i<2+(fl>>1);i++){
      const s=findFreeSpot((v.x+1.5+Math.random()*(v.w-3))*TS,
                           (v.y+1.5+Math.random()*(v.h-3))*TS, 12);
      makeEnemy(pick(SPAWNS[fl]),s.x,s.y,{elite:true,vaultGuard:true});
    }
  }
}

/* ---------------- combat ---------------- */
function damageEnemy(e,dmg,kx,ky){
  e.hp-=dmg; e.flash=0.15;
  const kf=1-(e.kbr||0);
  e.kb.x+=kx*kf; e.kb.y+=ky*kf;
  addText(e.x+rnd(-8,8), e.y-e.r-6, Math.round(dmg), '#ffd75e');
  burst(e.x,e.y,'#ff7b54',6,110,0.35,2.5);
  sfx('hit');
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  const idx=enemies.indexOf(e); if(idx<0) return;
  enemies.splice(idx,1);
  burst(e.x,e.y, e.type==='slime'?'#5fce62': e.type==='skeleton'?'#e8e8e8': e.type==='bat'?'#8a6ea0':'#b06ce2', 14,140,0.6,3.5);
  sfx('die');
  gainXp(e.xp);
  killCount++;
  if(e.shrineRef){
    e.shrineRef.left--;
    if(e.shrineRef.left<=0 && e.shrineRef.active){
      e.shrineRef.active=false; e.shrineRef.done=true;
      state.doneShrines.add(e.shrineRef.id);
      sfx('reward');
      addText(e.shrineRef.x,e.shrineRef.y-30,'Shrine cleared — take its blessing!','#7ee787',2.4,true);
      burst(e.shrineRef.x,e.shrineRef.y,'#7ee787',30,180,0.9,4);
      for(let i=0;i<8;i++) drops.push({type:'coin',x:e.shrineRef.x+rnd(-26,26),y:e.shrineRef.y+rnd(-26,26),val:Math.ceil(rnd(4,9)),t:rnd(TAU),vx:rnd(-70,70),vy:rnd(-70,70)});
      for(let i=0;i<2;i++) drops.push({type:'potion',x:e.shrineRef.x+rnd(-20,20),y:e.shrineRef.y+rnd(-20,20),t:rnd(TAU),vx:0,vy:0});
      for(let i=0;i<2;i++) drops.push({type:'gem',x:e.shrineRef.x+rnd(-16,16),y:e.shrineRef.y+rnd(-16,16),val:Math.ceil(rnd(25,60)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
    }
  }
  if(state.quest.id==='q1' && state.quest.state==='active' && e.type==='slime'){
    state.quest.prog++;
    if(state.quest.prog>=8){ state.quest.state='ready';
      addText(player.x,player.y-30,'Quest ready! Return to Elder Maren','#7ee787',2,true); sfx('quest'); }
  }
  const ncoins=1+((Math.random()*3)|0);
  for(let i=0;i<ncoins;i++) drops.push({type:'coin',x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),val:Math.ceil(rnd(1,5)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
  if(Math.random()<0.12 || e.elite) drops.push({type:'potion',x:e.x,y:e.y,t:rnd(TAU),vx:0,vy:0});
  if(Math.random()<0.28 || e.elite) drops.push({type:'gem',x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),val:Math.ceil(e.xp*0.4),t:rnd(TAU),vx:rnd(-30,30),vy:rnd(-30,30)});
}
function gainXp(v){
  player.xp+=v;
  addText(player.x+rnd(-6,6),player.y-24,'+'+v+' xp','#9ad1ff',0.8);
  let need=xpNeed();
  while(player.xp>=need){
    player.xp-=need; player.level++;
    player.maxHp+=20; player.hp=Math.min(player.maxHp,player.hp+player.maxHp*0.5);
    player.dmg+=3;
    need=xpNeed();
    addText(player.x,player.y-40,'LEVEL UP!  Lv.'+player.level,'#ffd75e',1.6,true);
    burst(player.x,player.y,'#ffd75e',22,170,0.8,4);
    sfx('level');
  }
}
function hurtPlayer(dmg,fromX,fromY){
  if(player.invulnT>0 || state.mode!=='play') return;
  const red=1-Math.min(0.5,player.armor*0.08);
  const d=Math.max(1,Math.round(dmg*red));
  player.hp-=d; player.invulnT=0.7; player.hurtFlash=0.3;
  player.hurtT=0; player.regenAcc=0;
  addText(player.x,player.y-26,'-'+d,'#ff6b6b');
  const a=Math.atan2(player.y-fromY,player.x-fromX);
  moveEntity(player,Math.cos(a)*14,Math.sin(a)*14);
  shake(0.25,5); sfx('hurt');
  if(player.hp<=0){
    player.hp=0; state.mode='dead'; sfx('die');
    burst(player.x,player.y,'#ff6b6b',24,160,0.9,4);
  }
}
function doAttack(dirAng){
  if(player.weapon==='bow'){ if(player.atkCd>0) return; shootBow(dirAng); return; }
  if(player.atkCd>0) return;
  player.atkCd=0.38; player.swingT=0.18; player.swingDir=dirAng;
  player.face.x=Math.cos(dirAng); player.face.y=Math.sin(dirAng);
  sfx('swing');
  const range=48, dmg=player.dmg+player.swordBonus;
  for(const e of [...enemies, ...(state.boss?[state.boss]:[])]){
    const d=dist(player.x,player.y,e.x,e.y);
    if(d>range+e.r) continue;
    const a=Math.atan2(e.y-player.y,e.x-player.x);
    let diff=Math.abs(((a-dirAng)%TAU+TAU+Math.PI)%TAU-Math.PI);
    if(diff<1.25){
      const kx=Math.cos(a)*180, ky=Math.sin(a)*180;
      if(e===state.boss) damageBoss(dmg,kx,ky); else damageEnemy(e,dmg,kx,ky);
    }
  }
}
function shootBow(dirAng){
  if(player.arrows<=0){ addText(player.x,player.y-26,'No arrows!','#ff9a9a'); sfx('denied'); return; }
  player.arrows--;
  player.atkCd=0.42; player.swingT=0.12; player.swingDir=dirAng;
  player.face.x=Math.cos(dirAng); player.face.y=Math.sin(dirAng);
  const dmg=9+player.bowLvl*5;
  arrows.push({x:player.x+Math.cos(dirAng)*14, y:player.y+Math.sin(dirAng)*14,
    vx:Math.cos(dirAng)*470, vy:Math.sin(dirAng)*470, life:1.2, dmg, kind:'player', friendly:true});
  sfx('bow');
}

    flash:0,phase:rnd(TAU),enraged:false,kb:{x:0,y:0}};
  sfx('bossroar'); shake(0.6,8);
  addText(x,y-70,d.name+' AWAKENS','#ff6a3d',2.4,true);
}
function damageBoss(dmg,kx,ky){
  const b=state.boss; if(!b) return;
  b.hp-=dmg; b.flash=0.15;
  b.kb.x+=kx*0.22; b.kb.y+=ky*0.22;
  addText(b.x+rnd(-10,10),b.y-b.r-10,Math.round(dmg),'#ffd75e');
  burst(b.x,b.y,'#ff9a3d',8,130,0.4,3);
  sfx('hit');
  if(b.hp<=0) defeatBoss();
}
function defeatBoss(){
  const b=state.boss, kind=b.kind;
  burst(b.x,b.y,'#ff6a3d',60,260,1.4,5);
  burst(b.x,b.y,'#ffd75e',40,200,1.2,4);
  shake(0.8,12); sfx('slam'); sfx('level');
  addText(b.x,b.y-40,BDEF[kind].name+' FALLS!','#ffd75e',3,true);
  gainXp(b.xp); killCount++;
  for(let i=0;i<12;i++) drops.push({type:'coin',x:b.x+rnd(-30,30),y:b.y+rnd(-30,30),val:Math.ceil(rnd(6,18)),t:rnd(TAU),vx:rnd(-80,80),vy:rnd(-80,80)});
  for(let i=0;i<2;i++) drops.push({type:'potion',x:b.x+rnd(-20,20),y:b.y+rnd(-20,20),t:rnd(TAU),vx:0,vy:0});
  for(let i=0;i<3;i++) drops.push({type:'gem',x:b.x+rnd(-24,24),y:b.y+rnd(-24,24),val:Math.ceil(rnd(60,140)),t:rnd(TAU),vx:rnd(-60,60),vy:rnd(-60,60)});
  state.boss=null;
  state.bossesDead[state.floor]=true;
  bossReward(kind);
}
function bossReward(kind){
  const f=state.flags;
  if(kind==='warden'){
    f.warden=true; player.maxHp+=20; player.hp+=20;
    addText(player.x,player.y-30,"+20 max HP — the Warden's Seal breaks",'#ff8a5e',3,true);
    addText(entrance.x,entrance.y-72,'THE EMBER DEPTHS ARE OPEN','#c46bff',3.5,true);
    readyIf('q2');
  } else if(kind==='boneking'){
    player.maxHp+=15; player.hp+=15;
    addText(player.x,player.y-30,'+15 max HP — Bone Charm','#7ee787',2.5,true);
    readyIf('q3');
  } else if(kind==='cindergolem'){
    f.golem=true; player.armor+=1;
    addText(player.x,player.y-30,'+1 Armor — Cinder Plate','#9ad1ff',2.5,true);
    readyIf('q4');
  } else if(kind==='malachar'){
    f.malachar=true; player.dmg+=3;
    addText(player.x,player.y-30,'+3 damage — Hexed Sigil','#c58fff',2.5,true);
    readyIf('q4');
  } else if(kind==='pyrelord'){
    player.speed+=12;
    addText(player.x,player.y-30,'+12 speed — Ash Striders','#ffb36b',2.5,true);
    readyIf('q5');
  } else if(kind==='tyrant'){
    state.portal={x:state.dbossRoom.cx*TS+TS/2, y:state.dbossRoom.cy*TS+TS/2};
    state.won=true;
    readyIf('q6');
    sfx('quest');
    state.mode='victory';
  }
}
function updateBoss(b,dt){
  const d=BDEF[b.kind], p=player;
  b.flash-=dt; b.phase+=dt*4; b.atkCd-=dt;
  for(const k in b.cd) b.cd[k]-=dt;
  const kdec=Math.pow(0.02,dt);
  moveEntity(b,b.kb.x*dt,b.kb.y*dt); // knockback respects walls (no clipping)
  b.kb.x*=kdec; b.kb.y*=kdec;
  if(!b.enraged && b.hp<=b.maxHp*d.enrage){
    b.enraged=true; b.spd*=1.35; sfx('bossroar'); shake(0.5,7);
    addText(b.x,b.y-70,d.name+' is ENRAGED!','#ff4b2e',2,true);
    if(b.kind==='tyrant') for(let i=0;i<2;i++){
      const s=findFreeSpot(b.x+rnd(-60,60),b.y+rnd(-60,60),11);
      makeEnemy('dslime',s.x,s.y,{minion:true});
    }
  }
  const dp=dist(b.x,b.y,p.x,p.y), ang=Math.atan2(p.y-b.y,p.x-b.x);
  if(b.telegraph>0){
    b.telegraph-=dt;
    if(b.telegraph<=0){
      shake(0.5,10); sfx('slam'); burst(b.x,b.y,'#ff6a3d',30,220,0.8,4);
      if(dp<b.telegraphR) hurtPlayer(b.dmg*1.45,b.x,b.y);
      if(b.kind==='cindergolem') for(let i=0;i<8;i++) eBolt(b.x,b.y,i/8*TAU,210,b.dmg*0.8,'fire',0.75);
      if(b.kind==='tyrant') for(let i=0;i<6;i++) eBolt(b.x,b.y,i/6*TAU+rnd(0.3),190,b.dmg*0.7,'fire',0.85);
      b.cd.slam=b.enraged?2.4:3.6;
    }
  }
  const chase=()=>{ if(dp<560) moveEntity(b,Math.cos(ang)*b.spd*dt,Math.sin(ang)*b.spd*dt); };
  switch(b.kind){
    case 'warden':
      if(b.cd.slam<=0 && dp<280){ b.cd.slam=99; b.telegraph=0.85; b.telegraphR=145; addText(b.x,b.y-50,'!','#c46bff',0.9,true); }
      if(b.cd.volley<=0 && dp<440){
        b.cd.volley=b.enraged?2.4:3.4;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.28,245,b.dmg*0.7,'void',1.8);
        sfx('fire');
      }
      chase();
      break;
    case 'boneking':
      chase();
      if(b.cd.volley<=0 && dp<460){
        b.cd.volley=b.enraged?2.2:2.9;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.24,250,b.dmg*0.7,'bone',2.2);
        sfx('arrow');
      }
      if(b.cd.summon<=0){
        b.cd.summon=7;
        if(enemies.filter(x=>x.minion).length<3){
          for(let i=0;i<2;i++){
            const s=findFreeSpot(b.x+rnd(-50,50),b.y+rnd(-50,50),11);
            makeEnemy('skeleton',s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#e8e2d0',12,90,0.5,3);
        }
      }
      break;
    case 'cindergolem':
      if(b.cd.slam<=0 && dp<300){ b.cd.slam=99; b.telegraph=0.95; b.telegraphR=150; addText(b.x,b.y-50,'!','#ff4b2e',0.9,true); }
      if(b.cd.rock<=0 && dp<520){ b.cd.rock=b.enraged?2.6:3.8; eBolt(b.x,b.y,ang,175,b.dmg*1.15,'rock',2.6); sfx('rock'); }
      chase();
      break;
    case 'malachar':
      if(dp<150) moveEntity(b,-Math.cos(ang)*b.spd*dt,-Math.sin(ang)*b.spd*dt);
      else if(dp>270) moveEntity(b,Math.cos(ang)*b.spd*dt,Math.sin(ang)*b.spd*dt);
      else { const s=Math.sin(b.phase*0.5); moveEntity(b,Math.cos(ang+Math.PI/2)*b.spd*0.6*s*dt,Math.sin(ang+Math.PI/2)*b.spd*0.6*s*dt); }
      if(b.cd.volley<=0 && dp<480){
        b.cd.volley=b.enraged?1.9:2.6;
        const n=b.enraged?5:3;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,ang+(i-(n-1)/2)*0.22,255,b.dmg*0.75,'void',2);
        sfx('fire');
      }
      if(b.cd.blink<=0 && dp>90){
        b.cd.blink=7.5;
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
        const ba=rnd(TAU), r=rnd(190,260);
        const s=findFreeSpot(p.x+Math.cos(ba)*r,p.y+Math.sin(ba)*r,b.r);
        b.x=s.x; b.y=s.y; sfx('blink');
        burst(b.x,b.y,'#c46bff',16,120,0.5,3);
      }
      if(b.cd.summon<=0){
        b.cd.summon=8.5;
        if(enemies.filter(x=>x.minion).length<3){
          const n=b.enraged?3:2;
          for(let i=0;i<n;i++){
            const s=findFreeSpot(b.x+rnd(-50,50),b.y+rnd(-50,50),12);
            makeEnemy(pick(['skeleton','wraith']),s.x,s.y,{minion:true});
          }
          sfx('summon'); burst(b.x,b.y,'#c46bff',12,90,0.5,3);
        }
      }
      break;
    case 'pyrelord':
      if(b.dashT>0){
        b.dashT-=dt;
        moveEntity(b,Math.cos(b.dashA)*460*dt,Math.sin(b.dashA)*460*dt);
        burst(b.x,b.y,'#ff8a3d',3,60,0.4,3);
        if(dp<b.r+p.r+6 && b.atkCd<=0){ b.atkCd=0.9; hurtPlayer(b.dmg*1.3,b.x,b.y); }
      } else if(b.telegraph>0){
        b.telegraph-=dt;
        if(b.telegraph<=0){ b.dashT=0.38; b.dashA=b.teleA; sfx('dash'); }
      } else {
        chase();
        if(b.cd.dash<=0 && dp<420){ b.cd.dash=b.enraged?3.4:5; b.telegraph=0.7; b.teleA=ang; addText(b.x,b.y-46,'!','#ff4b2e',0.8,true); }
        if(b.cd.rain<=0 && dp<520){
          b.cd.rain=b.enraged?4:5.5;
          for(let i=0;i<8;i++){
            const aa=rnd(TAU), rr=rnd(60,240);
            const sx=p.x+Math.cos(aa)*rr, sy=p.y+Math.sin(aa)*rr;
            eBolt(sx,sy,ang,230,b.dmg*0.65,'fire',1.5);
          }
          sfx('fire');
        }
        if(b.enraged && b.cd.nova<=0){
          b.cd.nova=7; sfx('nova');
          for(let i=0;i<16;i++) eBolt(b.x,b.y,i/16*TAU,180,b.dmg*0.75,'fire',1.4);
        }
      }
      break;
    case 'tyrant':
      if(b.cd.slam<=0 && dp<330){ b.cd.slam=99; b.telegraph=0.9; b.telegraphR=160; addText(b.x,b.y-50,'!','#ff4b2e',0.9,true); }
      if(b.cd.volley<=0 && dp<520){
        b.cd.volley=b.enraged?4.2:5.5;
        const n=b.enraged?12:8;
        for(let i=0;i<n;i++) eBolt(b.x,b.y,i/n*TAU+rnd(0.2),175,b.dmg*0.7,'fire',1.3);
        sfx('fire');
      }
      chase();
      break;
  }
  if(dp<b.r+p.r+4 && b.atkCd<=0){ b.atkCd=1.1; hurtPlayer(b.dmg,b.x,b.y); }
}

/* ---------------- potions ---------------- */
function drinkPotion(){
  if(state.mode!=='play') return;
  if(player.potions<=0){ addText(player.x,player.y-26,'No potions!','#ff9a9a'); sfx('denied'); return; }
  if(player.hp>=player.maxHp){ addText(player.x,player.y-26,'Already at full health','#c9d1d9'); return; }
  player.potions--; player.hp=Math.min(player.maxHp,player.hp+60);
  addText(player.x,player.y-26,'+60 HP','#7ee787'); sfx('potion');
  burst(player.x,player.y,'#7ee787',10,90,0.6,3);
}

/* ---------------- NPCs / dialog ---------------- */
function nearNPC(){
  for(const n of npcs) if(dist(n.x,n.y,player.x,player.y)<44) return n;
  return null;
}
function openDialog(name,lines,options){
  state.dialog={name,lines,page:0,options:options||null};
}
const QUEST_CLAIM={
  q1(){ player.gold+=100; player.potions+=2; return '+100 gold, +2 potions. The Depths await...'; },
  q2(){ player.gold+=150; player.potions+=1; return '+150 gold, +1 potion. The Depths yawn open below.'; },
  q3(){ player.gold+=200; player.armor+=1; return '+200 gold, +1 armor. The fires below grow hotter.'; },
  q4(){ player.gold+=250; player.potions+=2; return '+250 gold, +2 potions. Ash storms brew on Floor 4.'; },
  q5(){ player.gold+=150; return '+150 gold. Only one tyrant remains...'; },
  q6(){ player.gold+=400; player.swordBonus+=10; return '+400 gold, the EMBER BLADE is yours! (+10 dmg)'; },
};
function elderDialog(){
  const q=state.quest;
  if(q.state==='none'){
    openDialog('Elder Maren',[
      'The fires of Emberfall grow cold, traveler...',
      'Slimes crawl from the marshes and haunt our fields.',
      'Slay 8 slimes and I will reward you from the village coffers.',
    ],[
      {label:'Accept quest',act(){ q.state='active'; q.prog=0; sfx('quest');
        addText(player.x,player.y-30,'Quest: Slimy Situation (0/8)','#7ee787',2,true); state.dialog=null; }},
      {label:'Not now',act(){ state.dialog=null; }},
    ]);
    return;
  }
  if(q.state==='active'){
    if(questDone(q.id)){ q.state='ready'; }
    else {
      const msgs={
        q1:'The slimes still crawl... ('+q.prog+' / 8 slain)',
        q2:'Moul, the Corrupted Warden, prowls the wastes around the stairway. Slay it to break the seal.',
        q3:'The Bone King rules the first floor of the Depths.',
        q4:'Two fires remain: the Cinder Golem (F2) and Malachar (F3).',
        q5:'Pyrelord Vex storms the Ashen Deep (F4).',
        q6:'The EMBER TYRANT sits on its throne (F5). End this.',
      };
      openDialog('Elder Maren',[msgs[q.id],'Come back when it is done.']);
      return;
    }
  }
  if(q.state==='ready'){
    const reward=QUEST_CLAIM[q.id]();
    sfx('quest');
    const next=QUEST_ORDER[(QUEST_ORDER.indexOf(q.id)+1)];
    if(q.id==='q6'){
      q.state='done';
      addText(player.x,player.y-34,'EMBERFALL IS SAVED!','#ffd75e',3.5,true);
      openDialog('Elder Maren',[
        'You... you truly did it. The Tyrant is no more!',
        'The hearth-fires burn bright once again.',
        'Emberfall is saved. You are a legend, traveler.',
      ],[{label:'Claim final reward',act(){
        addText(player.x,player.y-30,reward,'#ffd75e',3,true);
        state.dialog=null;
      }}]);
      return;
    }
    q.id=next; q.state='active'; q.prog=0;
    addText(player.x,player.y-30,'Quest: '+QUESTS[next].title,'#7ee787',2.5,true);
    addText(player.x,player.y-56,reward,'#ffd75e',2.5,true);
    openDialog('Elder Maren',[
      reward,
      'New task: '+QUESTS[next].goal,
    ],[{label:'Onward',act(){ state.dialog=null; }}]);
    return;
  }
  openDialog('Elder Maren',['The hearth burns warm again, thanks to you.','Rest, hero of Emberfall — or delve once more.']);
}

  const armorPrice=150*Math.pow(2,player.armorLvl);
  const lanternPrice=80*Math.pow(2,player.lightLvl);

    {label:'Buy Health Potion — 25g',act(){
      if(player.gold>=25){ player.gold-=25; player.potions++; sfx('buy'); addText(player.x,player.y-26,'+1 potion','#ff7b8f'); }
      else { sfx('denied'); addText(player.x,player.y-26,'Not enough gold!','#ff9a9a'); }

    {label:'Sharpen Blade +8 dmg — '+swordPrice+'g',act(){

    {label:'Reinforce Armor — '+armorPrice+'g',act(){

        addText(player.x,player.y-26,'Armor reinforced!','#9ad1ff'); }
      else { sfx('denied'); addText(player.x,player.y-26,'Not enough gold!','#ff9a9a'); }
      merchantDialog(); }},
    {label:'Lantern Upgrade — '+lanternPrice+'g'+(player.lightLvl>=3?' (MAX)':''),act(){
      if(player.lightLvl>=3){ sfx('denied'); addText(player.x,player.y-26,'Lantern already burning bright!','#c9d1d9'); }
      else if(player.gold>=lanternPrice){ player.gold-=lanternPrice; player.lightLvl++; sfx('buy');
        addText(player.x,player.y-26,'Lantern upgraded! You see further in the dark.','#ffe08a'); }
      else { sfx('denied'); addText(player.x,player.y-26,'Not enough gold!','#ff9a9a'); }

    {label:player.bow?'Reinforce Bow +5 dmg — '+bowPrice+'g':'Buy Bow + 15 arrows — 180g',act(){
      if(!player.bow){
        if(player.gold>=180){ player.gold-=180; player.bow=true; player.bowLvl=1; player.arrows+=15;
          player.weapon='bow'; sfx('buy'); addText(player.x,player.y-26,'Bow acquired! Press R to swap','#ffe08a',2.4,true); }

      } else if(player.gold>=bowPrice){ player.gold-=bowPrice; player.bowLvl++; sfx('buy');

      merchantDialog(); }},
    {label:'Arrows x20 — 30g',act(){
      if(player.gold>=30){ player.gold-=30; player.arrows+=20; sfx('buy');
        addText(player.x,player.y-26,'+20 arrows','#e8e2d0'); }
      else { sfx('denied'); addText(player.x,player.y-26,'Not enough gold!','#ff9a9a'); }
      merchantDialog(); }},
    {label:'Leave',act(){ state.dialog=null; }},
  ]);
}

/* ---------------- interactions & floor transitions ---------------- */
function startTransition(cb){ state.trans={t:0,phase:'out',cb}; }
function toSurface(reason){
  state.floor=0; genSurface(); spawnNPCs(); buildMinimap();
  enemies=[]; arrows=[]; drops=[];
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  player.x=findFreeSpot(player.x,player.y,player.r).x;
  state.boss=null; state.portal=null;
  addText(player.x,player.y-40,reason,'#c9d1d9',2.5,true);
}
function descend(){
  if(state.floor>=MAXFLOOR) return;
  if(state.floor===0 && !state.flags.warden){
    sfx('denied'); shake(0.3,4);
    addText(player.x,player.y-40,'A corrupted seal bars the stairway...','#c46bff',2.8,true);
    addText(player.x,player.y-64,'Slay MOUL, the WARDEN that stalks these wastes!','#ff8a5e',2.8,true);
    return;
  }
  sfx('stairs');
  state.flags.descended=true;
  startTransition(()=>{
    state.floor++;
    state.boss=null;
    genDungeon(state.floor);
    player.x=state.dstart.x; player.y=state.dstart.y;
    populateFloor(); buildMinimap();
    cam.x=player.x-VW/2; cam.y=player.y-VH/2;
    sfx('quest');
    state.cine={t:0,dur:2.9,head:'EMBERFALL DUNGEONS',title:'FLOOR '+state.floor,sub:FLNAMES[state.floor]};
    addText(player.x,player.y-46,'Floor '+state.floor+' — '+FLNAMES[state.floor],'#ff8a5e',3,true);
    if(state.bossesDead[state.floor])
      addText(player.x,player.y-70,'Its guardian already lies slain.','#c9d1d9',2.5,true);
  });
}
function ascend(){
  if(state.floor<=0) return;
  sfx('stairs');
  startTransition(()=>{
    if(state.floor===1){
      state.boss=null;
      toSurface('You climb back to Emberfall — Surface');
      state.cine={t:0,dur:2.4,head:'EMBERFALL',title:'THE SURFACE',sub:'Emberfall Village'};
    }
    else {
      state.floor--;
      state.boss=null;
      genDungeon(state.floor);
      player.x=state.dstart.x; player.y=state.dstart.y;
      populateFloor(); buildMinimap();
      cam.x=player.x-VW/2; cam.y=player.y-VH/2;
      state.cine={t:0,dur:2.4,head:'EMBERFALL DUNGEONS',title:'FLOOR '+state.floor,sub:FLNAMES[state.floor]};
      addText(player.x,player.y-46,'Floor '+state.floor+' — '+FLNAMES[state.floor],'#ff8a5e',2.5,true);
    }
  });
}
function openChest(c){
  c.opened=true; state.openedChests.add(c.id);
  sfx('chest');
  burst(c.x,c.y,'#ffd75e',20,150,0.8,3.5);
  const n=4+((Math.random()*4)|0);
  for(let i=0;i<n;i++) drops.push({type:'coin',x:c.x+rnd(-14,14),y:c.y+rnd(-14,14),val:Math.ceil(rnd(2,6)),t:rnd(TAU),vx:rnd(-60,60),vy:rnd(-60,60)});
  if(Math.random()<0.4) drops.push({type:'potion',x:c.x,y:c.y-6,t:rnd(TAU),vx:0,vy:0});
  if(Math.random()<0.35) for(let i=0;i<2;i++) drops.push({type:'gem',x:c.x+rnd(-10,10),y:c.y+rnd(-10,10),val:Math.ceil(rnd(20,50)),t:rnd(TAU),vx:rnd(-40,40),vy:rnd(-40,40)});
  if(Math.random()<0.35) drops.push({type:'arrows',x:c.x+rnd(-10,10),y:c.y+rnd(-10,10),val:5+((Math.random()*6)|0),t:rnd(TAU),vx:rnd(-30,30),vy:rnd(-30,30)});
  if(c.vault){
    addText(c.x,c.y-30,'RELIC VAULT LOOT!','#ffd75e',2.8,true);
    sfx('reward');
    for(let i=0;i<6;i++) drops.push({type:'gem',x:c.x+rnd(-18,18),y:c.y+rnd(-18,18),val:Math.ceil(rnd(60,130)),t:rnd(TAU),vx:rnd(-50,50),vy:rnd(-50,50)});
    for(let i=0;i<2;i++) drops.push({type:'potion',x:c.x+rnd(-16,16),y:c.y+rnd(-16,16),t:rnd(TAU),vx:0,vy:0});
    drops.push({type:'arrows',x:c.x,y:c.y-8,val:14,t:rnd(TAU),vx:0,vy:0});
    burst(c.x,c.y,'#c46bff',34,190,1,4);
  }
}
function activateShrine(s){
  s.active=true;
  s.left=3+2*s.fl;
  sfx('shrine');
  addText(s.x,s.y-40,'The shrine awakens! Slay the guardians ('+s.left+')','#ffd75e',2.6,true);
  burst(s.x,s.y,'#ffd75e',24,160,0.9,3.5);
  for(let i=0;i<s.left;i++){
    const a=rnd(TAU), r=rnd(110,240);
    const spot=findFreeSpot(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r,12);
    makeEnemy(pick(SPAWNS[s.fl]),spot.x,spot.y,{shrineRef:s,elite:false,minion:false});
  }
}
function usePortal(){
  sfx('stairs');
  startTransition(()=>{ toSurface('The portal carries you home...'); });
}
function interact(){
  const n=nearNPC();
  if(n){
    if(n.kind==='elder') elderDialog();
    else if(n.kind==='merchant') merchantDialog();
    else openDialog('Little Osk',[
      'I saw a BIG red monster in the south-east wastes...',
      'Papa says the stairway it guards goes DOWN, like, five floors deep!',
      'And there are glowing shrines down there — Papa says never press E on them.',
      'Be careful, mister!',
    ]);
    return;
  }
  const ptx=Math.floor(player.x/TS), pty=Math.floor(player.y/TS);
  let sd=null;
  for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){
    const t=tileAt(ptx+dx,pty+dy);
    if(t===T_STAIRSDOWN) sd='down';
    else if(t===T_STAIRSUP) sd='up';
  }
  if(sd==='down' && state.floor<MAXFLOOR){ descend(); return; }
  if(sd==='up' && state.floor>0){ ascend(); return; }
  // cracked secret walls: press E beside one to break into a hidden vault
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if((dx||dy) && tileAt(ptx+dx,pty+dy)===T_SECRET){
      setTile(ptx+dx,pty+dy,T_FLOOR);
      const wx=(ptx+dx)*TS+TS/2, wy=(pty+dy)*TS+TS/2;
      sfx('slam'); shake(0.4,6);
      burst(wx,wy,'#c46bff',28,160,0.9,3.5);
      addText(player.x,player.y-50,'A secret passage opens...','#c46bff',2.8,true);
      buildMinimap();
      return;
    }
  }
  for(const c of chests)
    if(!c.opened && dist(c.x,c.y,player.x,player.y)<38){ openChest(c); return; }
  for(const s of shrines)
    if(!s.active && !s.done && dist(s.x,s.y,player.x,player.y)<46){ activateShrine(s); return; }
  if(state.portal && dist(state.portal.x,state.portal.y,player.x,player.y)<52){ usePortal(); return; }
}

/* ---------------- input ---------------- */
const keys={};
let mouse={x:0,y:0,down:false};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  ac();
  if(k==='m'){ muted=!muted; addText(player.x,player.y-26,muted?'Muted':'Sound on','#c9d1d9'); }
  if(k==='b'){ state.dbg=!state.dbg; }
  if(k==='p' && state.mode==='play'){ state.paused=!state.paused; }
  if(k==='i' && state.mode==='play' && !state.dialog){ state.inv=!state.inv; return; }
  if(state.inv && k==='escape'){ state.inv=false; return; }
  if(state.mode==='title' && (k==='enter'||k===' ')){ startGame(); return; }
  if(state.mode==='dead' && k==='enter'){ respawn(); return; }
  if(state.mode==='victory' && k==='enter'){ state.mode='play'; state.firstVictory=false; return; }
  if(state.dialog){
    const D=state.dialog;
    if(D.options){
      for(let i=0;i<D.options.length;i++)
        if(k===String(i+1)){ D.options[i].act(); return; }
      if(k==='escape'){ state.dialog=null; return; }
    }
    if(k==='e'||k==='enter'||k===' '||k==='escape'){
      if(D.options && (k==='e')){ state.dialog=null; return; }
      if(!D.options){
        if(D.page<D.lines.length-1) D.page++;
        else state.dialog=null;
      }
    }
    return;
  }
  if(state.mode!=='play') return;
  if(state.cine) return; // cinematic freeze
  if(state.inv) return;  // inventory open
  if(k==='r'){
    if(!player.bow){ sfx('denied'); addText(player.x,player.y-26,'No bow yet — Finn sells them','#c9d1d9'); }
    else { player.weapon = player.weapon==='bow' ? 'sword' : 'bow'; sfx('coin');
      addText(player.x,player.y-26,'Weapon: '+(player.weapon==='bow'?'Bow':'Sword'),'#ffd75e'); }
    return;
  }
  if(k==='e') interact();
  if(k==='q') drinkPotion();
  if(k===' '||k==='j') doAttack(Math.atan2(player.face.y,player.face.x));
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });
cvs.addEventListener('mousemove',e=>{ const r=cvs.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
cvs.addEventListener('mousedown',e=>{
  ac();
  if(state.mode==='title'){ startGame(); return; }
  if(state.mode==='dead'){ respawn(); return; }
  if(state.mode==='victory'){ state.mode='play'; state.firstVictory=false; return; }
  if(state.dialog||state.paused||state.trans||state.cine||state.inv) return;
  const wx=mouse.x+cam.x, wy=mouse.y+cam.y;
  doAttack(Math.atan2(wy-player.y,wx-player.x));
});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

function startGame(){
  state.mode='play';
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  sfx('quest');
  addText(player.x,player.y-40,'Welcome to Emberfall','#ffd75e',3,true);
}
function respawn(){
  if(state.floor!==0){ genSurface(); spawnNPCs(); buildMinimap(); state.floor=0; }
  player.hp=player.maxHp;
  player.gold=Math.floor(player.gold*0.8);
  player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
  enemies=[]; arrows=[]; drops=[];
  state.boss=null; state.portal=null; state.trans=null;
  state.mode='play'; player.invulnT=2;
  addText(player.x,player.y-40,'You wake by the village well... (lost 20% gold)','#c9d1d9',2.5,true);
}

/* ---------------- camera ---------------- */
const cam={x:0,y:0};
function updateCam(dt){
  const maxX=mapW*TS-VW, maxY=mapH*TS-VH;
  const tx = maxX<=0 ? maxX/2 : clamp(player.x-VW/2,0,maxX);
  const ty = maxY<=0 ? maxY/2 : clamp(player.y-VH/2,0,maxY);
  cam.x=lerp(cam.x,tx,1-Math.pow(0.0001,dt));
  cam.y=lerp(cam.y,ty,1-Math.pow(0.0001,dt));
}

/* ---------------- update ---------------- */
function update(dt){
  state.time+=dt;
  musicTick(dt);
  if(state.shakeT>0) state.shakeT-=dt;

  // particles / texts always animate
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; p.vx*=0.98; }
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){ t.life-=dt; t.y-=26*dt; }
  texts=texts.filter(t=>t.life>0);

  if(state.mode!=='play' || state.paused) return;
  playTime+=dt;

  // floor transition fade
  if(state.trans){
    const tr=state.trans;
    if(tr.phase==='out'){ tr.t+=dt*2.4; if(tr.t>=1){ tr.t=1; tr.cb(); tr.phase='in'; } }
    else { tr.t-=dt*2.4; if(tr.t<=0) state.trans=null; }
    return;
  }

  // Roblox-Doors style floor cinematic freezes gameplay
  if(state.cine){
    state.cine.t+=dt;
    if(state.cine.t>=state.cine.dur) state.cine=null;
    return;
  }
  if(state.inv) return;

  /* --- player --- */
  const p=player;
  p.atkCd-=dt; p.swingT-=dt; p.invulnT-=dt; p.hurtFlash-=dt;
  let mx=0,my=0;
  const canMove = !state.dialog;
  if(canMove){
    if(keys['w']||keys['arrowup']) my-=1;
    if(keys['s']||keys['arrowdown']) my+=1;
    if(keys['a']||keys['arrowleft']) mx-=1;
    if(keys['d']||keys['arrowright']) mx+=1;
  }
  p.moving = mx!==0||my!==0;
  if(p.moving){
    const l=Math.hypot(mx,my); mx/=l; my/=l;
    moveEntity(p,mx*p.speed*dt,my*p.speed*dt);
    p.face.x=mx; p.face.y=my;
    p.walkT+=dt*10;
  } else p.walkT=0;
  // continuous attack while mouse held
  if(mouse.down && canMove) doAttack(Math.atan2(mouse.y+cam.y-p.y, mouse.x+cam.x-p.x));
  // lava burns
  if(tileAtPx(p.x,p.y)===T_LAVA && p.invulnT<=0)
    hurtPlayer(8,p.x+rnd(-1,1),p.y+rnd(-1,1));
  // out-of-combat regeneration: 30s without taking damage, then +1 hp per second
  p.hurtT+=dt;
  if(p.hurtT>=30 && p.hp<p.maxHp){
    p.regenAcc+=dt;
    while(p.regenAcc>=1){ p.regenAcc-=1; p.hp=Math.min(p.maxHp,p.hp+1); }
  } else if(p.hp>=p.maxHp){
    p.regenAcc=0;
  }
  // safety net: never stay trapped inside collision
  if(!circleFree(p.x,p.y,p.r)){ const s=findFreeSpot(p.x,p.y,p.r); p.x=s.x; p.y=s.y; }

  /* --- enemies --- */
  const villagePx=VILLAGE.x*TS, villagePy=VILLAGE.y*TS;
  for(const e of [...enemies]){
    e.flash-=dt; e.atkCd-=dt; e.shootCd-=dt; e.castCd-=dt; e.summonCd-=dt; e.phase+=dt*6;
    moveEntity(e,e.kb.x*dt,e.kb.y*dt); // knockback respects walls (no clipping)
    const kdec=Math.pow(0.02,dt); e.kb.x*=kdec; e.kb.y*=kdec;
    if(state.floor===0){
      const vd=dist(e.x,e.y,villagePx,villagePy);
      if(vd<VILLAGE.r*TS){
        const a=Math.atan2(e.y-villagePy,e.x-villagePx);
        moveEntity(e,Math.cos(a)*e.spd*1.4*dt,Math.sin(a)*e.spd*1.4*dt);
        continue;
      }
    }
    const d=dist(e.x,e.y,p.x,p.y);
    const aggro=EDEF[e.type].aggro;
    if(d<aggro && d>0){
      let a=Math.atan2(p.y-e.y,p.x-e.x);
      if(e.type==='bat'){
        a+=Math.sin(e.phase*0.9)*0.8;
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else if(e.type==='necro'){
        if(d<150) avoidLava(e,-Math.cos(a)*e.spd*dt,-Math.sin(a)*e.spd*dt);
        else if(d>280) avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
        else { const s=Math.sin(e.phase*0.5);
          avoidLava(e,Math.cos(a+Math.PI/2)*e.spd*0.5*s*dt,Math.sin(a+Math.PI/2)*e.spd*0.5*s*dt); }
        if(e.castCd<=0 && d<420){
          e.castCd=2.6; sfx('fire');
          eBolt(e.x,e.y,a,250,e.dmg*0.75,'void',1.8);
          burst(e.x,e.y,'#c46bff',5,60,0.3,2);
        }
        if(e.summonCd<=0){
          e.summonCd=8;
          if(enemies.filter(x=>x.necroMinion).length<2){
            for(let i=0;i<2;i++){
              const s=findFreeSpot(e.x+rnd(-40,40),e.y+rnd(-40,40),11);
              makeEnemy('skeleton',s.x,s.y).necroMinion=true;
            }
            sfx('summon'); burst(e.x,e.y,'#c46bff',10,80,0.5,3);
          }
        }
      } else {
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      }
      if(e.shoots && d<260 && d>70 && e.shootCd<=0){
        e.shootCd=1.9; sfx('arrow');
        eBolt(e.x,e.y,a,235,e.dmg*0.75,'bone',2.2);
      }
      if(d<e.r+p.r+3 && e.atkCd<=0){
        e.atkCd=0.85; hurtPlayer(e.dmg,e.x,e.y);
      }
    } else {
      e.wanderT-=dt;
      if(e.wanderT<=0){ e.wanderT=rnd(1,2.6); e.wa=rnd(TAU); }
      avoidLava(e,Math.cos(e.wa)*e.spd*0.35*dt,Math.sin(e.wa)*e.spd*0.35*dt);
    }
  }

  /* --- boss --- */
  if(state.boss) updateBoss(state.boss,dt);
  else if(state.floor===0 && !state.flags.warden && entrance && dist(p.x,p.y,entrance.x,entrance.y)<260){
    const s=findFreeSpot(entrance.x+rnd(-90,90),entrance.y-100,24);
    spawnBoss('warden',s.x,s.y);
  }
  else if(state.floor>0 && !state.bossesDead[state.floor] && state.dbossRoom){
    const br=state.dbossRoom;
    const ptx=p.x/TS, pty=p.y/TS;
    if(ptx>br.x-1.5 && ptx<br.x+br.w+1.5 && pty>br.y-1.5 && pty<br.y+br.h+1.5)
      spawnBoss(FLOORBOSS[state.floor], br.cx*TS+TS/2, br.cy*TS+TS/2);
  }

  /* --- hidden vault discovery (Doors-style secret subfloor) --- */
  for(const v of (state.dvaults||[])){
    if(v.seen) continue;
    const vx0=v.x*TS+TS*0.5, vy0=v.y*TS+TS*0.5;
    const vx1=(v.x+v.w)*TS-TS*0.5, vy1=(v.y+v.h)*TS-TS*0.5;
    if(p.x>vx0 && p.x<vx1 && p.y>vy0 && p.y<vy1){
      v.seen=true;
      state.cine={t:0,dur:2.6,head:'THE HIDDEN VAULT',title:'SECRET CHAMBER',
        sub:'A room the dungeon forgot'};
      sfx('quest');
    }
  }

  /* --- Ember Seal: the boss room unseals once every foe on the floor is slain --- */
  if(state.floor>0 && !state.sealOpen && state.sealSet && state.sealSet.size){
    const left=enemies.filter(e=>!e.minion && !e.shrineRef && !e.vaultGuard).length;
    if(left===0){
      for(const key of state.sealTiles){
        const [sx,sy]=key.split(',').map(Number);
        setTile(sx,sy,T_FLOOR);
      }
      state.sealOpen=true;
      buildMinimap();
      sfx('quest'); shake(0.7,9);
      const br=state.dbossRoom;
      burst(br.cx*TS+TS/2,br.cy*TS+TS/2,'#ff9a3d',40,230,1.1,4);
      addText(player.x,player.y-64,'THE EMBER SEAL SHATTERS','#ff8a5e',3,true);
      addText(player.x,player.y-88,'The guardian awaits...','#c9d1d9',2.6,true);
    }
  }

  /* --- arrows (enemy bolts & player arrows) --- */
  for(const a of [...arrows]){
    a.life-=dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.life<=0 || !circleFree(a.x,a.y,3,true)){ arrows.splice(arrows.indexOf(a),1); continue; }
    if(a.friendly){
      let hit=false;
      for(const e of [...enemies]){
        if(dist(a.x,a.y,e.x,e.y)<e.r+4){
          damageEnemy(e,a.dmg,a.vx*0.35,a.vy*0.35); hit=true; break;
        }
      }
      if(!hit && state.boss && dist(a.x,a.y,state.boss.x,state.boss.y)<state.boss.r+4){
        damageBoss(a.dmg,a.vx*0.3,a.vy*0.3); hit=true;
      }
      if(hit) arrows.splice(arrows.indexOf(a),1);
    } else if(dist(a.x,a.y,p.x,p.y)<p.r+4){
      hurtPlayer(a.dmg,a.x-a.vx,a.y-a.vy);
      arrows.splice(arrows.indexOf(a),1);
    }
  }

  /* --- drops --- */
  for(const d of [...drops]){
    d.t+=dt*4;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.9; d.vy*=0.9;
    const dd=dist(d.x,d.y,p.x,p.y);
    if(dd<70){ const a=Math.atan2(p.y-d.y,p.x-d.x); const pull=clamp((70-dd)*8,60,320); d.x+=Math.cos(a)*pull*dt; d.y+=Math.sin(a)*pull*dt; }
    if(dd<p.r+10){
      drops.splice(drops.indexOf(d),1);
      if(d.type==='coin'){ player.gold+=d.val; addText(d.x,d.y-10,'+'+d.val+'g','#ffd75e',0.7); sfx('coin'); }
      else if(d.type==='potion'){ player.potions++; addText(d.x,d.y-10,'+1 potion','#ff7b8f',0.9); sfx('potion'); }
      else if(d.type==='arrows'){ player.arrows+=d.val||5; addText(d.x,d.y-10,'+'+(d.val||5)+' arrows','#e8e2d0',0.9); sfx('bow'); }
      else { gainXp(d.val); sfx('xp'); }
    }
  }

  /* --- spawn timer --- */
  state.spawnT-=dt;
  if(state.spawnT<=0){
    state.spawnT=1.4;
    if(state.floor===0) spawnEnemySurface();
    else if(state.sealOpen && !state.boss) spawnEnemyFloor(); // no adds while sealed or dueling
  }
}

/* ---------------- rendering: world ---------------- */
const THEMES={
  1:{bg:'#0d0c0a', wall:'#4a443c', wallTop:'#61584a', floor:'#34302b', floorHi:'#3f3a33', fog:'rgba(6,5,8,0.94)'},
  2:{bg:'#120a08', wall:'#3a2d31', wallTop:'#523f44', floor:'#2c2325', floorHi:'#382c2f', fog:'rgba(11,3,3,0.94)'},
  3:{bg:'#0b0810', wall:'#332a44', wallTop:'#493c63', floor:'#251f31', floorHi:'#302842', fog:'rgba(7,4,14,0.94)'},
  4:{bg:'#100d0a', wall:'#3d342c', wallTop:'#54483b', floor:'#2a2521', floorHi:'#352f28', fog:'rgba(9,6,4,0.94)'},
  5:{bg:'#0e0705', wall:'#41292a', wallTop:'#583c3e', floor:'#2b1d1d', floorHi:'#372727', fog:'rgba(13,3,2,0.95)'},
};

/* ---------- procedural material textures ----------
   Every material is painted once into a 128x128 canvas at load time:
   per-pixel grain, block/slab bevels, mortar, mineral flecks, cracks and
   damp staining. The result is used as a world-anchored repeating pattern,
   so the stonework stays glued to the floor as the camera moves.          */
const TEXN=128;
function texRGB(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function makeWallTex(th){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;
  const g=cv.getContext('2d');
  const base=texRGB(th.wall);
  const img=g.createImageData(TEXN,TEXN), d=img.data;
  for(let y=0;y<TEXN;y++)for(let x=0;x<TEXN;x++){
    const row=(y/32)|0, ox=(row%2)?32:0;
    const bx=(x+ox)%64, by=y%32;
    const mortar=bx<2||by<2;
    const bevel=mortar?0:(bx<4||by<4)?13:(bx>60||by>28)?-11:0;
    const mott=Math.sin((x+row*17)*0.098)*0.5+Math.sin((y-row*11)*0.071)*0.5;
    const grain=(Math.random()-0.5)*20;
    let r=base[0]+grain+mott*9+bevel;
    let gg=base[1]+grain+mott*8+bevel;
    let b=base[2]+grain+mott*7+bevel;
    if(mortar){ r*=0.52; gg*=0.52; b*=0.52; }
    if(!mortar && by>24){ r-=6; gg+=2; b-=7; }               // damp foot of each block
    if(!mortar && Math.random()<0.012){ r+=34; gg+=30; b+=24; } // mineral flecks
    if(!mortar && Math.random()<0.008){ r-=28; gg-=28; b-=28; } // pitting
    const i=(y*TEXN+x)*4;
    d[i]=clamp(r,0,255); d[i+1]=clamp(gg,0,255); d[i+2]=clamp(b,0,255); d[i+3]=255;
  }
  g.putImageData(img,0,0);
  // chiselled bevel highlights along block tops/lefts

function makeFloorTex(th){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;

  const base=texRGB(th.floor), hi=texRGB(th.floorHi);
  const img=g.createImageData(TEXN,TEXN), d=img.data;
  for(let y=0;y<TEXN;y++)for(let x=0;x<TEXN;x++){
    const sx=x%64, sy=y%64;
    const mortar=sx<2||sy<2;
    const slab=((x/64)|0)+((y/64)|0)*2;
    const sv=((slab*37)%13)/13-0.5;

    if(mortar){ r=r*0.5+hi[0]*0.10; gg=gg*0.5+hi[1]*0.10; b=b*0.5+hi[2]*0.10; }
    else if(sx<5||sy<5){ r+=10; gg+=10; b+=9; }               // worn bevel
    else if(sx>59||sy>59){ r-=9; gg-=9; b-=8; }
    if(!mortar && Math.random()<0.010){ r+=20; gg+=19; b+=16; } // grit
    if(!mortar && Math.random()<0.006){ r-=18; gg-=18; b-=18; }
    const i=(y*TEXN+x)*4;
    d[i]=clamp(r,0,255); d[i+1]=clamp(gg,0,255); d[i+2]=clamp(b,0,255); d[i+3]=255;
  }
  g.putImageData(img,0,0);

  for(let i=0;i<5;i++){

}

const texCache=new Map();
function texPattern(key,make){
  let t=texCache.get(key);
  if(!t){ t={cv:make()}; texCache.set(key,t); }
  if(!t.pat) t.pat=ctx.createPattern(t.cv,'repeat');
  return t.pat;
}
function anchorPat(p){
  try{ p.setTransform(new DOMMatrix([1,0,0,1,-(cam.x%TEXN),-(cam.y%TEXN)])); }catch(e){}
  return p;
}
function wallPat(th){
  const fl=state.floor;
  return anchorPat(texPattern('w'+fl,()=>makeWallTex(th)));
}
function floorPat(th){
  const fl=state.floor;
  return anchorPat(texPattern('f'+fl,()=>makeFloorTex(th)));
}
function surfacePat(name){
  return anchorPat(texPattern('s'+name, name==='grass'?makeGrassTex:name==='corrupt'?makeCorruptTex:makeSandTex));
}

function drawTiles(){
  const x0=Math.max(0,Math.floor(cam.x/TS)), x1=Math.min(mapW-1,Math.floor((cam.x+VW)/TS));
  const y0=Math.max(0,Math.floor(cam.y/TS)), y1=Math.min(mapH-1,Math.floor((cam.y+VH)/TS));
  const t=state.time;
  if(state.floor>0){
    const th=THEMES[state.floor];
    const sealSet=state.sealSet;
    const sealOn=!!(sealSet && sealSet.size && !state.sealOpen);
    const wp=wallPat(th), fp=floorPat(th);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const tl=tiles[ty*mapW+tx], v=tileVar[ty*mapW+tx];
      const px=tx*TS-cam.x, py=ty*TS-cam.y;
      if(tl===T_WALL || tl===T_SECRET){
        // photographic-ish stone blocks from the generated material
        ctx.fillStyle=wp; ctx.fillRect(px,py,TS,TS);
        // per-tile tonal variation breaks the repeat
        const sh=(v-0.5)*0.30;
        ctx.fillStyle=sh>0?`rgba(255,240,220,${sh})`:`rgba(0,0,0,${-sh})`;
        ctx.fillRect(px,py,TS,TS);
        // grime gathers at floor level
        if(tileAt(tx,ty+1)===T_FLOOR){
          const gr=ctx.createLinearGradient(0,py+TS-12,0,py+TS);
          gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.38)');
          ctx.fillStyle=gr; ctx.fillRect(px,py+TS-12,TS,12);
        }
        // 2.5D front face: walls show their face toward the camera
        if(tileAt(tx,ty+1)!==T_WALL){
          const fh=12;
          ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(px,py+TS-fh,TS,fh);
          ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(px,py+TS-fh,TS,2);
          ctx.fillStyle='rgba(0,0,0,0.5)';
          ctx.fillRect(px+((hash2(tx*3,ty*7)*TS)|0)%TS,py+TS-fh+3,2,fh-3);
        }
        // top cap when nothing above (raised block look)
        if(tileAt(tx,ty-1)!==T_WALL){
          ctx.fillStyle=th.wallTop; ctx.fillRect(px,py,TS,5);
          ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(px,py,TS,1);
          ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(px,py+5,TS,1);
        }
        // cracked secret wall: faint fracture lines, no obvious door
        if(tl===T_SECRET){
          ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=1.4;
          ctx.beginPath();
          ctx.moveTo(px+7,py+3); ctx.lineTo(px+12,py+13); ctx.lineTo(px+9,py+21);
          ctx.lineTo(px+16,py+29);
          ctx.moveTo(px+25,py+4); ctx.lineTo(px+21,py+12); ctx.lineTo(px+24,py+18);
          ctx.stroke();
          ctx.fillStyle='rgba(196,107,255,0.10)'; ctx.fillRect(px+7,py+20,11,4);
        }
        // Ember Seal runes pulse until the floor is cleared
        if(sealOn && sealSet.has(tx+','+ty)){
          const gl=0.5+0.5*Math.sin(t*3.2+(tx*0.7+ty*1.3));
          ctx.fillStyle=`rgba(255,90,40,${0.10+gl*0.22})`; ctx.fillRect(px,py,TS,TS);
          ctx.strokeStyle=`rgba(255,150,70,${0.30+gl*0.45})`; ctx.lineWidth=1.6;
          ctx.strokeRect(px+2.5,py+2.5,TS-5,TS-5);
          ctx.fillStyle=`rgba(255,190,110,${0.30+gl*0.40})`;
          ctx.fillRect(px+TS/2-1.5,py+TS/2-1.5,3,3);
        }
        continue;
      }
      if(tl===T_LAVA){
        // layered molten flow: deep crust, bright current, bubbles
        const sh=Math.sin(t*2.2+tx*0.8+ty*1.1)*0.5+0.5;
        const sh2=Math.sin(t*1.3-tx*1.7+ty*0.6)*0.5+0.5;
        ctx.fillStyle=`rgb(${168+sh*70|0},${44+sh2*42|0},10)`;
        ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle=`rgba(255,${150+sh2*80|0},40,${0.16+sh*0.22})`;
        ctx.fillRect(px,py+((v*20)|0),TS,3);
        if(v>0.45){
          const gl=0.5+0.5*Math.sin(t*4+tx*2+ty*3);
          ctx.fillStyle=`rgba(255,225,120,${0.25+gl*0.4})`;
          ctx.fillRect(px+6+v*14,py+8+((v*37)%12),5,3);
          ctx.fillRect(px+18,py+20-gl*4,4,3);
        }
        // molten rim
        const glow=0.22+0.14*Math.sin(t*3.4+tx*1.7+ty*0.9);
        ctx.strokeStyle=`rgba(255,170,70,${glow})`; ctx.lineWidth=3;
        ctx.strokeRect(px+1.5,py+1.5,TS-3,TS-3);
        continue;
      }
      if(tl===T_STAIRSDOWN){
        ctx.fillStyle='#0c0a0e'; ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle='#241f1a';
        for(let i=0;i<4;i++) ctx.fillRect(px+4+i*6,py+4+i*6,TS-8-i*12,TS-8-i*12);
        const gl=0.5+0.5*Math.sin(t*3);
        ctx.strokeStyle=`rgba(255,120,60,${0.25+gl*0.35})`; ctx.lineWidth=2;
        ctx.strokeRect(px+3,py+3,TS-6,TS-6);
        continue;
      }
      if(tl===T_STAIRSUP){
        ctx.fillStyle='#241f1a'; ctx.fillRect(px,py,TS,TS);

        const gl=0.5+0.5*Math.sin(t*2.4);
        ctx.strokeStyle=`rgba(255,215,120,${0.2+gl*0.3})`; ctx.lineWidth=2;

      ctx.fillRect(px,py,TS,TS);

        ctx.fillRect(px+v*20,py+10,2,2); ctx.fillRect(px+19,py+v*16,2,2);
      }
      if(v<0.05){ // hairline tile crack
        ctx.strokeStyle='rgba(0,0,0,0.32)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px+6,py+7); ctx.lineTo(px+13,py+15); ctx.lineTo(px+11,py+24); ctx.stroke();
      }
      // ambient occlusion — walls cast soft shadows onto the floor
      if(tileAt(tx,ty-1)===T_WALL){
        ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(px,py,TS,7);
        ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.fillRect(px,py+7,TS,5);
      }
      if(tileAt(tx,ty+1)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.26)'; ctx.fillRect(px,py+TS-6,TS,6); }
      if(tileAt(tx-1,ty)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.fillRect(px,py,5,TS); }
      if(tileAt(tx+1,ty)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.fillRect(px+TS-5,py,5,TS); }
    }
    return;
  }
  /* surface */
  const gp=surfacePat('grass'), cp=surfacePat('corrupt'), sp=surfacePat('sand');
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const tl=tiles[ty*mapW+tx], v=tileVar[ty*mapW+tx];
    const px=tx*TS-cam.x, py=ty*TS-cam.y;
    if(tl===T_WATER){
      const sh=Math.sin(t*1.5+tx*0.9+ty*1.3)*0.5+0.5;
      const sh2=Math.sin(t*0.9-tx*0.6+ty*0.8)*0.5+0.5;
      ctx.fillStyle=`rgb(${30+sh*16|0},${88+sh2*26|0},${150+sh*34|0})`;
      ctx.fillRect(px,py,TS,TS);

      ctx.fillStyle=`rgba(160,230,255,${0.05+sh*0.07})`;
      ctx.fillRect(px,py,TS,TS);

        ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1.5;
        ctx.beginPath();

    }

      ctx.fillStyle=sp; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=`rgba(255,244,210,${(v-0.5)*0.12})`;
      ctx.fillRect(px,py,TS,TS);
      continue;
    }
    if(tl===T_CORRUPT){
      ctx.fillStyle=cp; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=`rgba(30,0,40,${(v-0.5)*0.18})`;
      ctx.fillRect(px,py,TS,TS);
      if(v>0.86){
        const gl=0.5+0.5*Math.sin(t*3+tx+ty);
        ctx.fillStyle=`rgba(255,${100+gl*80|0},40,${0.35+gl*0.4})`;
        ctx.fillRect(px+10,py+12,3,3); ctx.fillRect(px+18,py+20,2,2);
      }
      continue;
    }
    if(tl===T_STAIRSDOWN){
      ctx.fillStyle='#0c0a0e'; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle='#241f1a';
      for(let i=0;i<4;i++) ctx.fillRect(px+4+i*6,py+4+i*6,TS-8-i*12,TS-8-i*12);
      const gl=0.5+0.5*Math.sin(t*3);

    const sh=(v-0.5)*0.18;
    ctx.fillStyle=sh>0?`rgba(210,255,190,${sh})`:`rgba(0,20,10,${-sh})`;

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawTreeOne(tr){
  const t=state.time;
  const sx=tr.x-cam.x, sy=tr.y-cam.y;
  const sway=Math.sin(t*1.4+tr.sway)*2.2;
  const s=tr.big?1.25:1;
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(sx,sy+4,12*s,5,0,0,TAU); ctx.fill();
  ctx.fillStyle=tr.corrupt?'#3a2c33':'#6b4a2c';
  ctx.fillRect(sx-4*s,sy-16*s,8*s,24*s);
  ctx.fillStyle=tr.corrupt?'#2c2028':'#4a3220';
  ctx.fillRect(sx-4*s,sy+5*s,8*s,3*s);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(sx-4*s,sy-16*s,2*s,22*s);
  const c1=tr.corrupt?'#3d2b4d':'#2f7a34', c2=tr.corrupt?'#55376b':'#3d9448';
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.arc(sx+sway,sy-17*s,12.5*s,0,TAU); ctx.fill();
  ctx.fillStyle=c2;
  ctx.beginPath(); ctx.arc(sx+sway-4*s,sy-21*s,9*s,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+sway+5*s,sy-19*s,7.5*s,0,TAU); ctx.fill();
  if(tr.corrupt){
    const gl=0.5+0.5*Math.sin(t*3+tr.sway*3);
    ctx.fillStyle=`rgba(255,120,50,${0.3+gl*0.4})`;
    ctx.beginPath(); ctx.arc(sx+sway+3,sy-14*s,2.2,0,TAU); ctx.fill();
  }
}
function drawBuildings(){
  for(const b of buildings){
    const sx=b.x-cam.x, sy=b.y-cam.y;
    if(sx<-120||sy<-120||sx>VW+120||sy>VH+120) continue;
    if(b.well){
      ctx.fillStyle='#6e6e78'; ctx.fillRect(sx,sy,b.w,b.h);
      ctx.fillStyle='#3d3d44'; ctx.beginPath(); ctx.ellipse(sx+b.w/2,sy+b.h/2,b.w*0.32,b.h*0.26,0,0,TAU); ctx.fill();
      ctx.fillStyle='#28506e'; ctx.beginPath(); ctx.ellipse(sx+b.w/2,sy+b.h/2,b.w*0.24,b.h*0.18,0,0,TAU); ctx.fill();
      continue;
    }
    if(b.stall){
      ctx.fillStyle='#7a5a3a'; ctx.fillRect(sx,sy,b.w,b.h);
      for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#e8e0d0':'#c8452f';
        ctx.fillRect(sx-6+i*(b.w+12)/6, sy-16, (b.w+12)/6, 12); }
      ctx.fillStyle='#5a4028'; ctx.fillRect(sx-4,sy-18,3,20); ctx.fillRect(sx+b.w+1,sy-18,3,20);
      continue;
    }
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(sx+4,sy+b.h-2,b.w,8);
    ctx.fillStyle=b.wall; ctx.fillRect(sx,sy,b.w,b.h);
    ctx.strokeStyle='rgba(90,70,45,0.5)'; ctx.lineWidth=2; ctx.strokeRect(sx+1,sy+1,b.w-2,b.h-2);
    if(b.door){ ctx.fillStyle='#5a3a22'; ctx.fillRect(sx+b.w/2-10,sy+b.h-30,20,30);
      ctx.fillStyle='#c8a44a'; ctx.beginPath(); ctx.arc(sx+b.w/2+5,sy+b.h-15,2,0,TAU); ctx.fill(); }
    ctx.fillStyle='#8fd0e8';
    ctx.fillRect(sx+12,sy+14,14,14); ctx.fillRect(sx+b.w-26,sy+14,14,14);
    ctx.strokeStyle='#5a3a22'; ctx.lineWidth=2;
    ctx.strokeRect(sx+12,sy+14,14,14); ctx.strokeRect(sx+b.w-26,sy+14,14,14);
    ctx.fillStyle=b.roof;
    ctx.beginPath();
    ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,sy-b.h*0.55); ctx.lineTo(sx+b.w+10,sy); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,sy-b.h*0.55); ctx.lineTo(sx+b.w/2,sy); ctx.closePath(); ctx.fill();
  }
}
function drawTorchOne(tr){
  const sx=tr.x-cam.x, sy=tr.y-cam.y;
  const flick=0.75+0.25*Math.sin(state.time*9+tr.fl*7);
  ctx.fillStyle='#3a2c20';
  ctx.fillRect(sx-2,sy-2,4,7);
  ctx.fillStyle=`rgba(255,140,50,${0.85*flick})`;
  ctx.beginPath(); ctx.arc(sx,sy-4,3.2+1.4*flick,0,TAU); ctx.fill();
  ctx.fillStyle=`rgba(255,225,140,${0.9*flick})`;
  ctx.beginPath(); ctx.arc(sx,sy-5,1.6+0.9*flick,0,TAU); ctx.fill();
}

  shadowEllipse(sx,sy+7,11,4.5);
  if(c.opened){
    ctx.fillStyle='#6b4a2c'; ctx.fillRect(sx-10,sy-4,20,10);
    ctx.fillStyle='#241c12'; ctx.fillRect(sx-8,sy-3,16,6);
    ctx.fillStyle='#5a3d22'; ctx.fillRect(sx-10,sy-13,20,6);

  } else {
    ctx.fillStyle='#6b4a2c'; ctx.fillRect(sx-10,sy-8,20,15);
    ctx.fillStyle='#835c36'; ctx.fillRect(sx-10,sy-8,20,5);
    ctx.fillStyle='#c8a44a'; ctx.fillRect(sx-2,sy-4,4,6);
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(sx-10,sy-8,20,2);
