/* ---------------- camera ---------------- */
const cam={x:0,y:0};
function updateCam(dt){
  const maxX=mapW*TS-VW, maxY=mapH*TS-VH;
  const tx = maxX<=0 ? maxX/2 : clamp(player.x-VW/2,0,maxX);
  const ty = maxY<=0 ? maxY/2 : clamp(player.y-VH/2,0,maxY);
  cam.x=lerp(cam.x,tx,1-Math.pow(0.0001,dt));
  cam.y=lerp(cam.y,ty,1-Math.pow(0.0001,dt));
}

/* ---------------- update ---------------- */
function update(dt){
  state.time+=dt;
  musicTick(dt);
  // day/night cycle on the overworld (a full day ~ 10 minutes)
  state.timeOfDay=(state.timeOfDay+dt/600)%1;
  if(state.shakeT>0) state.shakeT-=dt;

  // particles / texts always animate
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; p.vx*=0.98; }
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){ t.life-=dt; t.y-=26*dt; }
  texts=texts.filter(t=>t.life>0);

  if(state.mode!=='play' || state.paused) return;
  playTime+=dt;
  updateFX(dt);

  // floor transition fade
  if(state.trans){
    const tr=state.trans;
    if(tr.phase==='out'){ tr.t+=dt*2.4; if(tr.t>=1){ tr.t=1; tr.cb(); tr.phase='in'; } }
    else { tr.t-=dt*2.4; if(tr.t<=0) state.trans=null; }
    return;
  }

  // Roblox-Doors style floor cinematic freezes gameplay
  if(state.cine){
    state.cine.t+=dt;
    if(state.cine.t>=state.cine.dur) state.cine=null;
    return;
  }
  if(state.inv) return;

  /* --- player --- */
  const p=player;
  p.atkCd-=dt; p.swingT-=dt; p.invulnT-=dt; p.hurtFlash-=dt;
  let mx=0,my=0;
  const canMove = !state.dialog && !p.drink;   // frozen in place while chugging a flask
  if(canMove){
    if(keys['w']||keys['arrowup']) my-=1;
    if(keys['s']||keys['arrowdown']) my+=1;
    if(keys['a']||keys['arrowleft']) mx-=1;
    if(keys['d']||keys['arrowright']) mx+=1;
  }
  p.moving = mx!==0||my!==0;
  if(p.dashT>0){
    p.dashT-=dt;
    moveEntity(p,Math.cos(p.dashDir)*620*dt,Math.sin(p.dashDir)*620*dt);
    parts.push({x:p.x,y:p.y,vx:rnd(-20,20),vy:rnd(-20,20),life:0.3,max:0.3,color:'#9ad1ff',size:3,grav:0});
  } else if(p.moving){
    const l=Math.hypot(mx,my); mx/=l; my/=l;
    const spd=p.speed*(1+fxVal('speed'));
    moveEntity(p,mx*spd*dt,my*spd*dt);
    p.face.x=mx; p.face.y=my;
    p.walkT+=dt*10;
  } else p.walkT=0;
  // drink channel progress
  if(p.drink){
    p.drink.t+=dt;
    if(p.drink.t>=p.drink.max) finishDrink();
  }
  // bow draw: the arrow looses once the string is fully pulled
  if(p.bowDraw>0){
    p.bowDraw-=dt;
    if(p.bowDraw<=0) fireBow(p.fireAng||0);
  }
  if(p.dashCd>0) p.dashCd-=dt;
  if(p.whirlCd>0) p.whirlCd-=dt;
  if(p.whirlT>0) p.whirlT-=dt;
  // continuous attack while mouse held (weapon only — consumables fire on click)
  const selSlot=p.hotbar[p.sel];
  if(mouse.down && canMove && (!selSlot || !IDEF[selSlot.id].drink))
    doAttack(Math.atan2(mouse.y+cam.y-p.y, mouse.x+cam.x-p.x));
  // lava burns (Fire Resistance potion prevents it)
  if(tileAtPx(p.x,p.y)===T_LAVA && p.invulnT<=0 && !fxActive('fire'))
    hurtPlayer(8,p.x+rnd(-1,1),p.y+rnd(-1,1));
  // pressure plates: step on a switch to open its linked door
  const st=tileAtPx(p.x,p.y);
  if(st===T_SWITCH){
    const sw=switches.find(s=>s.x===Math.floor(p.x/TS)&&s.y===Math.floor(p.y/TS)&&!s.used);
    if(sw){ sw.used=true; sw.active=true; setTile(sw.doorX,sw.doorY,T_FLOOR);
      sfx('quest'); addText(p.x,p.y-26,'Door opened!','#7ee787',2,true); }
  }
  // out-of-combat regeneration: 30s idle (15s with Deep Mend), then +1 hp/s (+2 with Deep Mend)
  p.hurtT+=dt;
  const regenWait=p.abilities.regenPlus?15:30;
  if(p.hurtT>=regenWait && p.hp<p.maxHp){
    p.regenAcc+=dt;
    while(p.regenAcc>=1){ p.regenAcc-=1; p.hp=Math.min(p.maxHp,p.hp+(p.abilities.regenPlus?2:1)); }
  }
  // Regeneration potion effect: +val HP/s regardless of combat
  if(fxActive('regen') && p.hp<p.maxHp){
    p.regenAcc+=fxVal('regen')*dt;
    while(p.regenAcc>=1){ p.regenAcc-=1; p.hp=Math.min(p.maxHp,p.hp+1); }
  }
  if(p.hp>=p.maxHp) p.regenAcc=0;
  // safety net: never stay trapped inside collision
  if(!circleFree(p.x,p.y,p.r)){ const s=findFreeSpot(p.x,p.y,p.r); p.x=s.x; p.y=s.y; }

  /* --- enemies --- */
  const villagePx=VILLAGE.x*TS, villagePy=VILLAGE.y*TS;
  for(const e of [...enemies]){
    e.flash-=dt; e.atkCd-=dt; e.shootCd-=dt; e.castCd-=dt; e.summonCd-=dt; e.phase+=dt*6;
    e.lungeCd-=dt; e.slamCd-=dt; e.blinkCd-=dt; e.lungeT-=dt;
    moveEntity(e,e.kb.x*dt,e.kb.y*dt); // knockback respects walls (no clipping)
    const kdec=Math.pow(0.02,dt); e.kb.x*=kdec; e.kb.y*=kdec;
    if(state.floor===0){
      const vd=dist(e.x,e.y,villagePx,villagePy);
      if(vd<VILLAGE.r*TS){
        const a=Math.atan2(e.y-villagePy,e.x-villagePx);
        moveEntity(e,Math.cos(a)*e.spd*1.4*dt,Math.sin(a)*e.spd*1.4*dt);
        continue;
      }
    }
    const d=dist(e.x,e.y,p.x,p.y);
    const aggro=EDEF[e.type].aggro;
    if(e.hidden){ // dormant mimic — waits until prey comes close
      e.hiddenT=(e.hiddenT||0)+dt;
      if(d<88 && e.hiddenT>0.8){
        e.hidden=false; e.spd*=1.25;
        sfx('bossroar'); shake(0.3,5);
        burst(e.x,e.y,'#c48a5a',26,190,0.8,4);
        addText(e.x,e.y-30,"IT'S A MIMIC!",'#ff6a3d',2.4,true);
      }
      continue;
    }
    if(e.slamPre!==undefined && e.slamPre>0){ // yeti wind-up
      e.slamPre-=dt;
      if(e.slamPre<=0){
        shake(0.45,8); sfx('slam');
        burst(e.x,e.y,'#dceaf5',26,200,0.7,4);
        if(d<115) hurtPlayer(e.dmg*1.55,e.x,e.y);
        e.slamCd=e.enragedHack?4.5:6;
      }
      continue;
    }
    if(d<aggro && d>0){
      let a=Math.atan2(p.y-e.y,p.x-e.x);
      if(e.type==='bat'){
        a+=Math.sin(e.phase*0.9)*0.8;
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else if(e.type==='necro'){
        if(d<150) avoidLava(e,-Math.cos(a)*e.spd*dt,-Math.sin(a)*e.spd*dt);
        else if(d>280) avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
        else { const s=Math.sin(e.phase*0.5);
          avoidLava(e,Math.cos(a+Math.PI/2)*e.spd*0.5*s*dt,Math.sin(a+Math.PI/2)*e.spd*0.5*s*dt); }
        if(e.castCd<=0 && d<420){
          e.castCd=2.6; sfx('fire');
          eBolt(e.x,e.y,a,250,e.dmg*0.75,'void',1.8);
          burst(e.x,e.y,'#c46bff',5,60,0.3,2);
        }
        if(e.summonCd<=0){
          e.summonCd=8;
          if(enemies.filter(x=>x.necroMinion).length<2){
            for(let i=0;i<2;i++){
              const s=findFreeSpot(e.x+rnd(-40,40),e.y+rnd(-40,40),11);
              makeEnemy('skeleton',s.x,s.y).necroMinion=true;
            }
            sfx('summon'); burst(e.x,e.y,'#c46bff',10,80,0.5,3);
          }
        }
      } else if(e.casts && e.type!=='necro'){ // imp/sporecap/frostwisp/wisp/emberite/sprite
        const kind=e.casts==='fire'?'fire':e.casts==='frost'?'frost':'spore';
        if(d<160) avoidLava(e,-Math.cos(a)*e.spd*dt,-Math.sin(a)*e.spd*dt);
        else if(d>320) avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
        else avoidLava(e,Math.cos(a+Math.PI/2)*e.spd*0.5*Math.sin(e.phase*0.6)*dt,Math.sin(a+Math.PI/2)*e.spd*0.5*Math.sin(e.phase*0.6)*dt);
        if(e.castCd<=0 && d<400){
          e.castCd=e.type==='sprite'?3.2:2.4; sfx('fire');
          eBolt(e.x,e.y,a+rnd(-0.12,0.12),kind==='fire'?240:170,e.dmg*0.85,kind,1.9);
          burst(e.x,e.y,kind==='fire'?'#ff8a3d':'#8fd8ff',5,60,0.3,2);
        }
      } else if(e.type==='bandit'||e.keeps){
        if(d<130) avoidLava(e,-Math.cos(a)*e.spd*dt,-Math.sin(a)*e.spd*dt);
        else if(d>240) avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
        else avoidLava(e,Math.cos(a+Math.PI/2)*e.spd*0.55*Math.sin(e.phase*0.7)*dt,Math.sin(a+Math.PI/2)*e.spd*0.55*Math.sin(e.phase*0.7)*dt);
        if(e.shootCd<=0 && d<330){
          e.shootCd=1.6; sfx('arrow');
          eBolt(e.x,e.y,a+rnd(-0.08,0.08),265,e.dmg*0.8,'bone',2);
        }
      } else if(e.zigzag){
        a+=Math.sin(e.phase*1.4)*0.55;
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else if(e.lunge){
        if(e.lungeT>0){
          moveEntity(e,Math.cos(e.lungeA)*e.spd*3.1*dt,Math.sin(e.lungeA)*e.spd*3.1*dt);
          burst(e.x,e.y,e.type==='hound'?'#ff8a3d':'#8a8a94',2,40,0.25,2);
        } else if(e.lungeCd<=0 && d<230 && d>60){
          e.lungeT=0.32; e.lungeA=a; e.lungeCd=3.3;
          sfx('dash');
        } else avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else if(e.blinky){
        if(e.blinkCd<=0 && d>160){
          e.blinkCd=5;
          burst(e.x,e.y,'#3a2a58',12,110,0.5,3);
          const ba=Math.atan2(p.y-e.y,p.x-e.x)+rnd(-0.6,0.6);
          const s=findFreeSpot(e.x+Math.cos(ba)*Math.min(200,d-40), e.y+Math.sin(ba)*Math.min(200,d-40), e.r);
          e.x=s.x; e.y=s.y;
          burst(e.x,e.y,'#6b5ac4',12,110,0.5,3);
          sfx('blink');
        }
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else if(e.slam){
        if(e.slamCd<=0 && d<120){ e.slamPre=0.9; sfx('summon'); }
        else avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      } else {
        avoidLava(e,Math.cos(a)*e.spd*dt,Math.sin(a)*e.spd*dt);
      }
      if(e.shoots && !e.keeps && d<260 && d>70 && e.shootCd<=0){
        e.shootCd=1.9; sfx('arrow');
        eBolt(e.x,e.y,a,235,e.dmg*0.75,'bone',2.2);
      }
      if(e.lungeT>0 && d<e.r+p.r+8 && e.atkCd<=0){
        e.atkCd=0.7; hurtPlayer(e.dmg*1.2,e.x,e.y);
        if(e.poisonHit) applyFx('poison',4,2);
      } else if(d<e.r+p.r+3 && e.atkCd<=0){
        e.atkCd=0.85; hurtPlayer(e.dmg,e.x,e.y);
        if(e.poisonHit) applyFx('poison',4,2);
      }
    } else {
      e.wanderT-=dt;
      if(e.wanderT<=0){ e.wanderT=rnd(1,2.6); e.wa=rnd(TAU); }
      avoidLava(e,Math.cos(e.wa)*e.spd*0.35*dt,Math.sin(e.wa)*e.spd*0.35*dt);
    }
  }

  /* --- boss --- */
  if(state.boss) updateBoss(state.boss,dt);
  else if(state.floor===0 && !state.flags.warden && entrance && dist(p.x,p.y,entrance.x,entrance.y)<260){
    const s=findFreeSpot(entrance.x+rnd(-90,90),entrance.y-100,24);
    spawnBoss('warden',s.x,s.y);
  }
  else if(state.floor>0 && !state.bossesDead[state.floor] && state.dbossRoom){
    const br=state.dbossRoom;
    const ptx=p.x/TS, pty=p.y/TS;
    if(ptx>br.x-1.5 && ptx<br.x+br.w+1.5 && pty>br.y-1.5 && pty<br.y+br.h+1.5)
      spawnBoss(FLOORBOSS[state.floor], br.cx*TS+TS/2, br.cy*TS+TS/2);
  }

  /* --- hidden vault discovery (Doors-style secret subfloor) --- */
  for(const v of (state.dvaults||[])){
    if(v.seen) continue;
    const vx0=v.x*TS+TS*0.5, vy0=v.y*TS+TS*0.5;
    const vx1=(v.x+v.w)*TS-TS*0.5, vy1=(v.y+v.h)*TS-TS*0.5;
    if(p.x>vx0 && p.x<vx1 && p.y>vy0 && p.y<vy1){
      v.seen=true;
      state.cine={t:0,dur:2.6,head:'THE HIDDEN VAULT',title:'SECRET CHAMBER',
        sub:'A room the dungeon forgot'};
      sfx('quest');
    }
  }

  /* --- Ember Seal: the boss room unseals once every foe on the floor is slain --- */
  if(state.floor>0 && !state.sealOpen && state.sealSet && state.sealSet.size){
    const left=enemies.filter(e=>!e.minion && !e.shrineRef && !e.vaultGuard).length;
    if(left===0){
      for(const key of state.sealTiles){
        const [sx,sy]=key.split(',').map(Number);
        setTile(sx,sy,T_FLOOR);
      }
      state.sealOpen=true;
      buildMinimap();
      sfx('quest'); shake(0.7,9);
      const br=state.dbossRoom;
      burst(br.cx*TS+TS/2,br.cy*TS+TS/2,'#ff9a3d',40,230,1.1,4);
      addText(player.x,player.y-64,'THE EMBER SEAL SHATTERS','#ff8a5e',3,true);
      addText(player.x,player.y-88,'The guardian awaits...','#c9d1d9',2.6,true);
    }
  }

  /* --- arrows (enemy bolts & player arrows) --- */
  for(const a of [...arrows]){
    a.life-=dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.life<=0 || !circleFree(a.x,a.y,3,true)){ arrows.splice(arrows.indexOf(a),1); continue; }
    if(a.friendly){
      // Magma Pierce: the arrow flies on, wounding everything in its line
      let spent=false;
      for(const e of [...enemies]){
        if(dist(a.x,a.y,e.x,e.y)<e.r+4){
          if(a.hitSet){ if(a.hitSet.includes(e)) continue; a.hitSet.push(e); damageEnemy(e,a.dmg,a.vx*0.35,a.vy*0.35); }
          else { damageEnemy(e,a.dmg,a.vx*0.35,a.vy*0.35); spent=true; break; }
        }
      }
      if(!spent && state.boss && dist(a.x,a.y,state.boss.x,state.boss.y)<state.boss.r+4){
        if(a.hitSet){ if(!a.hitSet.includes(state.boss)){ a.hitSet.push(state.boss); damageBoss(a.dmg,a.vx*0.3,a.vy*0.3); } }
        else { damageBoss(a.dmg,a.vx*0.3,a.vy*0.3); spent=true; }
      }
      if(spent) arrows.splice(arrows.indexOf(a),1);
    } else if(dist(a.x,a.y,p.x,p.y)<p.r+4){
      hurtPlayer(a.dmg*(a.kind==='fire'&&fxActive('fire')?0.35:1),a.x-a.vx,a.y-a.vy);
      if(a.kind==='spore') applyFx('poison',3.5,2);
      arrows.splice(arrows.indexOf(a),1);
    }
  }

  /* --- drops --- */
  for(const d of [...drops]){
    d.t+=dt*4;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.9; d.vy*=0.9;
    const dd=dist(d.x,d.y,p.x,p.y);
    if(dd<70){ const a=Math.atan2(p.y-d.y,p.x-d.x); const pull=clamp((70-dd)*8,60,320); d.x+=Math.cos(a)*pull*dt; d.y+=Math.sin(a)*pull*dt; }
    if(dd<p.r+10){
      drops.splice(drops.indexOf(d),1);
      if(d.type==='coin'){ player.gold+=d.val; addText(d.x,d.y-10,'+'+d.val+'g','#ffd75e',0.7); sfx('coin'); }
      else if(d.type==='potion'){ const k=d.kind||'p_health'; addItem(k,1); addText(d.x,d.y-10,'+1 '+IDEF[k].name,IDEF[k].color,0.9); sfx('potion'); }
      else if(d.type==='arrows'){ addItem('arrows',d.val||5); addText(d.x,d.y-10,'+'+(d.val||5)+' arrows','#e8e2d0',0.9); sfx('bow'); }
      else if(d.type==='goldbag'){ player.gold+=d.val; addText(d.x,d.y-10,'+'+d.val+'g','#ffd75e',0.8); sfx('coin'); }
      else { gainXp(d.val); sfx('xp'); }
    }
  }

  /* --- spawn timer --- */
  state.spawnT-=dt;
  if(state.spawnT<=0){
    state.spawnT=1.4;
    if(state.floor===0) spawnEnemySurface();
    else if(state.sealOpen && !state.boss) spawnEnemyFloor(); // no adds while sealed or dueling
  }
}

/* ---------------- rendering: world ---------------- */
const THEMES={
  1:{bg:'#0d0c0a', wall:'#4a443c', wallTop:'#61584a', floor:'#34302b', floorHi:'#3f3a33', fog:'rgba(6,5,8,0.94)'},
  2:{bg:'#120a08', wall:'#3a2d31', wallTop:'#523f44', floor:'#2c2325', floorHi:'#382c2f', fog:'rgba(11,3,3,0.94)'},
  3:{bg:'#0b0810', wall:'#332a44', wallTop:'#493c63', floor:'#251f31', floorHi:'#302842', fog:'rgba(7,4,14,0.94)'},
  4:{bg:'#100d0a', wall:'#3d342c', wallTop:'#54483b', floor:'#2a2521', floorHi:'#352f28', fog:'rgba(9,6,4,0.94)'},
  5:{bg:'#0e0705', wall:'#41292a', wallTop:'#583c3e', floor:'#2b1d1d', floorHi:'#372727', fog:'rgba(13,3,2,0.95)'},
};

/* ---------- procedural material textures ----------
   Every material is painted once into a 128x128 canvas at load time:
   per-pixel grain, block/slab bevels, mortar, mineral flecks, cracks and
   damp staining. The result is used as a world-anchored repeating pattern,
   so the stonework stays glued to the floor as the camera moves.          */
const TEXN=128;
function texRGB(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function makeWallTex(th){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;
  const g=cv.getContext('2d');
  const base=texRGB(th.wall);
  const img=g.createImageData(TEXN,TEXN), d=img.data;
  for(let y=0;y<TEXN;y++)for(let x=0;x<TEXN;x++){
    const row=(y/32)|0, ox=(row%2)?32:0;
    const bx=(x+ox)%64, by=y%32;
    const mortar=bx<2||by<2;
    const bevel=mortar?0:(bx<4||by<4)?13:(bx>60||by>28)?-11:0;
    const mott=Math.sin((x+row*17)*0.098)*0.5+Math.sin((y-row*11)*0.071)*0.5;
    const grain=(Math.random()-0.5)*20;
    let r=base[0]+grain+mott*9+bevel;
    let gg=base[1]+grain+mott*8+bevel;
    let b=base[2]+grain+mott*7+bevel;
    if(mortar){ r*=0.52; gg*=0.52; b*=0.52; }
    if(!mortar && by>24){ r-=6; gg+=2; b-=7; }               // damp foot of each block
    if(!mortar && Math.random()<0.012){ r+=34; gg+=30; b+=24; } // mineral flecks
    if(!mortar && Math.random()<0.008){ r-=28; gg-=28; b-=28; } // pitting
    const i=(y*TEXN+x)*4;
    d[i]=clamp(r,0,255); d[i+1]=clamp(gg,0,255); d[i+2]=clamp(b,0,255); d[i+3]=255;
  }
  g.putImageData(img,0,0);
  // chiselled bevel highlights along block tops/lefts
  g.fillStyle='rgba(255,255,255,0.075)';
  for(let row=0;row<4;row++){
    const oy=row*32, ox=(row%2)?32:0;
    for(let col=-1;col<3;col++){
      const bx=col*64+ox;
      g.fillRect(bx+2,oy+2,60,2);
      g.fillRect(bx+2,oy+2,2,28);
    }
  }
  // hairline cracks
  for(let i=0;i<7;i++){
    let x=Math.random()*TEXN, y=Math.random()*TEXN;
    g.strokeStyle='rgba(0,0,0,0.32)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<9;s++){ x+=(Math.random()-0.5)*13; y+=(Math.random()-0.25)*7; g.lineTo(x,y); }
    g.stroke();
  }
  // damp / moss pooling
  for(let i=0;i<7;i++){
    const x=Math.random()*TEXN, y=Math.random()*TEXN, r=10+Math.random()*26;
    const gr=g.createRadialGradient(x,y,1,x,y,r);
    gr.addColorStop(0,'rgba(14,20,10,0.20)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  return cv;
}
function makeFloorTex(th){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;
  const g=cv.getContext('2d');
  const base=texRGB(th.floor), hi=texRGB(th.floorHi);
  const img=g.createImageData(TEXN,TEXN), d=img.data;
  for(let y=0;y<TEXN;y++)for(let x=0;x<TEXN;x++){
    const sx=x%64, sy=y%64;
    const mortar=sx<2||sy<2;
    const slab=((x/64)|0)+((y/64)|0)*2;
    const sv=((slab*37)%13)/13-0.5;
    const mott=Math.sin(x*0.147+slab)*0.5+Math.sin(y*0.113-slab*1.7)*0.5;
    const grain=(Math.random()-0.5)*16;
    let r=base[0]+sv*12+grain+mott*5;
    let gg=base[1]+sv*12+grain+mott*5;
    let b=base[2]+sv*12+grain+mott*4;
    if(mortar){ r=r*0.5+hi[0]*0.10; gg=gg*0.5+hi[1]*0.10; b=b*0.5+hi[2]*0.10; }
    else if(sx<5||sy<5){ r+=10; gg+=10; b+=9; }               // worn bevel
    else if(sx>59||sy>59){ r-=9; gg-=9; b-=8; }
    if(!mortar && Math.random()<0.010){ r+=20; gg+=19; b+=16; } // grit
    if(!mortar && Math.random()<0.006){ r-=18; gg-=18; b-=18; }
    const i=(y*TEXN+x)*4;
    d[i]=clamp(r,0,255); d[i+1]=clamp(gg,0,255); d[i+2]=clamp(b,0,255); d[i+3]=255;
  }
  g.putImageData(img,0,0);
  // slab cracks and wear arcs
  for(let i=0;i<6;i++){
    let x=Math.random()*TEXN, y=Math.random()*TEXN;
    g.strokeStyle='rgba(0,0,0,0.24)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<7;s++){ x+=(Math.random()-0.5)*16; y+=(Math.random()-0.5)*11; g.lineTo(x,y); }
    g.stroke();
  }
  // dust drifts
  for(let i=0;i<5;i++){
    const x=Math.random()*TEXN, y=Math.random()*TEXN, r=14+Math.random()*22;
    const gr=g.createRadialGradient(x,y,1,x,y,r);
    gr.addColorStop(0,'rgba(210,200,180,0.06)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  return cv;
}
function makeGrassTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;
  const g=cv.getContext('2d');
  const img=g.createImageData(TEXN,TEXN), d=img.data;
  for(let y=0;y<TEXN;y++)for(let x=0;x<TEXN;x++){
    const mott=Math.sin(x*0.098)*0.5+Math.sin(y*0.147+1.3)*0.5+Math.sin((x+y)*0.049)*0.5;
    const grain=(Math.random()-0.5)*20;
    const i=(y*TEXN+x)*4;
    d[i]=clamp(54+grain+mott*15,0,255);
    d[i+1]=clamp(142+grain+mott*22,0,255);
    d[i+2]=clamp(58+grain+mott*12,0,255);
    d[i+3]=255;
  }
  g.putImageData(img,0,0);
  // blades
  for(let i=0;i<520;i++){
    const x=Math.random()*TEXN, y=Math.random()*TEXN, h=3+Math.random()*7;
    g.strokeStyle=`rgba(${30+Math.random()*40|0},${120+Math.random()*70|0},${40+Math.random()*30|0},0.55)`;
    g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*3,y-h); g.stroke();
  }
  // dirt patches
  for(let i=0;i<8;i++){
    const x=Math.random()*TEXN, y=Math.random()*TEXN, r=8+Math.random()*20;
    const gr=g.createRadialGradient(x,y,1,x,y,r);
    gr.addColorStop(0,'rgba(92,72,44,0.18)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  return cv;
}
function makeCorruptTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=TEXN;

  const x0=Math.max(0,Math.floor(cam.x/TS)), x1=Math.min(mapW-1,Math.floor((cam.x+VW)/TS));
  const y0=Math.max(0,Math.floor(cam.y/TS)), y1=Math.min(mapH-1,Math.floor((cam.y+VH)/TS));
  const t=state.time;
  if(state.floor>0){
    const th=THEMES[state.floor];
    const sealSet=state.sealSet;
    const sealOn=!!(sealSet && sealSet.size && !state.sealOpen);
    const wp=wallPat(th), fp=floorPat(th);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const tl=tiles[ty*mapW+tx], v=tileVar[ty*mapW+tx];
      const px=tx*TS-cam.x, py=ty*TS-cam.y;
      if(tl===T_WALL || tl===T_SECRET){
        // photographic-ish stone blocks from the generated material
        ctx.fillStyle=wp; ctx.fillRect(px,py,TS,TS);
        // per-tile tonal variation breaks the repeat
        const sh=(v-0.5)*0.30;
        ctx.fillStyle=sh>0?`rgba(255,240,220,${sh})`:`rgba(0,0,0,${-sh})`;
        ctx.fillRect(px,py,TS,TS);
        // grime gathers at floor level
        if(tileAt(tx,ty+1)===T_FLOOR){
          const gr=ctx.createLinearGradient(0,py+TS-12,0,py+TS);
          gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.38)');
          ctx.fillStyle=gr; ctx.fillRect(px,py+TS-12,TS,12);
        }
        // 2.5D front face: walls show their face toward the camera
        if(tileAt(tx,ty+1)!==T_WALL){
          const fh=12;
          ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(px,py+TS-fh,TS,fh);
          ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(px,py+TS-fh,TS,2);
          ctx.fillStyle='rgba(0,0,0,0.5)';
          ctx.fillRect(px+((hash2(tx*3,ty*7)*TS)|0)%TS,py+TS-fh+3,2,fh-3);
        }
        // top cap when nothing above (raised block look)
        if(tileAt(tx,ty-1)!==T_WALL){
          ctx.fillStyle=th.wallTop; ctx.fillRect(px,py,TS,5);
          ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(px,py,TS,1);
          ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(px,py+5,TS,1);
        }
        // cracked secret wall: faint fracture lines, no obvious door
        if(tl===T_SECRET){
          ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=1.4;
          ctx.beginPath();
          ctx.moveTo(px+7,py+3); ctx.lineTo(px+12,py+13); ctx.lineTo(px+9,py+21);
          ctx.lineTo(px+16,py+29);
          ctx.moveTo(px+25,py+4); ctx.lineTo(px+21,py+12); ctx.lineTo(px+24,py+18);
          ctx.stroke();
          ctx.fillStyle='rgba(196,107,255,0.10)'; ctx.fillRect(px+7,py+20,11,4);
        }
        // Ember Seal runes pulse until the floor is cleared
        if(sealOn && sealSet.has(tx+','+ty)){
          const gl=0.5+0.5*Math.sin(t*3.2+(tx*0.7+ty*1.3));
          ctx.fillStyle=`rgba(255,90,40,${0.10+gl*0.22})`; ctx.fillRect(px,py,TS,TS);
          ctx.strokeStyle=`rgba(255,150,70,${0.30+gl*0.45})`; ctx.lineWidth=1.6;
          ctx.strokeRect(px+2.5,py+2.5,TS-5,TS-5);
          ctx.fillStyle=`rgba(255,190,110,${0.30+gl*0.40})`;
          ctx.fillRect(px+TS/2-1.5,py+TS/2-1.5,3,3);
        }
        continue;
      }
      if(tl===T_LAVA){
        // layered molten flow: deep crust, bright current, bubbles
        const sh=Math.sin(t*2.2+tx*0.8+ty*1.1)*0.5+0.5;

        ctx.fillStyle=`rgb(${168+sh*70|0},${44+sh2*42|0},10)`;
        ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle=`rgba(255,${150+sh2*80|0},40,${0.16+sh*0.22})`;
        ctx.fillRect(px,py+((v*20)|0),TS,3);
        if(v>0.45){
          const gl=0.5+0.5*Math.sin(t*4+tx*2+ty*3);

          ctx.fillRect(px+6+v*14,py+8+((v*37)%12),5,3);
          ctx.fillRect(px+18,py+20-gl*4,4,3);
        }

        const glow=0.22+0.14*Math.sin(t*3.4+tx*1.7+ty*0.9);
        ctx.strokeStyle=`rgba(255,170,70,${glow})`; ctx.lineWidth=3;
        ctx.strokeRect(px+1.5,py+1.5,TS-3,TS-3);
        continue;
      }
      if(tl===T_STAIRSDOWN){
        ctx.fillStyle='#0c0a0e'; ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle='#241f1a';
        for(let i=0;i<4;i++) ctx.fillRect(px+4+i*6,py+4+i*6,TS-8-i*12,TS-8-i*12);
        const gl=0.5+0.5*Math.sin(t*3);
        ctx.strokeStyle=`rgba(255,120,60,${0.25+gl*0.35})`; ctx.lineWidth=2;
        ctx.strokeRect(px+3,py+3,TS-6,TS-6);
        continue;
      }
      if(tl===T_STAIRSUP){
        ctx.fillStyle='#241f1a'; ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle='#4a4038';
        for(let i=0;i<4;i++) ctx.fillRect(px+12-i*3,py+12-i*3,8+i*6,8+i*6);
        const gl=0.5+0.5*Math.sin(t*2.4);
        ctx.strokeStyle=`rgba(255,215,120,${0.2+gl*0.3})`; ctx.lineWidth=2;
        ctx.strokeRect(px+2,py+2,TS-4,TS-4);
        continue;
      }
      // floor slabs
      ctx.fillStyle=fp; ctx.fillRect(px,py,TS,TS);
      const sh=(v-0.5)*0.24;
      ctx.fillStyle=sh>0?`rgba(255,240,220,${sh})`:`rgba(0,0,0,${-sh})`;
      ctx.fillRect(px,py,TS,TS);
      if(v>0.90){ // loose grit
        ctx.fillStyle='rgba(200,190,170,0.22)';
        ctx.fillRect(px+v*20,py+10,2,2); ctx.fillRect(px+19,py+v*16,2,2);
      }
      if(v<0.05){ // hairline tile crack
        ctx.strokeStyle='rgba(0,0,0,0.32)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px+6,py+7); ctx.lineTo(px+13,py+15); ctx.lineTo(px+11,py+24); ctx.stroke();
      }
      // ambient occlusion — walls cast soft shadows onto the floor
      if(tileAt(tx,ty-1)===T_WALL){
        ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(px,py,TS,7);
        ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.fillRect(px,py+7,TS,5);
      }
      if(tileAt(tx,ty+1)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.26)'; ctx.fillRect(px,py+TS-6,TS,6); }
      if(tileAt(tx-1,ty)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.fillRect(px,py,5,TS); }
      if(tileAt(tx+1,ty)===T_WALL){ ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.fillRect(px+TS-5,py,5,TS); }
    }
    return;
  }
  /* surface */
  const pats={};
  const patFor=tl=>{ const key=BIOME_TEX[tl]||'grass'; if(!pats[key]) pats[key]=surfacePat(key); return pats[key]; };
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const tl=tiles[ty*mapW+tx], v=tileVar[ty*mapW+tx];
    const px=tx*TS-cam.x, py=ty*TS-cam.y;
    if(tl===T_WATER){
      const sh=Math.sin(t*1.5+tx*0.9+ty*1.3)*0.5+0.5;
      const sh2=Math.sin(t*0.9-tx*0.6+ty*0.8)*0.5+0.5;
      ctx.fillStyle=`rgb(${30+sh*16|0},${88+sh2*26|0},${150+sh*34|0})`;
      ctx.fillRect(px,py,TS,TS);
      // caustic shimmer
      ctx.fillStyle=`rgba(160,230,255,${0.05+sh*0.07})`;
      ctx.fillRect(px,py,TS,TS);
      if(v>0.62){
        ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        const wy=py+8+v*16+Math.sin(t*2+tx)*2;
        ctx.moveTo(px+5,wy); ctx.quadraticCurveTo(px+12,wy-3,px+19,wy);
        ctx.stroke();
      }
      continue;
    }
    if(tl===T_SAND||tl===T_DESERT){
      ctx.fillStyle=patFor(tl); ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=`rgba(255,244,210,${(v-0.5)*0.12})`;
      ctx.fillRect(px,py,TS,TS);
      if(tl===T_DESERT && v>0.93){ // dune crest
        ctx.strokeStyle='rgba(160,110,50,0.35)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(px+6,py+22); ctx.quadraticCurveTo(px+16,py+16,px+26,py+22); ctx.stroke();
      }
      continue;
    }
    if(tl===T_CORRUPT){
      ctx.fillStyle=patFor(tl); ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=`rgba(30,0,40,${(v-0.5)*0.18})`;
      ctx.fillRect(px,py,TS,TS);
      if(v>0.86){
        const gl=0.5+0.5*Math.sin(t*3+tx+ty);
        ctx.fillStyle=`rgba(255,${100+gl*80|0},40,${0.35+gl*0.4})`;
        ctx.fillRect(px+10,py+12,3,3); ctx.fillRect(px+18,py+20,2,2);
      }
      continue;
    }
    if(tl===T_LAVA){
      const sh=Math.sin(t*2.2+tx*0.8+ty*1.1)*0.5+0.5;
      ctx.fillStyle=`rgb(${168+sh*70|0},${44+sh*42|0},10)`;
      ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=`rgba(255,170,70,${0.18+sh*0.2})`;
      ctx.fillRect(px,py,TS,TS);
      continue;
    }
    if((tl>=T_SNOW && tl!==T_STAIRSDOWN)||(tl===T_DESERT)){
      ctx.fillStyle=patFor(tl); ctx.fillRect(px,py,TS,TS);
      const sh=(v-0.5)*0.16;
      ctx.fillStyle=sh>0?`rgba(255,255,255,${sh})`:`rgba(0,0,20,${-sh})`;
      ctx.fillRect(px,py,TS,TS);
      if(tl===T_SNOW && v>0.9){
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.fillRect(px+v*22,py+9,2.5,2.5);
      }
      if(tl===T_CHERRY && v>0.55 && Math.random()<0.02)
        parts.push({x:tx*TS+rnd(0,TS),y:ty*TS+rnd(0,TS)-6,vx:rnd(-8,8),vy:rnd(10,24),life:rnd(0.7,1.4),max:1.4,color:'#ffb7cf',size:2.2,grav:3});
      if(tl===T_MISTWOOD && v>0.5 && v<0.7){
        ctx.fillStyle='rgba(200,215,230,0.10)';
        ctx.fillRect(px,py,TS,TS);
      }
      if(tl===T_SAVANNA && v>0.6){
        ctx.strokeStyle='rgba(150,120,40,0.4)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(px+7,py+8+v*10); ctx.lineTo(px+10,py+2); ctx.stroke();
      }
      if(tl===T_SWAMP && v>0.88){ // fetid bubble
        const bl=(state.time*0.7+v*7)%1;
        ctx.strokeStyle=`rgba(120,180,110,${0.4-(bl*0.4)})`; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(px+8+v*15,py+10+v*12,2+bl*3,0,TAU); ctx.stroke();
      }
      if(tl===T_MUSH && v>0.9){
        const gl=0.5+0.5*Math.sin(t*2.4+tx*2+ty);
        ctx.fillStyle=`rgba(150,255,220,${0.3+gl*0.35})`;
        ctx.fillRect(px+10,py+16,2.5,2.5); ctx.fillRect(px+20,py+9,2,2);
      }
      if(tl===T_CRIMSON && v>0.88){
        const gl=0.5+0.5*Math.sin(t*3+tx-ty);
        ctx.fillStyle=`rgba(255,110,90,${0.3+gl*0.3})`;
        ctx.fillRect(px+14,py+13,2,2);
      }
      if(tl===T_ASH && v>0.92){
        const gl=0.5+0.5*Math.sin(t*4+tx+ty*2);
        ctx.fillStyle=`rgba(255,${120+gl*70|0},50,${0.35+gl*0.35})`;
        ctx.fillRect(px+9,py+10,2,2); ctx.fillRect(px+21,py+19,1.6,1.6);
      }
      continue;
    }
    if(tl===T_STAIRSDOWN){
      ctx.fillStyle='#0c0a0e'; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle='#241f1a';
      for(let i=0;i<4;i++) ctx.fillRect(px+4+i*6,py+4+i*6,TS-8-i*12,TS-8-i*12);
      const gl=0.5+0.5*Math.sin(t*3);
      ctx.strokeStyle=`rgba(180,80,255,${0.25+gl*0.35})`; ctx.lineWidth=2;
      ctx.strokeRect(px+3,py+3,TS-6,TS-6);
      continue;
    }
    // grass
    ctx.fillStyle=patFor(T_GRASS); ctx.fillRect(px,py,TS,TS);
    const sh=(v-0.5)*0.18;
    ctx.fillStyle=sh>0?`rgba(210,255,190,${sh})`:`rgba(0,20,10,${-sh})`;
    ctx.fillRect(px,py,TS,TS);
    if(v>0.72){
      ctx.strokeStyle='rgba(26,74,30,0.5)'; ctx.lineWidth=1.4;
      ctx.beginPath();
      const bx=px+4+v*20, by=py+8+v*16;
      ctx.moveTo(bx,by+5); ctx.lineTo(bx-1.5,by);
      ctx.moveTo(bx+4,by+5); ctx.lineTo(bx+5,by+0.5);
      ctx.stroke();
    }
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function shadowEllipse(x,y,rx,ry){
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); ctx.fill();
}
function drawFlowers(){
  const t=state.time;
  for(const f of flowers){
    const sx=f.x-cam.x, sy=f.y-cam.y;
    if(sx<-20||sy<-20||sx>VW+20||sy>VH+20) continue;
    const sway=Math.sin(t*2+f.sway)*1.5;
    ctx.strokeStyle='#2c6e2c'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx,sy+4); ctx.lineTo(sx+sway,sy-3); ctx.stroke();
    ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.arc(sx+sway,sy-4,2.6,0,TAU); ctx.fill();
  }
}
function drawRockOne(rk){

function drawRockOne(rk){

  else if(rk.mud){ base='#4c4a38'; }
  else if(rk.crimsonrock){ base='#9a4438'; }

  if(rk.mesa){ // sediment strata
    ctx.strokeStyle='rgba(120,60,30,0.5)'; ctx.lineWidth=1.3;

    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(sx-2,sy-rk.r*0.8); ctx.lineTo(sx-1,sy+rk.r*0.3); ctx.stroke();
  }

const TREE_KINDS={pine:1,cactus:1,dead:1,mush:1,crystal:1,burnt:1,acacia:1,palm:1,cherry:1,mist:1,corrupt:1,oak:1};

function drawBuildings(){
  for(const b of buildings){
    const sx=b.x-cam.x, sy=b.y-cam.y;
    if(sx<-120||sy<-120||sx>VW+120||sy>VH+120) continue;
    if(b.well){
      ctx.fillStyle='#6e6e78'; ctx.fillRect(sx,sy,b.w,b.h);
      ctx.fillStyle='#3d3d44'; ctx.beginPath(); ctx.ellipse(sx+b.w/2,sy+b.h/2,b.w*0.32,b.h*0.26,0,0,TAU); ctx.fill();

      continue;
    }
    if(b.stall){
      ctx.fillStyle='#7a5a3a'; ctx.fillRect(sx,sy,b.w,b.h);
      for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#e8e0d0':'#c8452f';
        ctx.fillRect(sx-6+i*(b.w+12)/6, sy-16, (b.w+12)/6, 12); }
      ctx.fillStyle='#5a4028'; ctx.fillRect(sx-4,sy-18,3,20); ctx.fillRect(sx+b.w+1,sy-18,3,20);
      continue;
    }
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(sx+4,sy+b.h-2,b.w,8);
    /* plank wall with vertical grain + bottom wear */
    ctx.fillStyle=b.wall; ctx.fillRect(sx,sy,b.w,b.h);
    ctx.strokeStyle='rgba(90,70,45,0.22)'; ctx.lineWidth=1;
    for(let px=sx+8;px<sx+b.w-4;px+=8){
      ctx.beginPath(); ctx.moveTo(px,sy+3); ctx.lineTo(px,sy+b.h-3); ctx.stroke();
    }
    ctx.fillStyle='rgba(0,0,20,0.14)';
    ctx.fillRect(sx,sy+b.h-8,b.w,8);
    ctx.strokeStyle='rgba(90,70,45,0.5)'; ctx.lineWidth=2; ctx.strokeRect(sx+1,sy+1,b.w-2,b.h-2);
    /* plank door with frame + handle */
    if(b.door){
      ctx.fillStyle='#4a2e1a'; ctx.fillRect(sx+b.w/2-12,sy+b.h-32,24,32);
      ctx.fillStyle='#5a3a22'; ctx.fillRect(sx+b.w/2-10,sy+b.h-30,20,30);
      ctx.strokeStyle='rgba(30,18,10,0.5)'; ctx.lineWidth=1;
      for(let dx=-6;dx<=6;dx+=6){
        ctx.beginPath(); ctx.moveTo(sx+b.w/2+dx,sy+b.h-30); ctx.lineTo(sx+b.w/2+dx,sy+b.h); ctx.stroke();
      }
      ctx.fillStyle='#c8a44a'; ctx.beginPath(); ctx.arc(sx+b.w/2+5,sy+b.h-15,2,0,TAU); ctx.fill();
    }
    /* windows glow warm against the dusk */
    const flick=0.72+0.28*Math.sin(state.time*5+b.x*0.01);
    ctx.fillStyle=`rgba(255,196,110,${0.8*flick})`;
    ctx.fillRect(sx+12,sy+14,14,14); ctx.fillRect(sx+b.w-26,sy+14,14,14);
    ctx.fillStyle='rgba(255,240,190,0.35)';
    ctx.fillRect(sx+17,sy+14,3,14); ctx.fillRect(sx+b.w-21,sy+14,3,14);
    ctx.strokeStyle='#5a3a22'; ctx.lineWidth=2;
    ctx.strokeRect(sx+12,sy+14,14,14); ctx.strokeRect(sx+b.w-26,sy+14,14,14);
    /* shingled roof: rows of scallops + ridge highlight */
    const ridge=sy-b.h*0.55;

    ctx.beginPath();
    ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,ridge); ctx.lineTo(sx+b.w+10,sy); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,ridge); ctx.lineTo(sx+b.w+10,sy); ctx.closePath(); ctx.clip();
    for(let row=0;row<6;row++){

      ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1.4;
      ctx.beginPath();
      for(let px=sx-8;px<sx+b.w+10;px+=9) ctx.arc(px+4.5,ry,4.5,Math.PI,TAU);

    ctx.fillStyle='rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,ridge); ctx.lineTo(sx+b.w/2,sy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(40,24,14,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx-10,sy); ctx.lineTo(sx+b.w/2,ridge); ctx.lineTo(sx+b.w+10,sy); ctx.stroke();
    /* stone chimney with a lazy smoke thread */
    const chx=sx+b.w-14, chy=ridge+8;
    ctx.fillStyle='#6a6a72'; ctx.fillRect(chx,chy,8,sy-chy-6);
    ctx.fillStyle='#7d7d88'; ctx.fillRect(chx-1,chy-4,10,5);
    if(Math.random()<0.06) parts.push({x:b.x+b.w-10,y:b.y-b.h*0.55+4,vx:rnd(-4,4),vy:-14,life:1.6,max:1.6,color:'rgba(200,200,210,0.35)',size:3,grav:-6});
  }
}

/* ---------------- pixel-art hero ----------------
   Hand-placed 24x24 pixel sprite (facing right, flipped when moving left),
   painted onto an offscreen canvas at load time. No external assets.           */
let PLAYER_TEX=null;
const PX_W=24, PX_H=24, PX_SCALE=2;   // 24x24 tex drawn at 48x48 for a readable hero
function makePlayerTex(){
  const cv=document.createElement('canvas'); cv.width=PX_W; cv.height=PX_H;
  const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  const C={' ':null,'.':'#ffffff','s':'#f0c49a','S':'#e0b88a','h':'#5a3a1e','H':'#3e2512','e':'#222222','t':'#4a80e8','T':'#2c56a8','b':'#5a3a22','B':'#ffd75e','l':'#3a2a1c','L':'#221a12','c':'#a33b3b','C':'#7a2525','w':'#c8a44a','W':'#a88a32'};
  const ROWS=['                        ','     HHHH               ','    hhhhH               ','   hhHHHh               ','  hHSeesHh              ','   hHHHHh               ','    HHHH                ','    cccccc              ','   cTTTTTTcc            ','   cTTttTTcc            ','   cTTBBTTcc            ','   cTTBBTTcc            ','   cTTTTTTcc            ','    cccc                ','     llll               ','     llll               ','    ll  ll              ','    ll  ll              ','                        ','                        ','                        ','                        ','       wwwww            ','       W    w           '];
  for(let y=0;y<ROWS.length;y++)for(let x=0;x<ROWS[y].length;x++){const col=C[ROWS[y][x]];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1);}
  return cv;
}
function drawSlash(sx,sy,prog,dir){
  const a0=dir-1.5, a1=dir+1.0, a=lerp(a0,a1,prog);
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=4; ctx.lineCap='round';

  ctx.strokeStyle='rgba(255,215,94,0.9)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*22,sy+Math.sin(a)*22); ctx.lineTo(sx+Math.cos(a)*44,sy+Math.sin(a)*44); ctx.stroke();
}
function drawPlayer(){
  const p=player;
  const sx=p.x-cam.x, sy=p.y-cam.y;
  const bob=p.moving?Math.sin(p.walkT)*1.6:Math.sin(state.time*2.2)*0.8;
  const blink = p.invulnT>0 && (Math.floor(state.time*14)%2===0);
  if(blink && state.mode==='play') return;
  if(!PLAYER_TEX) PLAYER_TEX=makePlayerTex();
  const flip = p.face.x<0;
  const sw=PX_W*PX_SCALE, sh=PX_H*PX_SCALE;
  ctx.save();
  ctx.translate(sx-sw/2+2, sy-sh/2-6+bob);
  ctx.scale(flip?-1:1, 1);
  if(flip) ctx.translate(-sw, 0);

  ctx.drawImage(PLAYER_TEX,0,0,PX_W,PX_H,0,0,sw,sh);
  ctx.imageSmoothingEnabled=true;

    /* the hero holds the warden bow: limbs, string and a drawn arrow */
    const fa=(p.face.x||p.face.y)?Math.atan2(p.face.y,p.face.x):0;
    const drawing=p.bowDraw>0;
    const prog=drawing?1-p.bowDraw/0.38:0;

    ctx.beginPath();
    ctx.moveTo(-2,-13); ctx.lineTo(-2,13);

    ctx.strokeStyle=drawing?'#e8e2d0':'#a89878'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-2,-13); ctx.lineTo(pullX,0); ctx.lineTo(-2,13); ctx.stroke();

    ctx.beginPath(); ctx.arc(sx,sy,42,a0,a); ctx.stroke();
    ctx.strokeStyle='rgba(255,215,94,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*22,sy+Math.sin(a)*22);

  }

  if(p.whirlT>0){
    const pr=1-p.whirlT/0.35;
    ctx.strokeStyle=`rgba(255,179,107,${0.8-pr*0.6})`; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(sx,sy,46,pr*TAU*1.6,pr*TAU*1.6+2.4); ctx.stroke();

  if(p.drink){
    const def=IDEF[p.drink.slot&&p.drink.slot.id||'p_health']||IDEF.p_health;
    const prog=clamp(p.drink.t/p.drink.max,0,1);

    ctx.translate(sx+5,sy-6+bob);
    ctx.rotate(-0.7+prog*0.6);
    ctx.fillStyle=def.color; roundRect(-3,-6,6,11,2.5); ctx.fill();
    ctx.fillStyle='#c8c8d0'; ctx.fillRect(-1.5,-9,3,3);
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillRect(-2,-4,2,6);
    ctx.restore();

    ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(sx,sy-28,9,0,TAU); ctx.stroke();
    ctx.strokeStyle=def.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx,sy-28,9,-Math.PI/2,-Math.PI/2+prog*TAU); ctx.stroke();

const BEAST_TYPES=new Set(['zombie','wolf','direwolf','spider','scorpion','yeti','sporecap','imp','muck','bandit','hound','shade','mimic','boar','vulture','leech','hornet','ape','sprite','frostwisp','wisp','emberite']);
function drawEnemy(e){

    case 'sporecap':{

    case 'mimic':{

      if(e.hidden===false){

    case 'boar':{
      const dir=player.x>e.x?1:-1;

      ctx.beginPath(); ctx.ellipse(sx,sy,13,8.5,0,0,TAU); ctx.fill();
      ctx.fillStyle=flash?'#fff':'#573c2e';
      ctx.beginPath(); ctx.arc(sx+dir*11,sy-2,5.6,0,TAU); ctx.fill();
      ctx.fillStyle='#ffd75e';
      ctx.beginPath(); ctx.moveTo(sx+dir*13,sy-7); ctx.lineTo(sx+dir*16,sy-11); ctx.lineTo(sx+dir*15,sy-6); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#2c2018';
      ctx.beginPath(); ctx.arc(sx-9,sy-4,1.3,0,TAU); ctx.arc(sx-12,sy-2,1.3,0,TAU); ctx.fill();

    case 'vulture':{
      const flap=Math.sin(ph*2.1)*0.8;
      ctx.fillStyle=flash?'#fff':'#5e5148';
      for(const s of [-1,1]){
        ctx.beginPath();
        ctx.moveTo(sx,sy-2); ctx.lineTo(sx+s*14,sy-6-flap*6); ctx.lineTo(sx+s*15,sy+1+flap*4);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle=flash?'#fff':'#6e6158';
      ctx.beginPath(); ctx.ellipse(sx,sy,8,6,0,0,TAU); ctx.fill();
      ctx.fillStyle='#e26d5a';

      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(sx-1,sy-7,0.8,0,TAU); ctx.arc(sx+1,sy-7,0.8,0,TAU); ctx.fill();

    case 'leech':{

    case 'ape':{
      ctx.fillStyle=flash?'#fff':'#4a3527';
      roundRect(sx-12,sy-11,24,24,7); ctx.fill();
      ctx.fillStyle='#5a4030';
      ctx.beginPath(); ctx.arc(sx-9,sy+2,5,0,TAU); ctx.arc(sx+9,sy+2,5,0,TAU); ctx.fill();
      ctx.fillStyle='#c8a076';
      ctx.beginPath(); ctx.arc(sx,sy-13,6.4,0,TAU); ctx.fill();
      ctx.fillStyle='#3e2c1e';
      ctx.beginPath(); ctx.arc(sx,sy-16,4.6,Math.PI,TAU); ctx.fill();

  }

function drawBoss(){
  const b=state.boss; if(!b) return;
  const sx=b.x-cam.x, sy=b.y-cam.y;
  const t=state.time;
  if(b.telegraph>0){
    ctx.fillStyle='rgba(255,60,30,0.18)';
    ctx.beginPath(); ctx.arc(sx,sy,b.telegraphR,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,80,40,0.7)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx,sy,b.telegraphR*(1-b.telegraph/0.95),0,TAU); ctx.stroke();
  }
  if(b.kind==='pyrelord'&&b.telegraph>0){
    ctx.strokeStyle='rgba(255,80,40,0.5)'; ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(b.teleA)*280,sy+Math.sin(b.teleA)*280);
    ctx.stroke();
  }
  shadowEllipse(sx,sy+b.r*0.85,b.r*1.15,b.r*0.45);
  const flash=b.flash>0;
  const gl2=0.5+0.5*Math.sin(b.phase);
  if(b.kind==='boneking'){
    const bob=Math.sin(b.phase*0.7)*2;
    ctx.fillStyle='#241c28';
    ctx.beginPath();
    ctx.moveTo(sx-14,sy-10+bob); ctx.quadraticCurveTo(sx-20,sy+10+bob,sx-8,sy+14+bob);
    ctx.lineTo(sx+8,sy+14+bob); ctx.quadraticCurveTo(sx+20,sy+10+bob,sx+14,sy-10+bob);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=flash?'#fff':'#e8e8e0'; ctx.fillStyle=flash?'#fff':'#e8e8e0';
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(sx,sy-14+bob,9,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx,sy-4+bob); ctx.lineTo(sx,sy+8+bob);
    ctx.moveTo(sx-8,sy+bob); ctx.lineTo(sx+8,sy+bob);
    ctx.moveTo(sx-6,sy+5+bob); ctx.lineTo(sx+6,sy+5+bob);
    ctx.stroke();
    ctx.fillStyle='#ffd75e';
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*5-2,sy-22+bob);
      ctx.lineTo(sx+i*5,sy-30+bob);
      ctx.lineTo(sx+i*5+2,sy-22+bob);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#ff4b4b';
    ctx.beginPath(); ctx.arc(sx-3.5,sy-15+bob,1.8,0,TAU); ctx.arc(sx+3.5,sy-15+bob,1.8,0,TAU); ctx.fill();
    ctx.strokeStyle='#c8c8d0'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx+14,sy-6+bob); ctx.lineTo(sx+30,sy-20+bob); ctx.stroke();
  } else if(b.kind==='cindergolem'){
    const sq=1+Math.sin(b.phase)*0.06;
    ctx.fillStyle=flash?'#fff':'#4d3f45';
    ctx.beginPath(); ctx.ellipse(sx,sy+4,b.r*0.9*sq,b.r*0.85/sq,0,0,TAU); ctx.fill();
    ctx.fillStyle='#3a2f34';
    ctx.beginPath(); ctx.ellipse(sx,sy-b.r*0.4,b.r*0.6*sq,b.r*0.5/sq,0,0,TAU); ctx.fill();
    roundRect(sx-b.r-8,sy-8,14,20,5); ctx.fill();
    roundRect(sx+b.r-6,sy-8,14,20,5); ctx.fill();
    ctx.strokeStyle=`rgba(255,140,50,${0.55+gl2*0.4})`; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(sx-8,sy-10); ctx.lineTo(sx,sy-2); ctx.lineTo(sx-4,sy+10);
    ctx.moveTo(sx+8,sy-8); ctx.lineTo(sx+4,sy+4);
    ctx.stroke();
    ctx.fillStyle=`rgba(255,190,90,${0.7+gl2*0.3})`;
    ctx.beginPath(); ctx.arc(sx-6,sy-b.r*0.4,2.6,0,TAU); ctx.arc(sx+6,sy-b.r*0.4,2.6,0,TAU); ctx.fill();
  } else if(b.kind==='malachar'){
    const bob=Math.sin(b.phase*0.7)*3;
    ctx.globalAlpha=0.88;
    ctx.fillStyle=flash?'#fff':'#3c2a58';
    ctx.beginPath();
    ctx.moveTo(sx,sy-26+bob);
    ctx.quadraticCurveTo(sx+18,sy-6+bob,sx+13,sy+12+bob);
    ctx.lineTo(sx-13,sy+12+bob);
    ctx.quadraticCurveTo(sx-18,sy-6+bob,sx,sy-26+bob);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#241a38';
    ctx.beginPath(); ctx.arc(sx,sy-14+bob,8,0,TAU); ctx.fill();
    ctx.fillStyle='#c46bff';
    ctx.beginPath(); ctx.arc(sx-3,sy-15+bob,2,0,TAU); ctx.arc(sx+3,sy-15+bob,2,0,TAU); ctx.fill();
    ctx.strokeStyle='#5a4030'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx+15,sy-26+bob); ctx.lineTo(sx+19,sy+10+bob); ctx.stroke();
    ctx.fillStyle=`rgba(200,120,255,${0.6+gl2*0.4})`;
    ctx.beginPath(); ctx.arc(sx+15,sy-28+bob,4+gl2*1.5,0,TAU); ctx.fill();
  } else if(b.kind==='pyrelord'){
    for(let i=0;i<3;i++){
      const wob=Math.sin(t*6+i*2)*4;
      const rr=b.r*(1.05-i*0.28);
      ctx.fillStyle=flash?'#fff':['rgba(255,110,40,0.85)','rgba(255,190,80,0.9)','rgba(255,240,200,0.95)'][i];
      ctx.beginPath();
      ctx.moveTo(sx,sy-rr*1.2+wob);
      ctx.quadraticCurveTo(sx+rr,sy-rr*0.2,sx+rr*0.7,sy+rr*0.6);
      ctx.quadraticCurveTo(sx,sy+rr*0.9,sx-rr*0.7,sy+rr*0.6);
      ctx.quadraticCurveTo(sx-rr,sy-rr*0.2,sx,sy-rr*1.2+wob);
      ctx.fill();
    }
    ctx.fillStyle='#2a0d06';
    ctx.beginPath(); ctx.arc(sx-4,sy-2,2.2,0,TAU); ctx.arc(sx+4,sy-2,2.2,0,TAU); ctx.fill();
    if(Math.random()<0.5) parts.push({x:b.x+rnd(-14,14),y:b.y+rnd(-6,14),vx:rnd(-14,14),vy:rnd(-70,-30),life:rnd(0.3,0.7),max:0.7,color:'#ff9a3d',size:2.4,grav:-20});
  } else if(b.kind==='warden'){
    // corrupted warden: a hulking seal-keeper wreathed in void
    const sq=1+Math.sin(b.phase*0.8)*0.07;
    const gr=ctx.createRadialGradient(sx,sy,5,sx,sy,b.r*2);
    gr.addColorStop(0,'rgba(196,107,255,0.3)'); gr.addColorStop(1,'rgba(196,107,255,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sx,sy,b.r*2,0,TAU); ctx.fill();
    ctx.fillStyle=flash?'#fff':'#2e2338';
    ctx.beginPath(); ctx.ellipse(sx,sy,b.r*sq,b.r*0.9/sq,0,0,TAU); ctx.fill();
    ctx.fillStyle=flash?'#fff':'#453354';
    ctx.beginPath(); ctx.arc(sx,sy-b.r*0.5,b.r*0.5,0,TAU); ctx.fill();
    ctx.strokeStyle=flash?'#fff':'#c46bff'; ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*b.r*0.4,sy+b.r*0.2);
      ctx.lineTo(sx+i*b.r*0.34,sy-b.r*1.05-((i===0)?6:0));
      ctx.stroke();

function drawArrows(){
  ctx.lineCap='round';
  for(const a of arrows){
    const sx=a.x-cam.x, sy=a.y-cam.y;
    const l=Math.hypot(a.vx,a.vy)||1, nx=a.vx/l, ny=a.vy/l;
    const col = a.kind==='void'?'#c46bff' : a.kind==='fire'?'#ff8a3d' : a.kind==='rock'?'#9a938b' : a.kind==='spore'?'#7ec0a0' : a.kind==='frost'?'#8fd8ff' : a.friendly?'#ffe08a' : '#e8e2d0';
    if(a.kind==='fire'||a.kind==='void'||a.kind==='spore'||a.kind==='frost'||a.friendly){
      const gl=ctx.createRadialGradient(sx,sy,1,sx,sy,10);
      gl.addColorStop(0,a.kind==='fire'?'rgba(255,140,60,0.5)':a.kind==='spore'?'rgba(126,192,160,0.5)':a.kind==='frost'?'rgba(150,220,255,0.5)':a.friendly?'rgba(255,215,94,0.45)':'rgba(196,107,255,0.5)');
      gl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(sx,sy,10,0,TAU); ctx.fill();
    }
    ctx.strokeStyle=col;
    ctx.lineWidth=a.kind==='rock'?4:2.5;
    ctx.beginPath(); ctx.moveTo(sx-nx*8,sy-ny*8); ctx.lineTo(sx+nx*4,sy+ny*4); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(sx+nx*4,sy+ny*4,a.kind==='rock'?3:2,0,TAU); ctx.fill();
  }
}

/* ---------------- darkness, ray-traced lighting & shadows ----------------
   Two-stage ray tracing:
   1. each light source raycasts a visibility polygon (walls cast shadows);
   2. that light is clipped again by the PLAYER's own visibility polygon,
      and a light whose source has no line of sight to the player is skipped
      entirely — so torchlight never shows up through a wall or around a
      corner into a corridor you cannot see.                                    */
const lightCvs=document.createElement('canvas');
const lightCtx=lightCvs.getContext('2d');

function lightBlocked(x,y){
  const t=tileAt(Math.floor(x/TS),Math.floor(y/TS));
  return t===T_WALL || t===T_SECRET;
}
/* marching ray from a to b; true when nothing but air/wall-face between */
function losClear(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0;
  const d=Math.hypot(dx,dy);
  if(d<1) return true;
  const n=Math.max(2,Math.ceil(d/(TS*0.32)));
  for(let i=1;i<n;i++){
    const t=i/n;
    if(lightBlocked(x0+dx*t, y0+dy*t)) return false;
  }
  return true;
}
/* cast N rays in a full circle, stopping at the first wall hit */
function visPoly(x,y,r,N=56){
  const pts=[], step=TS/3;
  for(let i=0;i<N;i++){
    const a=(i/N)*TAU, ca=Math.cos(a), sa=Math.sin(a);
    let hit=r, d=0;
    while(d<r){
      d+=step;
      if(d>=r) break;
      if(lightBlocked(x+ca*d,y+sa*d)){ hit=d-step*0.55; break; }
    }
    if(hit<4) hit=4;
    pts.push([x+ca*hit,y+sa*hit]);
  }
  return pts;
}
/* static lights (torches, lava, shrines, chests) keep their polygon cached */
function cacheVis(o,r,N=40,ox,oy){
  const x=ox!==undefined?ox:o.x, y=oy!==undefined?oy:o.y;
  if(o._vr!==r || o._vx!==x || o._vy!==y){
    o._vp=visPoly(x,y,r,N); o._vr=r; o._vx=x; o._vy=y;
  }
  return o._vp;
}

function drawDarkness(){
  const surface=state.floor===0;
  if(lightCvs.width!==VW||lightCvs.height!==VH){ lightCvs.width=VW; lightCvs.height=VH; }
  lightCtx.clearRect(0,0,VW,VH);
  if(surface){
    const night=Math.max(0,Math.cos(state.timeOfDay*Math.PI*2));  // 1 at midnight, 0 at noon
    const r=lerp(10,3,night), g2=lerp(13,4,night), b=lerp(26,9,night), a=lerp(0.42,0.78,night);
    lightCtx.fillStyle=`rgba(${r},${g2},${b},${a})`;
  } else lightCtx.fillStyle=THEMES[state.floor].fog;
  lightCtx.fillRect(0,0,VW,VH);
  lightCtx.globalCompositeOperation='destination-out';
  const t=state.time;

  const px=player.x-cam.x, py=player.y-cam.y;

  // player's own visibility - everything is clipped to what the player can see
  const reach=Math.max(surface?1150:900,150+42*player.lightLvl);
  const playerPoly=visPoly(player.x,player.y,reach,88);
  const clipPoly=(pts)=>{
    lightCtx.beginPath();
    lightCtx.moveTo(pts[0][0]-cam.x, pts[0][1]-cam.y);
    for(let i=1;i<pts.length;i++) lightCtx.lineTo(pts[i][0]-cam.x, pts[i][1]-cam.y);
    lightCtx.closePath();
    lightCtx.clip();
  };

  // punch a ray-traced hole that is both lit by the source and visible to the player
  const holeAt=(cx,cy,r,pts)=>{
    const sx=cx-cam.x, sy=cy-cam.y;
    if(sx<-r-24||sy<-r-24||sx>VW+r+24||sy>VH+r+24) return;
    lightCtx.save();
    clipPoly(playerPoly);
    if(pts) clipPoly(pts);
    const g=lightCtx.createRadialGradient(sx,sy,r*0.16,sx,sy,r);
    g.addColorStop(0,'rgba(0,0,0,1)');
    g.addColorStop(0.45,'rgba(0,0,0,0.85)');
    g.addColorStop(0.75,'rgba(0,0,0,0.42)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    lightCtx.fillStyle=g;
    lightCtx.fillRect(sx-r,sy-r,r*2,r*2);
    lightCtx.restore();
  };

  // lantern — moving light, rays recast every frame
  const pr=150+42*player.lightLvl;
  holeAt(player.x,player.y,pr,playerPoly);

  // torches — mounted on wall faces; cast from just in front of the wall
  for(const tr of torches){
    if(tr.x-cam.x<-170||tr.x-cam.x>VW+170||tr.y-cam.y<-170||tr.y-cam.y>VH+170) continue;
    const sd=tr.side||[0,0];
    const lx=tr.x+sd[0]*15, ly=tr.y+sd[1]*15;
    if(!losClear(player.x,player.y,lx,ly)) continue; // you cannot see this torch
    const r=112+12*Math.sin(t*7+tr.fl*9);
    holeAt(lx,ly,r,cacheVis(tr,124,44,lx,ly));
  }

  // surface extras: altar sigils, glowing cottage windows, lantern-lit villagers
  if(surface){
    for(const a of state.biomeAltars){
      if(a.done) continue;
      if(a.x-cam.x<-140||a.x-cam.x>VW+140||a.y-cam.y<-140||a.y-cam.y>VH+140) continue;
      if(!losClear(player.x,player.y,a.x,a.y-12)) continue;
      holeAt(a.x,a.y-12,92+10*Math.sin(t*2.6+a.x*0.01),cacheVis(a,110,36,a.x,a.y-12));
    }
    for(const b of buildings){
      if(b.well) continue;
      const wx=b.x+b.w/2, wy=b.y+b.h*0.42;
      if(wx-cam.x<-90||wx-cam.x>VW+90||wy-cam.y<-90||wy-cam.y>VH+90) continue;
      if(!losClear(player.x,player.y,wx,wy)) continue;
      holeAt(wx,wy,58+6*Math.sin(t*3+b.x),cacheVis(b,66,26,wx,wy));
    }
    for(const n of npcs){
      if(!losClear(player.x,player.y,n.x,n.y)) continue;
      holeAt(n.x,n.y,46,null);
    }
  }

  // lava - cached small glow, occluded + LOS gated
  for(const lv of lavas){
    if(lv.x-cam.x<-120||lv.x-cam.x>VW+120||lv.y-cam.y<-120||lv.y-cam.y>VH+120) continue;
    if(!losClear(player.x,player.y,lv.x,lv.y)) continue;
    holeAt(lv.x,lv.y,78+6*Math.sin(t*3+lv.x*0.01),cacheVis(lv,84,32));
  }

  for(const s of shrines){
    if(!losClear(player.x,player.y,s.x,s.y)) continue;
    const r=s.active?105:64;
    holeAt(s.x,s.y,r,cacheVis(s,r,36));
  }
  for(const c of chests){
    if(c.opened || !losClear(player.x,player.y,c.x,c.y)) continue;
    holeAt(c.x,c.y,42,cacheVis(c,46,28));
  }
  for(const e of enemies){
    if(!e.elite || !losClear(player.x,player.y,e.x,e.y)) continue;
    holeAt(e.x,e.y,60,null);
  }
  if(state.boss && losClear(player.x,player.y,state.boss.x,state.boss.y))
    holeAt(state.boss.x,state.boss.y,160,visPoly(state.boss.x,state.boss.y,160,48));
  if(state.portal && losClear(player.x,player.y,state.portal.x,state.portal.y))
    holeAt(state.portal.x,state.portal.y,118,visPoly(state.portal.x,state.portal.y,118,40));
  for(const d of drops){
    if(!losClear(player.x,player.y,d.x,d.y)) continue;
    holeAt(d.x,d.y,34,null);
  }

  lightCtx.globalCompositeOperation='source-over';
  ctx.drawImage(lightCvs,0,0);
}

let minimap=null;
function buildMinimap(){
  const W=mapW, H=mapH;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'), img=g.createImageData(W,H);
  for(let i=0;i<W*H;i++){
    const t=tiles[i];
    let col;
    if(state.floor===0){
      col = t===T_WATER?[38,92,150] : t===T_SAND?[205,185,130] : t===T_CORRUPT?[90,60,110] :
            t===T_STAIRSDOWN?[255,120,220] : t===T_LAVA?[255,106,42] :
            t===T_SNOW?[220,232,244] : t===T_DESERT?[226,178,98] : t===T_SWAMP?[92,104,66] :
            t===T_MUSH?[52,120,110] : t===T_CRIMSON?[122,38,46] : t===T_ASH?[86,82,88] :
            t===T_SAVANNA?[186,158,86] : t===T_JUNGLE?[34,110,44] : t===T_BADLANDS?[190,114,64] :
            t===T_CHERRY?[232,138,168] : t===T_VOLCANIC?[64,52,54] : t===T_MISTWOOD?[70,86,104] : [70,140,70];
    } else {
      const th=THEMES[state.floor];
      col = t===T_WALL?[24,20,18] : t===T_SECRET?[52,36,50] : t===T_LAVA?[255,106,42] :
            t===T_STAIRSDOWN?[255,215,94] : t===T_STAIRSUP?[126,231,135] :
            [parseInt(th.floorHi.slice(1,3),16),parseInt(th.floorHi.slice(3,5),16),parseInt(th.floorHi.slice(5,7),16)];
    }
    img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  minimap=c;
}

function wrapText(txt,x,y,maxW,lh){
  const words=txt.split(' '); let line='', yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t;
  }
  ctx.fillText(line,x,yy);
}

  ctx.fillText('The Ember Tyrant is no more. All five guardians lie slain.',VW/2,VH*0.34+36);
  ctx.font='bold 15px system-ui'; ctx.fillStyle='#ffd75e';
  ctx.fillText('Level '+player.level+'  ·  '+player.gold+' gold  ·  '+killCount+' foes slain  ·  '+Math.floor(playTime/60)+'m '+Math.floor(playTime%60)+'s',VW/2,VH*0.34+70);
  const bl=0.6+0.4*Math.sin(state.time*3);
  ctx.fillStyle=`rgba(255,255,255,${bl})`; ctx.font='bold 15px system-ui';
  ctx.fillText('— Press ENTER to keep exploring (a purple portal leads home) —',VW/2,VH*0.34+104);
}
function drawPaused(){
  ctx.fillStyle='rgba(8,10,18,0.6)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.font='bold 40px Georgia,serif'; ctx.fillStyle='#e8e8f0';
  ctx.fillText('PAUSED',VW/2,VH/2-10);
  ctx.font='14px system-ui'; ctx.fillStyle='#c9d1d9';
  ctx.fillText('Press P to resume',VW/2,VH/2+24);
}
function drawTrans(){
  if(!state.trans) return;
  const a=clamp(state.trans.t,0,1);
  ctx.fillStyle=`rgba(5,4,8,${a})`;
  ctx.fillRect(0,0,VW,VH);
}

/* ---------------- floor cinematic (Roblox-Doors style) ---------------- */
function spacedText(txt,cx,y,size,color,weight='bold'){
  ctx.save();
  ctx.font=weight+' '+size+'px Georgia,serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(255,120,40,0.75)'; ctx.shadowBlur=18;
  ctx.fillStyle=color;
  const sp=size*0.38;
  let w=0;
  for(const ch of txt) w+=ctx.measureText(ch).width+sp;
  w-=sp;
  let x=cx-w/2;
  for(const ch of txt){ ctx.fillText(ch,x,y); x+=ctx.measureText(ch).width+sp; }
  ctx.restore();
}
function drawCine(){
  const c=state.cine; if(!c) return;
  const tt=c.t/c.dur;
  const a= tt<0.16 ? tt/0.16 : tt>0.84 ? Math.max(0,(1-tt)/0.16) : 1;
  ctx.fillStyle=`rgba(3,2,5,${0.88*a})`;
  ctx.fillRect(0,0,VW,VH);
  if(a<=0.02) return;
  ctx.save();
  ctx.globalAlpha=a;
  // drifting embers
  for(let i=0;i<26;i++){
    const x=((hash2(i,4)*VW + state.time*14*(0.35+hash2(i,8)))%(VW+30))-15;
    const y=VH-((state.time*(26+hash2(i,6)*46)+hash2(i,2)*VH)%(VH+40));
    ctx.fillStyle=`rgba(255,${120+hash2(i,5)*70|0},50,${0.18+0.22*Math.abs(Math.sin(state.time*3+i))})`;
    ctx.fillRect(x,y,2.5,2.5);
  }
  // thin frame rules
  ctx.strokeStyle='rgba(255,140,70,0.35)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(VW*0.28,VH*0.31); ctx.lineTo(VW*0.72,VH*0.31);
  ctx.moveTo(VW*0.28,VH*0.655); ctx.lineTo(VW*0.72,VH*0.655);
  ctx.stroke();
  const slide=(1-Math.min(1,tt/0.16))*26;
  spacedText(c.head,VW/2,VH*0.415+slide,46,'#ffe08a');
  if(c.title) spacedText(c.title,VW/2,VH*0.525,25,'#ff8a5e');
  if(c.sub){
    ctx.font='italic 17px Georgia,serif'; ctx.fillStyle='#c9d1d9'; ctx.textAlign='center';
    ctx.fillText('— '+c.sub+' —',VW/2,VH*0.60);
  }
  ctx.font='10px system-ui'; ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.textAlign='center';
  ctx.fillText('CLEAR EVERY FOE TO BREAK THE EMBER SEAL',VW/2,VH-46);
  ctx.restore();
}

/* ---------------- inventory overlay (I) + hotbar HUD ---------------- */
let heldStack=null, invHover=null, hoverTip=null;
/* item tooltip: hovered hotbar/inventory slot spells out what it is */
function drawItemTooltip(){
  if(!hoverTip) return;
  const {slot,x,y}=hoverTip, def=IDEF[slot.id];
  if(!def) return;
  const label=def.name+(slot.count>1?'  x'+slot.count:'');
  ctx.font='bold 12px system-ui';
  const w=Math.max(150, ctx.measureText(label).width+22, def.desc?ctx.measureText(def.desc).width+22:0);
  const h=def.desc?46:28;
  let tx=clamp(x-w/2,8,VW-w-8), ty=y+10;
  if(ty+h>VH-8) ty=y-h-10;
  ctx.fillStyle='rgba(8,10,16,0.94)'; roundRect(tx,ty,w,h,7); ctx.fill();
  ctx.strokeStyle=def.color; ctx.lineWidth=1.2; roundRect(tx,ty,w,h,7); ctx.stroke();
  ctx.fillStyle=def.color; ctx.textAlign='left';
  ctx.fillText(label,tx+10,ty+18);
  if(def.desc){ ctx.fillStyle='#c9d1d9'; ctx.font='11px system-ui'; ctx.fillText(def.desc,tx+10,ty+35); }
}
function drawSlotBox(x,y,s,slot,hl){
  ctx.fillStyle=hl?'rgba(255,215,94,0.28)':'rgba(255,255,255,0.07)';
  roundRect(x,y,s,s,5); ctx.fill();
  ctx.strokeStyle=hl?'rgba(255,215,94,0.9)':'rgba(255,255,255,0.16)';
  ctx.lineWidth=hl?2:1; roundRect(x,y,s,s,5); ctx.stroke();
  if(slot){
    const def=IDEF[slot.id];
    ctx.font='bold 17px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=def.color; ctx.fillText(def.icon,x+s/2,y+s/2+1);
    if(slot.count>1){
      ctx.font='bold 10px system-ui'; ctx.textAlign='right';
      ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=2.4;
      ctx.strokeText(''+slot.count,x+s-3,y+s-7);
      ctx.fillStyle='#fff'; ctx.fillText(''+slot.count,x+s-3,y+s-7);
    }
    ctx.textBaseline='alphabetic';
  }
}
function drawHotbarHUD(){
  const n=HOTN, s=Math.min(40,(VW-40)/n-6), gap=5;
  const total=n*s+(n-1)*gap;
  const x0=VW-total-16, y0=14;   // Fortnite-style: top-right, above the minimap
  if(!state.inv) hoverTip=null;
  ctx.fillStyle='rgba(8,10,16,0.55)';
  roundRect(x0-8,y0-8,total+16,s+16,10); ctx.fill();
  for(let i=0;i<n;i++){
    const x=x0+i*(s+gap);
    drawSlotBox(x,y0,s,player.hotbar[i],player.sel===i);
    // chug progress floods the slot being drunk
    if(player.drink && player.drink.slot===player.hotbar[i]){
      const prog=clamp(player.drink.t/player.drink.max,0,1);
      ctx.fillStyle='rgba(0,0,0,0.55)';
      roundRect(x,y0+s*(1-prog),s,s*prog,5); ctx.fill();
    }
    if(!state.inv && player.hotbar[i] && mouse.x>=x&&mouse.x<x+s&&mouse.y>=y0&&mouse.y<y0+s)
      hoverTip={slot:player.hotbar[i],x,y:y0+s};
    ctx.font='bold 9px system-ui'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText(''+(i+1),x+3,y0+10);
  }
}
function fmtClock(s){
  s=Math.max(0,Math.ceil(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
/* effect chips — icons + minutes:seconds, stacked right above the health bar */
function drawFXHUD(){
  let chipY=104;
  const p=player;
  const chip=(color,icon,label,w)=>{
    ctx.fillStyle='rgba(10,12,18,0.74)'; roundRect(14,chipY,w,22,6); ctx.fill();
    ctx.strokeStyle=color; ctx.lineWidth=1.2; roundRect(14,chipY,w,22,6); ctx.stroke();
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(26,chipY+11,7,0,TAU); ctx.fill();
    ctx.fillStyle='#14121a'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText(icon,26,chipY+14.5);
    ctx.fillStyle='#fff'; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
    ctx.fillText(label,38,chipY+15);
    chipY+=26;
  };
  // the drink channel itself (progress seconds)
  if(p.drink){
    const def=IDEF[p.drink.slot&&p.drink.slot.id||'p_health']||IDEF.p_health;
    const left=Math.max(0,p.drink.max-p.drink.t);
    chip(def.color,'♥',(def.name+' '+left.toFixed(1)+'s').toUpperCase(),120);
  }
  for(const k in FX){
    const f=FX[k]; if(f.t<=0) continue;
    const icon=k==='speed'?'⚡':k==='strength'?'✊':k==='regen'?'✚':k==='fire'?'♨':'☠';
    chip(FXINFO[k].color,icon,FXINFO[k].label+' '+fmtClock(f.t),120);
  }
  // unlocked biome abilities with cooldown readouts
  if(p.abilities.dash)      chip('#9ad1ff','➶',p.dashCd>0?p.dashCd.toFixed(1)+'s':'SHIFT',86);
  if(p.abilities.whirl)     chip('#ffb36b','✹',p.whirlCd>0?p.whirlCd.toFixed(1)+'s':'G',86);
  if(p.abilities.regenPlus) chip('#7ecba0','✚','MEND 15s',86);
  if(p.abilities.pierce)    chip('#ff8a5e','⇒','PIERCE',86);
}
function drawInventory(){
  if(!state.inv) return;
  const p=player;
  ctx.fillStyle='rgba(4,3,8,0.72)'; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(720,VW-48), h=Math.min(470,VH-48);
  const x=(VW-w)/2, y=(VH-h)/2;
  ctx.fillStyle='rgba(14,12,19,0.97)'; roundRect(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle='rgba(255,170,80,0.5)'; ctx.lineWidth=2; roundRect(x+1,y+1,w-2,h-2,13); ctx.stroke();
  spacedText('INVENTORY',x+w/2,y+46,24,'#ffe08a');
  ctx.font='11px system-ui'; ctx.fillStyle='rgba(201,209,217,0.55)'; ctx.textAlign='center';
  ctx.fillText('click to move items · I to close · 1–5 hotbar · F uses the selected item',x+w/2,y+64);
  /* stats column */
  const colW=170, lx=x+24, ly=y+86;
  ctx.fillStyle='#ff8a5e'; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
  ctx.fillText('STATS',lx,ly);
  const rows=[['⚔ Damage',(p.dmg+p.swordBonus)+(fxActive('strength')?' +'+fxVal('strength'):'')],
              ['➶ Bow',p.bow?(9+p.bowLvl*5)+' dmg':'—'],['✚ Armor',(p.armor*8)+'%'],
              ['✦ Lantern','Lv.'+p.lightLvl],['● Gold',p.gold],['☠ Slain',killCount],
              ['➶ Arrows',countItem('arrows')]];
  rows.forEach((r,i)=>{
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='11px system-ui';
    ctx.fillText(r[0],lx,ly+22+i*20);
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(''+r[1],lx+colW-8,ly+22+i*20); ctx.textAlign='left';
  });
  /* satchel grid 9x3 */
  invHover=null;
  hoverTip=null;
  const S=36, gap=6, gridW=9*S+8*gap;
  const gx=x+w-gridW-28, gy=y+86;
  ctx.fillStyle='#ff8a5e'; ctx.font='bold 11px system-ui'; ctx.textAlign='right';
  ctx.fillText('SATCHEL',gx+gridW,gy-8);
  for(let i=0;i<SLOTS;i++){
    const cxx=gx+(i%9)*(S+gap), cyy=gy+((i/9)|0)*(S+gap);
    const hv=mouse.x>=cxx&&mouse.x<=cxx+S&&mouse.y>=cyy&&mouse.y<=cyy+S;
    drawSlotBox(cxx,cyy,S,p.slots[i],hv);
    if(hv){ invHover={arr:'slots',i,cxx,cyy,S}; if(p.slots[i]) hoverTip={slot:p.slots[i],x:cxx,y:cyy}; }
  }
  /* hotbar row */
  const hy=gy+3*(S+gap)+16;
  ctx.fillStyle='#ffd75e'; ctx.font='bold 11px system-ui'; ctx.textAlign='right';
  ctx.fillText('QUICK SLOTS  1-5',gx+gridW,hy-8);
  for(let i=0;i<HOTN;i++){
    const cxx=gx+i*(S+gap), cyy=hy;
    const hv=mouse.x>=cxx&&mouse.x<=cxx+S&&mouse.y>=cyy&&mouse.y<=cyy+S;
    drawSlotBox(cxx,cyy,S,p.hotbar[i],hv||p.sel===i);
    if(hv){ invHover={arr:'hotbar',i,cxx,cyy,S}; if(p.hotbar[i]) hoverTip={slot:p.hotbar[i],x:cxx,y:cyy}; }
  }
  if(heldStack){
    const def=IDEF[heldStack.id];
    ctx.font='bold 17px system-ui'; ctx.textAlign='center'; ctx.fillStyle=def.color;
    ctx.fillText(def.icon,mouse.x+10,mouse.y+10);
  }
  ctx.textAlign='center'; ctx.font='11px system-ui'; ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('R swap weapon · Q health potion · E interact · Space attack',x+w/2,y+h-20);
}
function invClick(){
  if(!invHover){
    if(heldStack){ addItem(heldStack.id,heldStack.count); heldStack=null; }
    return;
  }
  const arr=invHover.arr==='slots'?player.slots:player.hotbar;
  const i=invHover.i;
  if(heldStack){
    const cur=arr[i];
    if(cur && cur.id===heldStack.id && cur.count<IDEF[cur.id].stack){
      const take=Math.min(heldStack.count,IDEF[cur.id].stack-cur.count);
      cur.count+=take; heldStack.count-=take;
      if(heldStack.count<=0) heldStack=null;
    } else { arr[i]=heldStack; heldStack=cur||null; }
  } else if(arr[i]){ heldStack=arr[i]; arr[i]=null; }
  sfx('coin');
}


/* ---------------- main loop ---------------- */
genSurface();
spawnNPCs();
buildMinimap();
player.x=VILLAGE.x*TS+TS/2; player.y=(VILLAGE.y+2.2)*TS;
addItem('p_health',2);   // starter kit: 2 health potions land in the hotbar
addItem('p_speed',1);
addItem('p_strength',1);
addItem('arrows',10);
resize();

let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,0.05);
  last=now;
  update(dt);
  updateCam(dt);

  let ox=0, oy=0;
  if(state.shakeT>0){ const m=state.shakeMag*state.shakeT; ox=rnd(-m,m); oy=rnd(-m,m); }
  ctx.save();
  ctx.translate(ox,oy);

  if(state.floor===0){
    const tod=state.timeOfDay;
    const night=Math.max(0,Math.cos(tod*Math.PI*2));
    const sg=ctx.createLinearGradient(0,0,0,VH);
    sg.addColorStop(0, night?'#060614':'#5aa2e8');
    sg.addColorStop(1, night?'#141028':'#cfeffd');
    ctx.fillStyle=sg; ctx.fillRect(-30,-30,VW+60,VH+60);
    const ang=(tod-0.25)*Math.PI, R=Math.max(VW,VH)*0.85, hy=VH*0.62;
    const cx=VW/2-Math.cos(ang)*R, cy=hy-Math.sin(ang)*R;
    if(cy<hy){
      ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(cx,cy,26,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,224,134,0.35)'; ctx.beginPath(); ctx.arc(cx,cy,52,0,TAU); ctx.fill();
    } else if(night>0.25){
      const mang=ang+Math.PI, mx=VW/2-Math.cos(mang)*R, my=hy-Math.sin(mang)*R;
      ctx.fillStyle='#e8eefd'; ctx.beginPath(); ctx.arc(mx,my,18,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(232,238,253,0.3)'; ctx.beginPath(); ctx.arc(mx,my,40,0,TAU); ctx.fill();
    }
  } else {
    ctx.fillStyle=THEMES[state.floor].bg; ctx.fillRect(-30,-30,VW+60,VH+60);
  }
  drawTiles();
  for(const tr of torches){
    const sx=tr.x-cam.x, sy=tr.y-cam.y;
    if(sx>-30&&sy>-30&&sx<VW+30&&sy<VH+30) drawTorchOne(tr);
  }
  if(state.floor===0) drawFlowers();
  // locked doors and pressure plates
  for(const sw of switches){
    const sx=sw.x*TS-cam.x, sy=sw.y*TS-cam.y;
    if(sx<-30||sy<-30||sx>VW+30||sy>VH+30) continue;
    ctx.fillStyle=sw.active?'#7ee787':'#e8e2d0';
    ctx.beginPath(); ctx.arc(sx+TS/2,sy+TS/2,7,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx+TS/2,sy+TS/2,7,0,TAU); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx+TS/2,sy+TS/2,3,0,TAU); ctx.fill();
  }
  for(let ty=Math.max(0,Math.floor(cam.y/TS)-1);ty<=Math.min(mapH-1,Math.floor((cam.y+VH)/TS)+1);ty++)
  for(let tx=Math.max(0,Math.floor(cam.x/TS)-1);tx<=Math.min(mapW-1,Math.floor((cam.x+VW)/TS)+1);tx++){
    if(tileAt(tx,ty)!==T_DOOR) continue;
    const sx=tx*TS-cam.x, sy=ty*TS-cam.y;
    ctx.fillStyle='#4a3a22'; ctx.fillRect(sx+2,sy+2,TS-4,TS-4);
    ctx.strokeStyle='#8a7a5a'; ctx.lineWidth=2; ctx.strokeRect(sx+2,sy+2,TS-4,TS-4);
    ctx.fillStyle='#5a4a2a'; ctx.fillRect(sx+8,sy+8,TS-16,TS-16);
  }

  // depth-sorted entities
  const drawables=[];
  if(state.floor===0){
    const tx0=Math.max(0,Math.floor(cam.x/TS)-2), tx1=Math.min(mapW-1,Math.floor((cam.x+VW)/TS)+2);
    const ty0=Math.max(0,Math.floor(cam.y/TS)-2), ty1=Math.min(mapH-1,Math.floor((cam.y+VH)/TS)+2);
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
      const tr=treeGrid.get(tx+','+ty);
      if(tr) drawables.push({y:tr.y,fn:()=>drawTreeOne(tr)});
    }
    for(const rk of rocks){
      const sx=rk.x-cam.x, sy=rk.y-cam.y;
      if(sx>-40&&sy>-40&&sx<VW+40&&sy<VH+40) drawables.push({y:rk.y,fn:()=>drawRockOne(rk)});
    }
    for(const n of npcs) drawables.push({y:n.y,fn:()=>drawNPC(n)});
    if(entrance) drawables.push({y:entrance.y,fn:()=>drawPortalOne(entrance)});
  }
  for(const c of chests){
    const sx=c.x-cam.x, sy=c.y-cam.y;
    if(sx>-40&&sy>-40&&sx<VW+40&&sy<VH+40) drawables.push({y:c.y,fn:()=>drawChestOne(c)});
  }
  for(const s of shrines){
    const sx=s.x-cam.x, sy=s.y-cam.y;
    if(sx>-50&&sy>-50&&sx<VW+50&&sy<VH+50) drawables.push({y:s.y,fn:()=>drawShrineOne(s)});
  }
  for(const a of state.biomeAltars){
    const sx=a.x-cam.x, sy=a.y-cam.y;
    if(sx>-60&&sy>-60&&sx<VW+60&&sy<VH+60) drawables.push({y:a.y,fn:()=>drawAltarOne(a)});
  }
  if(state.portal) drawables.push({y:state.portal.y,fn:()=>drawPortalOne(state.portal)});
  for(const e of enemies){
    const sx=e.x-cam.x, sy=e.y-cam.y;
    if(sx>-60&&sy>-60&&sx<VW+60&&sy<VH+60) drawables.push({y:e.y,fn:()=>drawEnemy(e)});
  }
  if(state.boss) drawables.push({y:state.boss.y,fn:drawBoss});
  drawables.push({y:player.y,fn:drawPlayer});
  drawables.sort((a,b)=>a.y-b.y);

  drawBuildings();
  drawDrops();
  for(const d of drawables) d.fn();
  drawArrows();
  drawParticles();
  drawTexts();
  drawDarkness();
  if(state.dbg) drawDebug();
  ctx.restore();

  if(state.mode==='title') drawTitle();
  else {
    drawHUD();
    drawFXHUD();
    drawHotbarHUD();
    drawDialog();
    if(state.paused) drawPaused();
    if(state.mode==='dead') drawDead();
    if(state.mode==='victory') drawVictory();
  }
  drawCine();
  drawInventory();
  drawItemTooltip();
  drawTrans();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
